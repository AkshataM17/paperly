[project]
name = "paper2vid"
version = "0.1.0"
description = "Paste a paper link, get it explained."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "resvg-py>=0.4",
  "pillow>=10.0",
]

[project.optional-dependencies]
local-tts = ["kokoro-onnx>=0.4", "soundfile>=0.12"]
# one call signature across providers; optional, the built-in
# adapters work without it
litellm = ["litellm>=1.40"]
# expose the pipeline as tools to any MCP client
mcp = ["mcp>=2.0"]

[project.scripts]
paper2vid = "paper2vid.cli:main"
paperly-mcp = "paper2vid.mcp_server:main"

# Without this, setuptools tries to guess which top-level directory is the
# package. In the container that guess fails, because seed/ and tests/ sit
# alongside paper2vid/ and it refuses to choose. Naming it ends the guessing.
[tool.setuptools]
packages = ["paper2vid"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"