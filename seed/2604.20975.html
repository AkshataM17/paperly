23\"/><text x=\"960\" y=\"558\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"18\" fill=\"#1A1D23\">EARTH</text></g><g data-reveal=\"0.2\"><circle cx=\"400\" cy=\"280\" r=\"16\" fill=\"#2A6F97\"/><circle cx=\"1520\" cy=\"280\" r=\"16\" fill=\"#2A6F97\"/><circle cx=\"340\" cy=\"700\" r=\"16\" fill=\"#2A6F97\"/><circle cx=\"1580\" cy=\"720\" r=\"16\" fill=\"#2A6F97\"/><circle cx=\"960\" cy=\"200\" r=\"16\" fill=\"#2A6F97\"/><line x1=\"416\" y1=\"288\" x2=\"938\" y2=\"492\" stroke=\"#2A6F97\" stroke-width=\"1.5\"/><line x1=\"1505\" y1=\"290\" x2=\"982\" y2=\"490\" stroke=\"#2A6F97\" stroke-width=\"1.5\"/><line x1=\"354\" y1=\"694\" x2=\"938\" y2=\"516\" stroke=\"#2A6F97\" stroke-width=\"1.5\"/><line x1=\"1566\" y1=\"712\" x2=\"982\" y2=\"516\" stroke=\"#2A6F97\" stroke-width=\"1.5\"/><line x1=\"960\" y1=\"216\" x2=\"960\" y2=\"474\" stroke=\"#2A6F97\" stroke-width=\"1.5\"/></g><g data-reveal=\"0.5\"><rect x=\"550\" y=\"780\" width=\"820\" height=\"64\" fill=\"#EDE9E0\" stroke=\"#D6215F\" stroke-width=\"2\"/><text x=\"960\" y=\"817\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#D6215F\">SIGNAL MUST APPEAR IN MULTIPLE PULSARS</text></g><g data-reveal=\"0.75\"><text x=\"960\" y=\"900\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#6B7280\">Precise pulsar distances needed for coherent reconstruction</text></g>\n</svg>"}, {"id": "s10", "narration": "Before this work, pulsar timing arrays could only hear black hole binaries that were still spiraling. Now we know they can hear mergers that already happened \u2014 events that ended thousands of years ago, preserved in pulsar light still crossing the galaxy today. A whole archive of the universe's most violent collisions may already be encoded in data we're collecting right now.", "kind": "title", "eyebrow": "WHAT'S NOW POSSIBLE", "prebaked": {}, "headline": "Past Mergers Are Now Observable", "deck": "Pulsar timing arrays can recover collisions that ended thousands of years ago."} window.__CONTEXT__ = {"digest": "TITLE: Probing past mergers of supermassive black holes with pulsar timing arrays: The role of pulsar terms\nARXIV: 2604.20975\nABSTRACT: By monitoring the times of arrival of radio pulses from millisecond pulsars, Pulsar Timing Arrays (PTAs) serve as unique gravitational wave (GW) laboratories in the nanohertz band. To date, the primary astrophysical sources of GWs targeted in this frequency range have been inspiraling supermassive black hole binaries (SMBHBs) on circular and eccentric orbits. In this work, we demonstrate that, thanks to the so-called pulsar term in the timing residual waveform of GW signals, PTAs can probe individual SMBHBs that merged before timing observations began. We refer to the latter as zombie binaries. Using SMBHB population models consistent with current PTA constraints, we find that while the probability of detecting such systems in existing PTA datasets remains low, the Square Kilometer Array observatory is expected to achieve sufficient sensitivity to have a few zombie binaries with optimal matched filter signal-to-noise ratios exceeding 3 in its data. Although their confident identification might be challenging, this new class of PTA sources opens a novel window for studying the most massive SMBHBs in our local universe.\n\nFIGURES (refer to these by ref):\n  [F1] Detection efficiency for SNR_ th=3 of zombie binaries as a function of redshift and rest-frame chirp mass, for the three PTAsconfigurations considered. See Table 2 for details on the settings used for each array. Because our estimate of the detection efficiency is based on 10 000 simulated binaries, our sensitivity is restricted to probabilities above 10^-4 . We overlay, using dotted, solid, and d\n\nEQUATIONS (LaTeX):\n  R_{\\rm GW}^{(a)}(t)=\\sum_{A\\in\\{+,\\times\\}}F^{A}_{a}\\int^{t}\\mathrm{d}{t^{\\prime}}\\left[h_{A}\\left(t^{\\prime}\\right)-h_{A}\\left(t^{\\prime}-\\tau_{a}\\right)\\right],\n  F^{A}_{a}\\equiv\\frac{\\hat{p}_{a}^{i}\\hat{p}_{a}^{j}e^{A}_{ij}(\\hat{n})}{2(1+\\hat{n}\\cdot\\hat{p}_{a})}.\n  \\tau_{a}\\equiv\\left(1+\\hat{p}_{a}\\cdot\\hat{n}\\right)T_{a},\n  \\frac{\\mathrm{d}f_{\\rm orb}}{\\mathrm{d}t}=\\frac{1}{2\\pi}\\frac{96}{5}\\left(\\frac{G\\mathcal{M}_{\\rm c}}{c^{3}}\\right)^{5/3}\\left(2\\pi f_{\\rm orb}\\right)^{11/3},\n  f_{\\rm orb}^{(\\mathrm{P},\\>a)}=f_{\\rm orb}^{\\rm(ISCO)}\\left[1+\\frac{\\tau_{a}-\\tau_{\\rm c}}{T_{\\rm c}\\left(f_{\\rm orb}^{\\rm(ISCO)}\\right)}\\right]^{-3/8},\n  \\tau_{\\rm c}\\geq\\tau_{\\rm c}^{\\rm(min)}\\equiv T_{\\rm c}\\left(f_{\\rm orb}^{\\rm(ISCO)}\\right)\\left[1-\\left(\\frac{f_{\\rm th}}{f_{\\rm orb}^{\\rm(ISCO)}}\\right)^{-8/3}\\right].\n  \\langle N\\rangle=\\int\\mathrm{d}\\vec{\\xi}_{\\rm I}\\frac{\\mathrm{d}^{3}n}{\\mathrm{d}\\vec{\\xi}_{\\rm I}}\\frac{4\\pi cd_{\\rm L}^{2}}{(1+z)^{2}}\\left(2T^{\\rm(max)}-\\tau_{\\rm c}^{\\rm(min)}\\right),\n  \\mathrm{SNR}=\\sqrt{\\sum_{a=1}^{N_{\\rm psr}}\\vec{R}_{\\rm z}^{(a)\\mathrm{T}}\\textbf{C}_{a}^{-1}\\vec{R}^{(a)}_{\\rm z}},\n\nSECTIONS:\n## I Introduction\nRecently, Pulsar Timing Array (PTA)collaborations have reported compelling evidence for the presence of Gravitational Wave (GW)signals in their datasets 8; 5; 72; 55; 42. The primary source of these nanohertz GWsis believed to be the population of inspiraling Supermassive Black Hole Binaries (SMBHBs)54; 33, which are expected to form within the hierarchical model of galaxy formation 46; 37. If supermassive black hole pairs manage to efficiently reach sub-parsec separation within a Hubble time 43 \u2013 through dynamical friction and stellar hardening 12; 52 \u2013 they become efficient sources of GWsin the 1-100 nanohertz band, until they merge at orbital frequencies of hundreds of nanohertz. Therefore, binaries emitting in the PTAband are generally thousands to millions of years from merger and are thus expected to be observed as quasi-monochromatic sources over PTAstimescale. Up to now, PTAshave searched for SMBHBsusing three main approaches. The first involves detecting the stochastic GWbackground produced by the population of binaries, which is expected to imprint a quadrupolar correlation pattern among pulsars\u2019 timing residuals, known as the Hellings-Downs curve 31. The presence of such a signal has been reported with strong evidence by various PTAs, along with a characterization of its power spectral density in the 1-10 nanohertz range, mostly consistent across collaborations 2. Although potentially degenerate with, for example, other cosmological GWbackgrounds 1; 9, the identification of significant anisotropies 44; 35, non-stationarities 23 or non-Gaussianities 38; 24 could help proving the astrophysical origin of the stochastic signal. But collaborations have not yet found strong evidence of such features 22; 28; 6; 15. The second, more direct approach is the search for GWsignals from individual binaries, inspiraling on circular or eccentric orbits, in the PTAdata 39; 58; 64. The pulsars\u2019 timing residuals induced by an inspiraling SMBHBare made of two terms, respectively produced by the metric perturbation at the pulse emissions (pulsar term) and their reception (Earth term). Assuming that the SMBHBdynamics is driven by GWsemission, a deterministic template for both the Earth and pulsar terms in each pulsar timing residuals can be derived and searched for in PTAdata. So far, no conclusive evidence for the presence of such a system has been reported 3; 10. Finally, PTAsare also sensitive to the GWmemory signal produced by SMBHBcoalescences. If the memory wavefront from a binary merger passes through the Earth during the detector\u2019s observation period, it will \u2013 at leading order \u2013 produce deterministic linear trends in the pulsars\u2019 timing residuals (see 26; 67; 40; 16 for further discussion of memory signals in PTAdata). While in principle observable, these events are expected to be rare, as they require a sufficiently massive and nearby SMBHBto \n## II Zombie binary signals\nIn PTAs, the signal produced by a GWsource consists of two contributions, usually referred to in the literature as the Earth term and the pulsar term 19. The arrival time of a radio pulse emitted by a pulsar a is influenced by the metric perturbation both at the moment of its emission (at the pulsar) and at the moment of its reception (at Earth). This is explicit in the expression of the induced timing residuals (see e.g. 59), where hA denotes the plane-wave metric perturbation propagating along , and F^Aa are the antenna pattern response functions of the pulsar for the + and polarization modes which, using Einstein summation on spatial indices i,j , can be expressed as We introduced the polarization tensors e^A and the unit position vector of pulsar a , . In Eq. 1, we see that while the Earth term of the timing residuals correspond to the integrated strain signal today, the pulsar term introduces a geometrical time delay, where is the unperturbed time of flight to Earth of the radio photons11 1 In this study, we do not consider any chromatic effect on the timing residuals and assume that all observations are done at a radio frequency of 1400 MHz. emitted by pulsar a . For galactic pulsars monitored by PTAs, the corresponding time delay is on the order of several thousand years and attains its maximum value of 2Ta when the GWsource lies in the direction on the sky opposite to that of the pulsar. In this work, we investigate the possibility to probe binaries that either merged before the PTAexperiment began or which are on the verge of merging. For such systems, the corresponding Earth terms vanish or lie outside the PTAband. However, some pulsars can still exhibit non-zero pulsar terms for binaries that coalesced on timescales up to thousands of years in the past. We therefore refer to this new class of PTAsources as zombie binaries. At 0 -Post-Newtonian (PN)order, the orbital frequency evolution of SMBHBson circular orbit with dynamics driven by GWemission is, in the observer frame, given by 48 where is the observer-frame binary chirp mass. Because Eq. 4 strongly depends on the binary\u2019s orbital frequency, f_ orb , a zombie binary that merged before the start of the PTAexperiment could still produce pulsar term signals within the PTAfrequency band. Indeed, for a binary that coalesced at time t_ c in the observer frame, the orbital frequency of the binary as seen in the pulsar term of a given pulsar can be obtained by integrating Eq. 4, assuming that at t_ c , we have f_ orb=f_ orb^(ISCO) , the orbital frequency of the binary at its innermost stable circular orbit. This yields, where , is the time delay separating the starting date of the PTAobservations, t\u2080 , from the binary merger. We introduced the characteristic coalescence time of the binary from the orbital frequency f_ orb , . We emphasize that we assume the binaries have been on circul\n## III Occurrence of zombie binaries\nWe now aim to quantify the probability of having resolvable zombie binaries in a given PTAdataset. To assess the detectability of a zombie binary, we use the system\u2019s optimal matched filter SNRand rely on specific SNRthresholds to estimate its detectability. In the following, we define zombie binaries as binaries whose Earth term orbital frequency at t\u2080 , f_ orb^(E) , exceeds a threshold frequency, f_ th . We note that this includes the case of binaries that merged before t\u2080 , for which we consider that . In this paper, we use , a frequency at the edge of the PTAband. We emphasize that increasing this threshold has a negligible impact on our results, since the number of binaries that merge during the PTAobservation (or shortly thereafter) is negligible compared to the number of binaries that have merged in the past thousands of years. Since zombie binaries may already have coalesced at t\u2080 , instead of distributing the SMBHBsover their Earth term orbital frequency \u2013 as is usually done in the PTAliterature 21; 57; 14 \u2013 we use their coalescence time as dynamical variable, through \u03c4_ c . The distribution of merging SMBHBscan be obtained from their comoving merger density, n , using where we distribute the binaries over redshift, rest-frame chirp mass (expressed in base-10 logarithm of solar masses), and mass ratio, using the vector . In Eq. 7, d_ L denotes the luminosity distance to a binary at redshift z \u2013 computed using the Planck 2018 cosmology 51 \u2013 which enters the expression for the differential comoving volume element, dV_ c/dz 32. Note that quantities evaluated in the binary rest frame are systematically indexed by the subscript r . Given our definition of zombie binaries, we can compute their average number across universe realizations by integrating Eq. 7 over the corresponding \u03c4_ c range. The first condition that a zombie binary must meet is that , since their associated Earth terms must be null or inaccessible to PTAs. Using Eq. 5 with \u03c4a=0 , this reads We note that, for highly massive binaries satisfying , this condition is replaced by , to ensure that the binary merges before t\u2080 . In addition, a zombie binary can potentially be detected by a PTAonly if its inspiral can be observed at least by the pulsar term of the most distant pulsar of the array. A zombie binary therefore must also verify , where T^(max) is the photons\u2019 time of flight associated with this most distant pulsar. Consequently, the average number of zombie binary signals potentially present in a given PTAdataset can be evaluated using where we omitted the dependence of \u03c4_ c^(min) over . Since a large fraction of these zombie binaries will correspond to very low SNRvalues regardless of the PTAconsidered, we instead compute the expectation value for the number of zombie binaries with a SNRhigher than a certain threshold SNR_ th , introducing the detection efficiency of th\n## IV Comoving merger density models\nIn order to compute Eq. 10, one needs a model for the comoving SMBHBmerger density function, n . We model it using the Schechter-like parametric model introduced in 41, which depends on five parameters: the spectral indices \u03b1 and \u03b2 , the chirp mass and redshift exponential cutoffs and z\u2080 and the comoving merger rate normalizing factor, . In order to quantify the dependence of our results on the comoving merger density model, we follow 56 and consider three different sets of parameters, given in Table 1. For each model, we adjust the value of so that the GWbackground characteristic strain amplitude induced by the population is consistent with current PTAobservations. Using the Phinney theorem 49, we set . The comoving merger density associated with each model \u2013 integrated over redshift \u2013 are shown in Figure 2. We note that our choice of models reflects the current uncertainty regarding the population of SMBHBslikely to be responsible for the PTAsignal 9; 4. For example, M1 includes a large number of relatively low-mass binaries, while M2 favors a smaller number of higher-mass systems.\n## V The zombie detection efficiency\nThe second ingredient needed to evaluate is the detection efficiency which only depends on the PTAconfiguration considered. Since here, we neglect the influence of the binary mass ratio on , we numerically approximate it over a redshift and rest-frame chirp mass grid, fixing q=1 . For a given pair of intrinsic parameters, we generate 10 000 binaries drawing from uniform distribution their coalescence time and extrinsic parameters: sky location, polarization angle, inclination angle and orbital phase at coalescence. We then compute the SNRof each of these zombie binaries and approximate taking the fraction of binaries satisfying . To compute the zombies\u2019 optimal matched filter SNRs, we sum in quadrature the squared SNRcontributions from each pulsar of the PTA: where are the timing residuals induced by the zombie binary in pulsar a and bfCa is the  a sub-dominant contribution to PTAsensitivities at the frequencies where zombie binaries ar\n## VI Results\nIn order to quantify the capacity of PTAsto probe zombie binaries, we consider representative configurations for past, current and future PTAdatasets, which are summarized in Table 2. They aim to represent respectively the sensitivity of the European PTA (EPTA) second data release (referred to as DR2new in 7), the upcoming International PTA (IPTA) third data release (DR3) and a potential future sensitivity of the Square Kilometer Array (SKA) observatory 61. For the IPTA DR3-like sensitivity, we consider 130 pulsars present in the previously published collaboration datasets, fixing their observing time to 10 years, with an observing cadence of 5 days. For the SKA configuration, we use 124 pulsars of our IPTA-like dataset with declination angle below 34 and added randomly 6 pulsars from 60. For pulsars whose distances to Earth could not be estimated, we randomly assign them a distance from 0.5 to 2.5 kiloparsecs using uniform weighting. In Figure 3, we show the detection efficiency for zombie binaries, evaluated for each PTAconfiguration, under the most optimistic detection threshold, SNR_ th=3 . We find that the EPTA DR2new-like dataset can only probe massive systems with at redshift below 0.03 . However, such PTAscould probe the very massive \u2013 but rare \u2013 mergers with up to . Since the SNRsof zombie binaries scale as , the situation improves only slightly for our IPTA DR3 setting. However, the true IPTA DR3 dataset will be much more heterogeneous with some pulsars having an observing time longer than 10 years with a better cadence, as well as lower timing precision 2. This could significantly enhance the detection efficiency of this dataset and we therefore regard our IPTA sensitivity as a conservative baseline. Going to the SKA configuration, we find that zombie binaries of a few billion solar masses (or above) are associated with high detection efficiency up to redshift 1 . Less massive mergers with only have a reasonable chance to exceed the detection threshold providing they happened at very low redshift, typically at . In order to quantify the dependence of the zombie detection efficiency on the SNRthreshold considered, we overlay in Figure 3 the contours corresponding to , with SNR_ th=3 , 5 , and 10 , shown as dotted, solid, and dashed lines, respectively. At low redshift ( ), and low chirp masses ( ), the shifts of the contours toward higher chirp masses simply reflect the scaling of the zombie SNRwith the latter44 4 Indeed, combining Eqs. 1 and 5, it is straightforward to show that the average zombie binary timing residual amplitude scales as . Therefore, in Eq. 10, if the noise contribution is assumed to be constant across binaries, we expect, e.g., a factor of between the dotted and dashed contours in Figure 3, which is indeed recovered.. However, at higher redshift and for higher-mass systems, this simple scaling no longer holds. T\n## VII Discussion\nIn this work, we demonstrated that PTAshave the capacity of probing the mergers of SMBHBsthat occurred before the start of the experiment. This new class of PTAsources \u2013 which we call zombie binaries \u2013 are accessible thanks to the time delays of several thousands of years that separate the so-called pulsar term from the Earth term in the timing residuals induced by a GWsource. Considering the case of circular binaries driven by GWemission, we estimated the number of zombie binaries with a SNRgreater than 3 that past (EPTA DR2), current (IPTA DR3) and future (SKA) PTAdatasets are likely to be sensitive to. In order to capture the current uncertainty on the merger rate of SMBHBs, we considered three analytic comoving merger density models \u2013 based on Schechter-like functions \u2013 compatible with current PTAobservations. While EPTA DR2-like datasets lack sensitivity to yield a significant probability of detecting zombie binaries, we find that, for SMBHBsmodels favoring large mass systems (with ), the IPTA DR3 dataset has a 23% probability of containing at least one zombie binary with SNR>3 . For the SKA sensitivity considered here, we find that, for all population models, this probability is greater than 90% . We predict that a few bright zombie binaries \u2013 with SNRin the range [3,10] \u2013 are likely to be present in future SKA datasets if the currently observed PTAsignal is sourced by a population of SMBHBs. These massive mergers ( ) associated with pulsar term signals\u2019 frequency on the order of 10 nanohertz, will typically be probed at low redshift ( ). However, we note that these findings rely on the assumption that SMBHBsare on circular orbits. If the signal observed by PTAsoriginates from a population of binaries that are on very eccentric orbits when entering the PTAband \u2013 as recent studies suggest 53; 25 \u2013 then zombie binaries may still have significant eccentricities. Because the orbital evolution of eccentric binaries is faster, zombie binaries could be found at lower orbital frequencies than in the circular case. This should be explored in future work. We also note that the SNRcalculations used in this work do not account for our current uncertainty about the pulsar distances and therefore could be considered optimistic. However, precise distance measurements using very long baseline interferometry are becoming increasingly common for millisecond pulsars 18. In addition, the significant improvement in timing precision allowed by the SKA is expected to enable pulsar distance measurements with less than 5% error for the pulsars\u2019 distances considered in this work 62. Achieving a distance accuracy for pulsars on the order of hundreds of light-years will allow precise determination of the frequencies of the pulsar terms. This will help the coherent reconstruction of zombie binary signals across multiple pulsars, which is required for a future robus\n## Data Availability\nThe data and scripts used to produce the findings of this work are openly available at https://github.com/hquelquejay/zombie-binaries-pta.", "title": "Probing past mergers of supermassive black holes with pulsar timing arrays: The role of pulsar terms", "arxiv_id": "2604.20975"};

<script>
const S = window.__SCENES__, CTX = window.__CONTEXT__;
const $ = (s, r) => (r || document).querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t);
  if (c) n.className = c; if (x != null) n.textContent = x; return n; };

function key() { return localStorage.getItem('p2v_key') || ''; }

// The model answers in markdown. Rendered as plain text it arrives as a wall
// of asterisks and hashes, which reads worse than no formatting at all.
// Escape first, then allow only the few marks that actually appear.
function md(t) {
  const esc = String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                       .replace(/>/g, '&gt;');
  return esc
    .replace(/^#{1,6}\s*(.+)$/gm, '<b class="mdh">$1</b>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^[-\u2022]\s+(.+)$/gm, '<span class="mdli">$1</span>')
    .replace(/\n{2,}/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

// A page built by `paper2vid --serve` is opened from that same server, which
// already has a key in its environment -- asking the reader for one again is
// just friction. The same file opened from disk has no server behind it, so
// it falls back to BYOK. One artefact, both situations, decided at runtime.
let RELAY = false;
(async () => {
  try {
    const r = await fetch('/api/health', { cache: 'no-store' });
    RELAY = r.ok && (await r.json()).ok === true;
  } catch (e) { RELAY = false; }
  if (!RELAY) document.getElementById('kb').hidden = false;
})();

// Anthropic caps images around 1568px on the long edge; bigger just costs
// tokens for no gain. Plots are line art, so we keep PNG unless the payload
// is large enough that JPEG is worth the artefacts.
async function prepImage(dataUri) {
  const [head, b64] = dataUri.split(',');
  const media = head.slice(5, head.indexOf(';'));
  if (b64.length < 3_000_000) {
    const img = await new Promise((res, rej) => {
      const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUri;
    }).catch(() => null);
    if (img && Math.max(img.width, img.height) <= 1568)
      return { type: 'base64', media_type: media, data: b64 };
  }
  const img = await new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUri;
  });
  const k = Math.min(1, 1568 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const out = c.toDataURL('image/jpeg', 0.92);
  return { type: 'base64', media_type: 'image/jpeg', data: out.split(',')[1] };
}

async function ask(question, sc, into, cacheKey) {
  const k = key();
  if (!RELAY && !k) { into.className = 'answer err';
    into.textContent = 'Add your API key at the top of the page first. It stays in this browser.';
    return; }
  into.className = 'answer thinking'; into.textContent = 'Reading the figure...';

  const hasFig = sc.kind === 'figure' && sc.src;
  const sys = 'You are explaining a specific research paper to a curious reader '
    + 'who is not in this subfield.\n'
    + (hasFig
       ? 'The figure the reader is looking at is attached. Read it directly: '
         + 'legends, axis labels, line colours and styles, which curve is which. '
         + 'Questions about what a colour or marker represents are answered from '
         + 'the image, and you should answer them concretely.\n'
       : '')
    + 'Everything else must come from the paper context. If neither the image '
    + 'nor the context answers the question, say so plainly -- never invent '
    + 'numbers, results or comparisons. Two or three sentences. Plain words.';

  const text = 'PAPER CONTEXT:\n' + CTX.digest
    + '\n\nThe reader is looking at this part:\n' + sc.narration
    + (sc.caption ? '\nFigure caption: ' + sc.caption : '')
    + '\n\nTheir question: ' + question;

  try {
    const content = [];
    if (hasFig) {
      try { content.push({ type: 'image', source: await prepImage(sc.src) }); }
      catch (e) { /* fall back to text-only rather than failing the question */ }
    }
    content.push({ type: 'text', text });

    if (RELAY) {
      const r = await fetch('/api/ask', { method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ content, system: sys,
                               cache: cacheKey || null,
                               paper: CTX.arxiv_id,
                               q: cacheKey ? '' : question }) });
      const d = await r.json();
      // Running out of free questions is not an error -- it is the product
      // working. Say so, and offer the way forward, rather than showing a
      // raw failure string.
      if (r.status === 402 || d.reason) {
        into.className = 'answer'; into.textContent = '';
        showWaitlist(d.message || 'That was your free question.');
        return;
      }
      if (d.error) throw new Error(d.error);
      into.className = 'answer'; into.innerHTML = md(d.text);
      return;
    }
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': k,
                 'anthropic-version': '2023-06-01',
                 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 700,
                             system: sys,
                             messages: [{ role: 'user', content }] })
    });
    if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 200));
    const d = await r.json();
    into.className = 'answer';
    into.innerHTML = md(d.content.filter(b => b.type === 'text')
                                 .map(b => b.text).join(''));
  } catch (e) {
    into.className = 'answer err';
    into.textContent = 'Request failed: ' + e.message;
  }
}

function renderScene(sc) {
  const s = el('section', 'scene');
  if (sc.eyebrow) s.appendChild(el('p', 'eyebrow', sc.eyebrow));

  if (sc.kind === 'title') {
    const h = el('div', 'headcard');
    h.appendChild(el('h2', null, sc.headline));
    if (sc.deck) h.appendChild(el('p', null, sc.deck));
    s.appendChild(h);
  } else if (sc.kind === 'svg') {
    const d = el('div'); d.innerHTML = sc.svg;
    // The video bakes these reveals to a clock. Here they belong to the
    // reader's scroll: the same staged build, paced by them, not at them.
    d.querySelectorAll('[data-reveal]').forEach(n => n.removeAttribute('opacity'));
    s.appendChild(d);
  } else {
    const plate = el('div', 'plate');
    const img = new Image(); img.src = sc.src; img.alt = 'Figure ' + (sc.ref || '') + ' from the paper';
    plate.appendChild(img);

      const h = el('div', 'hit');
      h.style.left = (a.x * 100) + '%'; h.style.top = (a.y * 100) + '%';
      h.appendChild(el('span', null, a.label));
      h.onclick = () => askAbout(s, sc,
        'What is happening at the point labelled "' + a.label
        + '" on this figure?',
        CTX.arxiv_id + ':' + sc.id + ':mark:' + a.label);
      plate.appendChild(h);
    });
    s.appendChild(plate);
    if (sc.caption) s.appendChild(el('p', 'caption', sc.caption));
    s.appendChild(el('p', 'hint', 'Click a marked point to ask about it'));
  }

  s.appendChild(el('p', 'narration', sc.narration));

  const bar = el('div', 'ask');
  // These three were answered when the page was built. Serving the stored
  // answer costs nothing and appears instantly; only free-text questions

  const canned = [
   ['Why does this matter?', 'Why does this part matter?', 'matters'],
   ['Explain simpler', 'Explain this part again, simpler, no jargon.', 'simpler'],
   ['Go deeper', 'Explain the technical detail behind this part.', 'deeper']];
  if (sc.kind === 'figure')
    canned.splice(1, 0, ['Read this figure',
      'Walk me through this figure: what is on each axis, what each colour, '
      + 'line style and marker represents, and what the reader should notice.',
      'figure']);
  canned
    .forEach(([label, q, key]) => {
      const b = el('button', null, label);
      b.onclick = () => {
        const ready = sc.prebaked && sc.prebaked[key];
        if (ready) {
          let a = s.querySelector('.answer');
          if (!a) { a = el('div', 'answer'); s.appendChild(a); }
          a.className = 'answer'; a.textContent = ready;
          a.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          return;
        }
        askAbout(s, sc, q, CTX.arxiv_id + ':' + sc.id + ':' + key);
      };
      bar.appendChild(b);
    });
  const inp = el('input'); inp.placeholder = 'Ask anything about this part...';
  inp.onkeydown = e => { if (e.key === 'Enter' && inp.value.trim()) {
    askAbout(s, sc, inp.value.trim()); inp.value = ''; } };
  bar.appendChild(inp);
  s.appendChild(bar);
  return s;
}

function askAbout(section, sc, question, cacheKey) {
  let a = $('.answer', section);
  if (!a) { a = el('div', 'answer'); section.appendChild(a); }
  a.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  ask(question, sc, a, cacheKey);
}

// The limit is the one moment a reader actually wants more, so it takes over
// the screen rather than sitting in the answer box.
function showWaitlist(msg) {
  let v = document.getElementById('p2v-veil');
  if (!v) {
    v = el('div'); v.id = 'p2v-veil'; v.className = 'veil';
    v.innerHTML =
      '<div class="cardwrap"><button class="x">Close</button>'
      + '<div class="card"><h3>That was your free question.</h3>'
      + '<p class="msg"></p>'
      + '<form><input type="email" placeholder="you@university.edu" required>'
      + '<button type="submit">Join waitlist</button></form>'
      + '</div></div>';
    document.body.appendChild(v);
    v.querySelector('.x').onclick = () => { v.className = 'veil'; };
    v.onclick = (e) => { if (e.target === v) v.className = 'veil'; };
    v.querySelector('form').onsubmit = async (e) => {
      e.preventDefault();
      const inp = v.querySelector('input');
      if (!inp.value.trim()) return;
      const f = v.querySelector('form');
      try {
        const w = await fetch('/api/waitlist', { method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email: inp.value.trim() }) });
        const wd = await w.json();
        f.innerHTML = wd.ok
          ? '<span class="ok">You are on the list. Thank you.</span>'
          : '<span class="ok">That address did not look right.</span>';
      } catch (err) {
        f.innerHTML = '<span class="ok">Could not reach the server.</span>';
      }
    };
  }
  v.querySelector('.msg').textContent = msg;
  v.className = 'veil on';
  setTimeout(() => { try { v.querySelector('input').focus(); } catch (e) {} }, 60);
}

const wrap = $('.wrap');
S.forEach(sc => wrap.appendChild(renderScene(sc)));

// Reveal groups carry a 0-1 fraction from the storyboard. Map it onto a
// stagger so a scene assembles in the order its narration explains it.
const REVEAL_MS = 950;
const obs = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const s = e.target;
    s.classList.add('in');
    s.querySelectorAll('[data-reveal]').forEach(n => {
      const f = parseFloat(n.getAttribute('data-reveal')) || 0;
      setTimeout(() => n.classList.add('lit'), 260 + f * REVEAL_MS);
    });
    s.querySelectorAll('.hit').forEach((n, i) => {
      setTimeout(() => n.classList.add('lit'), 520 + i * 220);
    });
    obs.unobserve(s);
  });
}, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
document.querySelectorAll('.scene').forEach(s => obs.observe(s));

const ki = $('#k');
ki.value = key();
ki.oninput = () => localStorage.setItem('p2v_key', ki.value.trim());
</script>
