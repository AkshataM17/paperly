<script>
window.__SCENES__ = [{"id": "s1", "narration": "Here's a strange prediction from quantum field theory. An accelerating observer should feel warm \u2014 they should detect particles even in what an inertial observer calls empty vacuum. This is the Unruh effect. It's been predicted for fifty years. We've never directly measured it. The required accelerations are enormous.", "kind": "title", "eyebrow": "QUANTUM FIELD THEORY", "prebaked": {}, "headline": "Empty Space Feels Warm If You're Accelerating", "deck": "The Unruh effect is fifty years old and still unmeasured"}, {"id": "s2", "narration": "The core idea is an Unruh-DeWitt detector \u2014 a two-level quantum system dragged through a field vacuum. If it clicks, it means the vacuum looks thermal from an accelerating frame. The problem is scale. Measuring a detectable signal requires accelerations far beyond anything in a lab. So physicists build analogs using sound in cold quantum gases.", "kind": "svg", "eyebrow": "THE DETECTOR CONCEPT", "prebaked": {}, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\">\n  <line x1=\"200\" y1=\"540\" x2=\"1720\" y2=\"540\" stroke=\"#DCDAD4\" stroke-width=\"1\"/>\n  <text x=\"960\" y=\"230\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#6B7280\">INERTIAL FRAME</text>\n  <text x=\"960\" y=\"270\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"28\" fill=\"#1A1D23\">Quantum field \u2014 looks like vacuum</text>\n</g>\n<g data-reveal=\"0.3\">\n  <circle cx=\"400\" cy=\"540\" r=\"30\" fill=\"none\" stroke=\"#2A6F97\" stroke-width=\"2\"/>\n  <text x=\"400\" y=\"546\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"18\" fill=\"#2A6F97\">UDW</text>\n  <path d=\"M430,540 Q700,400 960,540 Q1220,680 1500,540\" stroke=\"#1A1D23\" stroke-width=\"1.5\" fill=\"none\" stroke-dasharray=\"8,4\"/>\n  <text x=\"960\" y=\"760\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#6B7280\">TRAJECTORY OF ACCELERATING DETECTOR</text>\n</g>\n<g data-reveal=\"0.6\">\n  <rect x=\"680\" y=\"820\" width=\"560\" height=\"80\" fill=\"none\" stroke=\"#D6215F\" stroke-width=\"2\"/>\n  <text x=\"960\" y=\"855\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"26\" fill=\"#D6215F\">Detector sees thermal radiation</text>\n  <text x=\"960\" y=\"885\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#D6215F\">\u2014 even in vacuum</text>\n</g>\n</svg>"}, {"id": "s3", "narration": "A Bose-Einstein condensate \u2014 a cloud of atoms cooled to near absolute zero \u2014 hosts sound waves that behave exactly like a relativistic quantum field. An accelerating detector coupled to those phonons should mimic the Unruh effect at accessible lab accelerations. But there's a catch that breaks the analogy.", "kind": "svg", "eyebrow": "THE ANALOG PLATFORM", "prebaked": {}, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\">\n  <ellipse cx=\"960\" cy=\"480\" rx=\"500\" ry=\"180\" fill=\"#EDE9E0\" stroke=\"#6B7280\" stroke-width=\"1.5\"/>\n  <text x=\"960\" y=\"475\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#2A6F97\">BOSE-EINSTEIN CONDENSATE</text>\n  <text x=\"960\" y=\"510\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#6B7280\">sound waves act like a relativistic field</text>\n</g>\n<g data-reveal=\"0.3\">\n  <line x1=\"120\" y1=\"720\" x2=\"1800\" y2=\"720\" stroke=\"#DCDAD4\" stroke-width=\"1\"/>\n  <text x=\"960\" y=\"760\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#6B7280\">PHONON DISPERSION</text>\n  <path d=\"M300,710 Q600,600 900,720 Q1100,790 1500,500\" stroke=\"#2A6F97\" stroke-width=\"2\" fill=\"none\"/>\n  <path d=\"M300,710 L900,710\" stroke=\"#1A1D23\" stroke-width=\"1.5\" stroke-dasharray=\"6,3\" fill=\"none\"/>\n  <text x=\"1520\" y=\"490\" class=\"p2v-lab\" font-size=\"18\" fill=\"#D6215F\">NONLINEAR REGIME</text>\n</g>\n<g data-reveal=\"0.6\">\n  <rect x=\"550\" y=\"840\" width=\"820\" height=\"70\" fill=\"none\" stroke=\"#D6215F\" stroke-width=\"2\"/>\n  <text x=\"960\" y=\"882\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"24\" fill=\"#D6215F\">High-momentum phonons break the relativistic analogy</text>\n</g>\n</svg>"}, {"id": "s4", "narration": "The Bogoliubov dispersion \u2014 the real dispersion of phonons in the condensate \u2014 curves away from the linear, relativistic ideal at high momenta. Any detector that couples to those high-momentum modes gets a corrupted signal. What you need is a detector that only talks to the low-momentum, truly phononic excitations. But how do you build that selectivity in?", "kind": "svg", "eyebrow": "THE DISPERSION PROBLEM", "prebaked": {}, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n circle), held by an optical tweezer outside the BEC, serves as an Unruh\u2013DeWitt detector. Condensate and atom couple to many nearly degenerate cavity modes, which mediate an effective, finite-range interaction between them. b) Effective model. The detector is steered along an accelerated trajectory in the transverse plane. Because the cavity-mediated coupling has a finite transverse range, the physically pointlike atom couples to an extended region of the condensate (orange cone), acquiring an effective detector size \u03c3 (projected ellipse on the BEC). c) Schematic momentum filtering. The black solid curve shows the Bogoliubov dispersion, which agrees with the relativistic linear dispersion (blue dashed line) only in the phononic regime indicated by the shaded region. The red curve shows the Gaussian transmission of the cavity-mediated detector profile for \u03c3\u03be=1.5 , which suppresses modes with momenta above the inverse detector size. Tuning the interaction range \u03c3 controls the momentum cutoff and restricts the detector response to the acoustic, relativistic sector of the condensate fluctuations.", "ref": "F1", "annotations": [{"label": "TWEEZER ATOM = DETECTOR", "x": 0.72, "y": 0.35, "reveal": 0.3}, {"label": "CAVITY MEDIATES COUPLING", "x": 0.5, "y": 0.28, "reveal": 0.55}]}, {"id": "s6", "narration": "Here's the key insight. The interaction kernel between the atom and the condensate is a Gaussian with a tunable width \u2014 the effective detector size. In momentum space, that Gaussian suppresses high-momentum modes exponentially. The cavity-mediated coupling acts as a controllable low-pass filter on the condensate excitations. You tune the size; you tune the cutoff.", "kind": "svg", "eyebrow": "THE GAUSSIAN FILTER", "prebaked": {}, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    . AAAAADUkmAMAAAAAAAAAAAAAAAAAAAAAGpJMAYAAAAAAAAAAAAAAAAAAAAAtSQYAwAAAAAAAAAAAAAAAAAAAIBaEowBAAAAAAAAAAAAAAAAAAAAQC0JxgAAAAAAAAAAAAAAAAAAAACglgRjAAAAAAAAAAAAAAAAAAAAAFBLgjEAAAAAAAAAAAAAAAAAAAAAqCXBGAAAAAAAAAAAAAAAAAAAAADUkmAMAAAAAAAAAAAAAAAAAAAAAGpJMAYAAAAAAAAAAAAAAAAAAAAAtSQYAwAAAAAAAAAAAAAAAAAAAIBaEowBAAAAAAAAAAAAAAAAAAAAQC0JxgAAAAAAAAAAAAAAAAAAAACglgRjAAAAAAAAAAAAAAAAAAAAAFBLgjEAAAAAAAAAAAAAAAAAAAAAqCXBGAAAAAAAAAAAAAAAAAAAAADUkmAMAAAAAAAAAAAAAAAAAAAAAGpJMAYAAAAAAAAAAAAAAAAAAAAAtSQYAwAAAAAAAAAAAAAAAAAAAIBaEowBAAAAAAAAAAAAAAAAAAAAQC0JxgAAAAAAAAAAAAAAAAAAAACglgRjAAAAAAAAAAAAAAAAAAAAAFBLgjEAAAAAAAAAAAAAAAAAAAAAqCXBGAAAAAAAAAAAAAAAAAAAAADUkmAMAAAAAAAAAAAAAAAAAAAAAGpJMAYAAAAAAAAAAAAAAAAAAAAAtSQYAwAAAAAAAAAAAAAAAAAAAIBaEowBAAAAAAAAAAAAAAAAAAAAQC0JxgAAAAAAAAAAAAAAAAAAAACglgRjAAAAAAAAAAAAAAAAAAAAAFBLgjEAAAAAAAAAAAAAAAAAAAAAqCXBGAAAAAAAAAAAAAAAAAAAAADUkmAMAAAAAAAAAAAAAAAAAAAAAGpJMAYAAAAAAAAAAAAAAAAAAAAAtSQYAwAAAAAAAAAAAAAAAAAAAIBaEowBAAAAAAAAAAAAAAAAAAAAQC0JxgAAAAAAAAAAAAAAAAAAAACglgRjAAAAAAAAAAAAAAAAAAAAAFBLgjEAAAAAAAAAAAAAAAAAAAAAqCXBGAAAAAAAAAAAAAAAAAAAAADUkmAMAAAAAAAAAAAAAAAAAAAAAGpJMAYAAAAAAAAAAAAAAAAAAAAAtSQYAwAAAAAAAAAAAAAAAAAAAIBa+v8Az1/7tBxBSY4AAAAASUVORK5CYII=", "caption": "Nonthermal detector response for circular motion in (2+1) dimensions. The main panel shows the dimensionless response as a function of detector frequency for fixed detector size and orbital radius , with the four curves corresponding to , 0.40 , 0.60 , and 0.80 (from blue to red). The response increases with angular velocity and decreases with detector frequency. Unlike uniform linear acceleration, circular motion does not yield an exactly thermal spectrum. Inset: Response at fixed frequency as a function of angular velocity, showing monotonic growth toward the relativistic regime.", "ref": "F3", "annotations": [{"label": "HIGHER ANGULAR VELOCITY", "x": 0.15, "y": 0.15, "reveal": 0.3}]}, {"id": "s9", "narration": "Both trajectories are analytically tractable. For linear acceleration the response window.__CONTEXT__ = {"digest": "TITLE: Tunable-Size Unruh\u2013DeWitt Detector in a Multimode Cavity\nARXIV: 2608.24451\nABSTRACT: Quantum simulators based on Bose\u2013Einstein condensates (BECs) provide a powerful platform to study relativistic quantum-field phenomena in the lab and in particular emulate relativistic analog particle detectors. However, such detectors typically couple to excitations beyond the acoustic phonon regime, so that the nonlinear Bogoliubov dispersion introduces corrections that cause the effective relativistic description to break down. We propose to overcome this limitation using an intrinsically momentum-selective Unruh\u2013DeWitt detector model in which a tweezer-trapped atom couples to the condensate through a multimode optical cavity. Although the atom is effectively pointlike, the cavity-mediated interaction kernel causes it to sample density fluctuations over a controllable finite region of the BEC equivalent to a finite-size detector. The effective detector size is tunable via the cavity mode structure determining a controllable momentum cutoff that filters out nonphononic excitations. We analytically calculate the response of such a detector for uniform linear acceleration and uniform circular motion and show that this momentum selectivity can enhance the signal at experimentally accessible accelerations. Compatible with existing cavity-QED platforms our scheme thus provides a versatile setting for analog quantum-field measurements or relativistic quantum-information protocols.\n\nFIGURES (refer to these by ref):\n  [F1] a) Setup. A 1D/2D BEC confined in the transverse plane of a longitudinally pumped ( \u03b7 ) near-planar optical cavity. A two-level atom (green circle), held by an optical tweezer outside the BEC, serves as an Unruh\u2013DeWitt detector. Condensate and atom couple to many nearly degenerate cavity modes, which mediate an effective, finite-range interaction between them. b) Effective model. The detector is s\n  [F2] Detector response as a function of frequency, detector size, and acceleration. (a) Response versus dimensionless frequency for small ( , dashed lines) and large ( , solid lines) detector sizes across various accelerations . For , the numerical results are indistinguishable from the analytical pointlike Unruh response formula. (b) Response as a function of detector size for a fixed frequency , show\n  [F3] Nonthermal detector response for circular motion in (2+1) dimensions. The main panel shows the dimensionless response as a function of detector frequency for fixed detector size and orbital radius , with the four curves corresponding to , 0.40 , 0.60 , and 0.80 (from blue to red). The response increases with angular velocity and decreases with detector frequency. Unlike uniform linear acceleration\n\nEQUATIONS (LaTeX):\n  D(\\mathbf{r},\\mathbf{r}^{\\prime})=\\frac{1}{\\left(\\sqrt{2\\pi}\\,\\sigma\\right)^{d}}e^{-|\\mathbf{r}-\\mathbf{r}^{\\prime}|^{2}/2\\sigma^{2}},\n  \\hat{H}_{\\mathrm{at}}=\\sum_{\\mathbf{k\\neq 0}}E_{\\mathbf{k}}\\hat{b}_{\\mathbf{k}}^{\\dagger}\\hat{b}_{\\mathbf{k}},\\quad E_{\\mathbf{k}}=\\hbar c|\\mathbf{k}|\\sqrt{1+\\frac{|\\mathbf{k}|^{2}\\xi^{2}}{2}}.\n  S=\\frac{\\hbar^{2}}{4M}\\int_{t,\\mathbf{r}}\\sqrt{g}\\left[g^{\\mu\\nu}\\partial_{\\mu}(\\delta\\hat{\\phi}_{\\mathrm{im}})\\partial_{\\nu}(\\delta\\hat{\\phi}_{\\mathrm{im}})\\right],\n  \\delta\\hat{\\phi}_{\\mathrm{re}}(t,\\mathbf{r})=-\\frac{\\hbar}{2M}\\sqrt{g}~\\partial_{t}(\\delta\\hat{\\phi}_{\\mathrm{im}})\n  H_{I}(t)=\\hbar\\tilde{\\lambda}(t)\\int_{\\mathbf{r}}D(\\mathbf{r},\\mathbf{r}_{\\mathrm{D}})\\delta\\hat{\\phi}_{\\mathrm{re}}(t,\\mathbf{r})\\left[\\hat{\\sigma}_{+}(t)+\\mbox{H.c.}\\right],\n  \\lim_{\\sigma\\rightarrow 0}D(\\mathbf{r},\\mathbf{r}_{\\mathrm{D}})=\\delta(\\mathbf{r}-\\mathbf{r}_{\\mathrm{D}}),\n  \\int D(\\mathbf{r},\\mathbf{r}_{\\mathrm{D}})e^{-i\\mathbf{k}\\cdot\\mathbf{r}}\\,d\\mathbf{r}\\propto e^{-\\sigma^{2}|\\mathbf{k}|^{2}/2}.\n  F(\\omega)=\\lambda^{2}\\int_{-\\infty}^{\\infty}\\mathrm{d}\\tau\\,e^{-i\\omega\\tau}\\chi(\\tau)\\,g(\\tau),\n  \\delta\\hat{n}_{\\sigma}(\\tau)\\equiv\\int\\mathrm{d}\\mathbf{r}\\,D\\big(\\mathbf{r},\\mathbf{r}_{\\mathrm{D}}(\\tau)\\big)\\,\\delta\\hat{n}\\big(t(\\tau),\\mathbf{r}\\big),\n  \\tilde{t}(\\tilde{\\tau})=\\frac{1}{\\tilde{\\alpha}}\\sinh\\!\\left(\\tilde{\\alpha}\\,\\tilde{\\tau}\\right),\\qquad\\tilde{x}(\\tilde{\\tau})=\\frac{1}{\\tilde{\\alpha}}\\cosh\\!\\left(\\tilde{\\alpha}\\,\\tilde{\\tau}\\right),\n\nSECTIONS:\n## I Cavity-Mediated Interaction\nThe effective cavity-mediated interaction is fixed by the mode structure of the cavity and factorizes into a transversal and longitudinal part, where r=(x,y) denotes the transverse coordinate and we use the multi-index \u03bc=(m,l) . The transverse interaction is the weighted sum over the normalized and orthonormal Hermite-Gaussian cavity modes where the transverse modes of the near planar cavity are given by Here, Hm denotes the Hermite polynomial of order m and w\u2080 is the beam waist. We assume an exponential mode dispersion \u0394_c,\u03bc=\u0394c e^n_\u03bc\u03b5 , where n_\u03bc=l+m denotes the order of the transverse mode and quantifies the departure from ideal mode degeneracy. This quantity can be related to the number of modes participating in the interaction and is related to the cavity\u2019s length deviation from the ideal planar case [66]. For small n_\u03bc the exponential dispersion reduces to the linear one used in [20, 21, 66] but provides a regularization of the interaction kernel at small separations. Since both the modes and the dispersion weight factorize over the two Cartesian directions, uml(r)=um(x) ul(y) and e^-n_\u03bc\u03b5/\u0394c=e^-m\u03b5/\u0394ce^-l\u03b5/\u0394c with \u03bc=(m,l) , the transverse kernel splits as where the one-dimensional mode is . The one-dimensional sum can be evaluated using Mehler\u2019s formula [8, 10.13.22][36, 59] which, in terms of the Hermite-Gaussian modes directly yields the one-dimensional kernel where the hyperbolic form follows from and resolving the quadratic form along the relative and center-of-mass coordinates. This expression can be verified easily by going in the reverse direction. The product (4) over both directions then gives the exact transverse interaction kernel for arbitrary values of \u03b5 In the near-degenerate regime the hyperbolic functions simplify, using , , and , which yields The translational invariant term varies on the scale , whereas the center of mass term varies on the much larger scale . For small enough \u03b5 or for a system restricted to be near the center of the transverse plane this contribution can be neglected. Dropping it leaves a translationally invariant Gaussian with the interaction width . This kernel is normalized, , so that as , in the limit of the ideally degenerate cavity.\n## II Bogoliubov Formalism\nSmall fluctuations around the macroscopic mean-field solution can be described by decomposing the atomic field operator into a condensate component and a fluctuating part: In the limit of a large particle number N , the Bogoliubov approximation replaces with the c-number . Since the background profile \u03c6\u2080 satisfies the stationary Gross-Pitaevskii equation, linear terms in vanish. Assuming purely local interactions ( U_nl=0 ), the atomic Hamiltonian expanded to quadratic order in the fluctuations is where the Bogoliubov-de Gennes (BdG) operator is with the Gross-Pitaevskii operator . For a homogeneous system of N particles where the k=0 mode is macroscopically occupied, we expand the fluctuations in a plane-wave basis: . In momentum space, the BdG matrix couples particle pairs (k,-k) : where n\u2080=|\u03c6\u2080|^2 and is the free-particle kinetic energy. Diagonalizing yields the Bogoliubov dispersion relation: The Hamiltonian is diagonalized by introducing quasiparticle operators and via the canonical Bogoliubov transformation: with real coefficients which tic spacetime, with the speed of sound cs replacing the light speed. Its vacuum is stationary, so one-point functions vanish and correlators depend only on the proper-time difference. We now show that the classical drive does not contribute to the detector response rate. The response rate, the transition probability per unit of proper time, is given by Fermi\u2019s golden rule, where the initial state is a product state between the field vacuum times the detector ground state, and the final state is given by the detector being in its excited state with an arbitrary final field configuration. Using (23) and (25), the transition amplitude becomes Its modulus squared contains three contributions, which correspond, respectively, to transitions driven by the classical background, to excitations caused by the coupling to the condensate fluctuations, and to the cross terms between the two. Summing over all final field states and inserting the completeness relation gives Since the one-point function of the fluctuation field vanishes, , the cross terms drop out, and the response separates into the sum of a classical-drive and a fluctuation contribution, For the classical contribution, the double integral factorizes and requires no adiabatic regulator. Taking the coupling to be constant over the interaction interval, \u03c7=1 , gives which oscillates with \u03c4\u2080 and remains bounded rather than growing with time. The classical drive therefore produces only Rabi oscillations\u2014a bounded, reversible admixture of the excited state of order \u2014rather than an accumulating transition probability. Consequently, its long-time rate vanishes, The same argument justifies neglecting the direct coherent drive of the detector by the pump. The remaining fluctuation-induced contribution in Eq. (30) depends only on the proper-time difference. Introducing the two-point function we change variables to and , for which . In the long-interaction-time limit, the integral over v yields the factor 2\u03c4\u2080 that cancels the prefactor in Eq. (26). Introducing \u03c9=-\u0394D the response rate reduces to the standard UdW form The factor e^-s|\u03c4| is the adiabatic regulator conventionally used in the literature. Its precise form is immaterial here because it only regularizes the integral as . When g(\u03c4) is regular, this regulator is redundant and is therefore omitted from our subsequent calculations. Alternatively, one may integrate along the contour and take . Consider a detector moving in uniform circular motion in the x-y plane. Its wordline parameterized by proper time \u03c4 is given by: where R is the orbital radius, \u03a9 is the angular velocity, and is the Lorentz factor connecting coordinate time t to proper time \u03c4 . The transition probability of the detector interacting with a scalar field vacuum involves evaluating an integral over the wave vector k . Working in polar coordinates , we introduce a Gaussian spatial smearing profile e^-\u03c3^2k^2 of width \u03c3 to regulate ultraviolet divergences. The response integral in the time domain is: To calculate the integral, we first compute the dot product between the wave vector and the trajectory: Using the identity where J\u2080(x) is the zeroth-order Bessel function of the first kind, the inner angular integral yields: Using the Bessel-function identity employed in analyses of circular detector response [33] we find with .\n## IV Alternative Pumping Setup\nAn alternative setup is transverse pumping, sketched in Fig. 1. Here, a one-dimensional Bose\u2013Einstein condensate is confined in the transverse plane of a near-planar cavity and driven by a running-wave laser propagating perpendicular to the BEC and the cavity axis. Photons are then scattered from the pump into the (nearly) degenerate cavity modes by the BEC itself, so that the intracavity field is generated by the condensate rather than driven externally. This avoids the direct detector drive of the main setup. The result <script>
const S = window.__SCENES__, CTX = window.__CONTEXT__;
const $ = (s, r) => (r || document).querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t);
  if (c) n.className = c; if (x != null) n.textContent = x; return n; };

function key() { return localStorage.getItem('p2v_key') || ''; }

// The model answers in markdown. Rendered as plain text it arrives as a wall
// of asterisks and hashes, which reads worse than no formatting at all.
// Escape first, then allow only the few marks that actually appear.
function md(t) {
  const esc = String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                       .replace(/>/g, '&gt;');
  return esc
    .replace(/^#{1,6}\s*(.+)$/gm, '<b class="mdh">$1</b>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^[-\u2022]\s+(.+)$/gm, '<span class="mdli">$1</span>')
    .replace(/\n{2,}/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

// A page built by `paper2vid --serve` is opened from that same server, which
// already has a key in its environment -- asking the reader for one again is
// just friction. The same file opened from disk has no server behind it, so
// it falls back to BYOK. One artefact, both situations, decided at runtime.
let RELAY = false;
(async () => {
  try {
    const r = await fetch('/api/health', { cache: 'no-store' });
    RELAY = r.ok && (await r.json()).ok === true;
  } catch (e) { RELAY = false; }
  if (!RELAY) document.getElementById('kb').hidden = false;
})();

// Anthropic caps images around 1568px on the long edge; bigger just costs
// tokens for no gain. Plots are line art, so we keep PNG unless the payload
// is large enough that JPEG is worth the artefacts.
async function prepImage(dataUri) {
  const [head, b64] = dataUri.split(',');
  const media = head.slice(5, head.indexOf(';'));
  if (b64.length < 3_000_000) {
    const img = await new Promise((res, rej) => {
      const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUri;
    }).catch(() => null);
    if (img && Math.max(img.width, img.height) <= 1568)
      return { type: 'base64', media_type: media, data: b64 };
  }
  const img = await new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUri;
  });
  const k = Math.min(1, 1568 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const out = c.toDataURL('image/jpeg', 0.92);
  return { type: 'base64', media_type: 'image/jpeg', data: out.split(',')[1] };
}

async function ask(question, sc, into, cacheKey) {
  const k = key();
  if (!RELAY && !k) { into.className = 'answer err';
    into.textContent = 'Add your API key at the top of the page first. It stays in this browser.';
    return; }
  into.className = 'answer thinking'; into.textContent = 'Reading the figure...';

  const hasFig = sc.kind === 'figure' && sc.src;
  const sys = 'You are explaining a specific research paper to a curious reader '
    + 'who is not in this subfield.\n'
    + (hasFig
       ? 'The figure the reader is looking at is attached. Read it directly: '
         + 'legends, axis labels, line colours and styles, which curve is which. '
         + 'Questions about what a colour or marker represents are answered from '
         + 'the image, and you should answer them concretely.\n'
       : '')
    + 'Everything else must come from the paper context. If neither the image '
    + 'nor the context answers the question, say so plainly -- never invent '
    + 'numbers, results or comparisons. Two or three sentences. Plain words.';

  const text = 'PAPER CONTEXT:\n' + CTX.digest
    + '\n\nThe reader is looking at this part:\n' + sc.narration
    + (sc.caption ? '\nFigure caption: ' + sc.caption : '')
    + '\n\nTheir question: ' + question;

  try {
    const content = [];
    if (hasFig) {
      try { content.push({ type: 'image', source: await prepImage(sc.src) }); }
      catch (e) { /* fall back to text-only rather than failing the question */ }
    }
    content.push({ type: 'text', text });

    if (RELAY) {
      const r = await fetch('/api/ask', { method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ content, system: sys,
                               cache: cacheKey || null,
                               paper: CTX.arxiv_id,
                               q: cacheKey ? '' : question }) });
      const d = await r.json();
      // Running out of free questions is not an error -- it is the product
      // working. Say so, and offer the way forward, rather than showing a
      // raw failure string.
      if (r.status === 402 || d.reason) {
        into.className = 'answer'; into.textContent = '';
        showWaitlist(d.message || 'That was your free question.');
        return;
      }
      if (d.error) throw new Error(d.error);
      into.className = 'answer'; into.innerHTML = md(d.text);
      return;
    }
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': k,
                 'anthropic-version': '2023-06-01',
                 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 700,
                             system: sys,
                             messages: [{ role: 'user', content }] })
    });
    if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 200));
    const d = await r.json();
    into.className = 'answer';
    into.innerHTML = md(d.content.filter(b => b.type === 'text')
                                 .map(b => b.text).join(''));
  } catch (e) {
    into.className = 'answer err';
    into.textContent = 'Request failed: ' + e.message;
  }
}

function renderScene(sc) {
  const s = el('section', 'scene');
  if (sc.eyebrow) s.appendChild(el('p', 'eyebrow', sc.eyebrow));

  if (sc.kind === 'title') {
    const h = el('div', 'headcard');
    h.appendChild(el('h2', null, sc.headline));
    if (sc.deck) h.appendChild(el('p', null, sc.deck));
    s.appendChild(h);
  } else if (sc.kind === 'svg') {
    const d = el('div'); d.innerHTML = sc.svg;
    // The video bakes these reveals to a clock. Here they belong to the
    // reader's scroll: the same staged build, paced by them, not at them.
    d.querySelectorAll('[data-reveal]').forEach(n => n.removeAttribute('opacity'));
    s.appendChild(d);
  } else {
    const plate = el('div', 'plate');
    const img = new Image(); img.src = sc.src; img.alt = 'Figure ' + (sc.ref || '') + ' from the paper';
    plate.appendChild(img);
    (sc.annotations || []).forEach(a => {
      const h = el('div', 'hit');
      h.style.left = (a.x * 100) + '%'; h.style.top = (a.y * 100) + '%';
      h.appendChild(el('span', null, a.label));
      h.onclick = () => askAbout(s, sc,
        'What is happening at the point labelled "' + a.label
        + '" on this figure?',
        CTX.arxiv_id + ':' + sc.id + ':mark:' + a.label);
      plate.appendChild(h);
    });
    s.appendChild(plate);
    if (sc.caption) s.appendChild(el('p', 'caption', sc.caption));
    s.appendChild(el('p', 'hint', 'Click a marked point to ask about it'));
  }

  s.appendChild(el('p', 'narration', sc.narration));

  const bar = el('div', 'ask');
  // These three were answered when the page was built. Serving the stored
  // answer costs nothing and appears instantly; only free-text questions
  // still need the model.
  const canned = [
   ['Why does this matter?', 'Why does this part matter?', 'matters'],
   ['Explain simpler', 'Explain this part again, simpler, no jargon.', 'simpler'],
   ['Go deeper', 'Explain the technical detail behind this part.', 'deeper']];
  if (sc.kind === 'figure')
    canned.splice(1, 0, ['Read this figure',
      'Walk me through this figure: what is on each axis, what each colour, '
      + 'line style and marker represents, and what the reader should notice.',
      'figure']);
  canned
    .forEach(([label, q, key]) => {
      const b = el('button', null, label);
      b.onclick = () => {
        const ready = sc.prebaked && sc.prebaked[key];
        if (ready) {
          let a = s.querySelector('.answer');
          if (!a) { a = el('div', 'answer'); s.appendChild(a); }
          a.className = 'answer'; a.textContent = ready;
          a.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          return;
        }
        askAbout(s, sc, q, CTX.arxiv_id + ':' + sc.id + ':' + key);
      };
      bar.appendChild(b);
    });
  const inp = el('input'); inp.placeholder = 'Ask anything about this part...';
  inp.onkeydown = e => { if (e.key === 'Enter' && inp.value.trim()) {
    askAbout(s, sc, inp.value.trim()); inp.value = ''; } };
  bar.appendChild(inp);
  s.appendChild(bar);
  return s;
}

function askAbout(section, sc, question, cacheKey) {
  let a = $('.answer', section);
  if (!a) { a = el('div', 'answer'); section.appendChild(a); }
  a.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  ask(question, sc, a, cacheKey);
}

// The limit is the one moment a reader actually wants more, so it takes over
// the screen rather than sitting in the answer box.
function showWaitlist(msg) {
  let v = document.getElementById('p2v-veil');
  if (!v) {
    v = el('div'); v.id = 'p2v-veil'; v.className = 'veil';
    v.innerHTML =
      '<div class="cardwrap"><button class="x">Close</button>'
      + '<div class="card"><h3>That was your free question.</h3>'
      + '<p class="msg"></p>'
      + '<form><input type="email" placeholder="you@university.edu" required>'
      + '<button type="submit">Join waitlist</button></form>'
      + '</div></div>';
    document.body.appendChild(v);
    v.querySelector('.x').onclick = () => { v.className = 'veil'; };
    v.onclick = (e) => { if (e.target === v) v.className = 'veil'; };
    v.querySelector('form').onsubmit = async (e) => {
      e.preventDefault();
      const inp = v.querySelector('input');
      if (!inp.value.trim()) return;
      const f = v.querySelector('form');
      try {
        const w = await fetch('/api/waitlist', { method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email: inp.value.trim() }) });
        const wd = await w.json();
        f.innerHTML = wd.ok
          ? '<span class="ok">You are on the list. Thank you.</span>'
          : '<span class="ok">That address did not look right.</span>';
      } catch (err) {
        f.innerHTML = '<span class="ok">Could not reach the server.</span>';
      }
    };
  }
  v.querySelector('.msg').textContent = msg;
  v.className = 'veil on';
  setTimeout(() => { try { v.querySelector('input').focus(); } catch (e) {} }, 60);
}

const wrap = $('.wrap');
S.forEach(sc => wrap.appendChild(renderScene(sc)));

// Reveal groups carry a 0-1 fraction from the storyboard. Map it onto a
// stagger so a scene assembles in the order its narration explains it.
const REVEAL_MS = 950;
const obs = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const s = e.target;
    s.classList.add('in');
    s.querySelectorAll('[data-reveal]').forEach(n => {
      const f = parseFloat(n.getAttribute('data-reveal')) || 0;
      setTimeout(() => n.classList.add('lit'), 260 + f * REVEAL_MS);
    });
    s.querySelectorAll('.hit').forEach((n, i) => {
      setTimeout(() => n.classList.add('lit'), 520 + i * 220);
    });
    obs.unobserve(s);
  });
