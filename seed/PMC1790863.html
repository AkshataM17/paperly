<script>
window.__SCENES__ = [{"id": "s1", "narration": "How do you measure how complex a living thing is? Count its genes? Count its cell types? The problem is those answers don't agree. A whale has fewer genes than a water flea. Simple measures keep leading us in circles. Biology needs a better definition of complexity \u2014 one grounded in something all organisms share.", "kind": "svg", "eyebrow": "THE PROBLEM", "prebaked": {"matters": "Without a unified way to measure complexity, biologists cannot compare organisms or track how complexity evolves. Different counting methods (genes, cell types, metabolic processes) give contradictory answers, making it impossible to build a coherent theory of complexity.", "simpler": "We need one clear way to measure how complex a living thing is. Counting genes or cell types doesn't work because different organisms give different answers. We need something that all life has in common.", "deeper": "The incongruence arises because genes and cell types are 'bottom-up' features\u2014counting components of organization\u2014that scale differently across taxa due to genome evolution, polyploidy, cell type divergence, and alternative splicing. A metric grounded in a universal principle (natural selection) would transcend these inconsistencies."}, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\"><text x=\"960\" y=\"220\" text-anchor=\"middle\" class=\"p2v-head\" font-size=\"52\" fill=\"#1A1D23\">How complex is an organism?</text></g><g data-reveal=\"0.2\"><rect x=\"200\" y=\"320\" width=\"380\" height=\"160\" fill=\"#EDE9E0\" stroke=\"#DCDAD4\" stroke-width=\"1.5\"/><text x=\"390\" y=\"385\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#6B7280\">GENE COUNT</text><text x=\"390\" y=\"435\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"28\" fill=\"#1A1D23\">~20,000 genes</text><text x=\"390\" y=\"468\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#6B7280\">(human)</text></g><g data-reveal=\"0.4\"><rect x=\"760\" y=\"320\" width=\"380\" height=\"160\" fill=\"#EDE9E0\" stroke=\"#DCDAD4\" stroke-width=\"1.5\"/><text x=\"950\" y=\"385\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#6B7280\">GENE COUNT</text><text x=\"950\" y=\"435\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"28\" fill=\"#1A1D23\">~31,000 genes</text><text x=\"950\" y=\"468\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#6B7280\">(water flea)</text></g><g data-reveal=\"0.6\"><rect x=\"1320\" y=\"320\" width=\"380\" height=\"160\" fill=\"#EDE9E0\" stroke=\"#DCDAD4\" stroke-width=\"1.5\"/><text x=\"1510\" y=\"385\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#6B7280\">CELL TYPES</text><text x=\"1510\" y=\"435\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"28\" fill=\"#1A1D23\">~200 types</text><text x=\"1510\" y=\"468\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#6B7280\">(human)</text></g><g data-reveal=\"0.8\"><text x=\"960\" y=\"600\" text-anchor=\"middle\" font-size=\"60\" fill=\"#D6215F\">\u2260</text><text x=\"960\" y=\"700\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"26\" fill=\"#6B7280\">These metrics contradict each other.</text><text x=\"960\" y=\"750\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"26\" fill=\"#6B7280\">More genes does not mean more complex.</text></g>\n</svg>"}, {"id": "s2", "narration": "The key insight is to ask complexity from the perspective of natural selection, not ours. What matters is how many independent traits selection actually has to work with. Two traits that always change together under mutation count as one. Only traits that can vary separately \u2014 that are genetically uncorrelated \u2014 truly count.", "kind": "svg", "eyebrow": "THE CORE IDEA", "prebaked": {"matters": "This reframes complexity from human-imposed categories to an objective biological criterion: what natural selection actually 'sees.' It unifies all organisms under one principle and explains why two traits that always co-vary should not inflate complexity counts.", "simpler": "Instead of asking how complex an organism looks to us, ask how complex it looks to evolution. Only traits that can change separately matter. If two traits always move together because mutations can't separate them, they are really just one trait.", "deeper": "Phenotypic complexity measures the dimensionality of the fitness landscape actually accessible to mutations. Genetic uncorrelation means there exist mutations with nonzero partial derivatives on one trait but not another, implying independent directions in phenotypic space that natural selection must navigate."}, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\"><text x=\"960\" y=\"220\" text-anchor=\"middle\" class=\"p2v-head\" font-size=\"44\" fill=\"#1A1D23\">Complexity from selection's point of view</text></g><g data-reveal=\"0.2\"><circle cx=\"480\" cy=\"520\" r=\"120\" fill=\"none\" stroke=\"#2A6F97\" stroke-width=\"2\"/><text x=\"480\" y=\"510\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#2A6F97\">TRAIT A</text><text x=\"480\" y=\"545\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"18\" fill=\"#6B7280\">enzyme affinity</text><circle cx=\"760\" cy=\"520\" r=\"120\" fill=\"none\" stroke=\"#2A6F97\" stroke-width=\"2\"/><text x=\"760\" y=\"510\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#2A6F97\">TRAIT B</text><text x=\"760\" y=\"545\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"18\" fill=\"#6B7280\">reaction rate</text></g><g data-reveal=\"0.4\"><line x1=\"600\" y1=\"480\" x2=\"640\" y2=\"480\" stroke=\"#D6215F\" stroke-width=\"3\"/><text x=\"620\" y=\"465\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"18\" fill=\"#D6215F\">LINKED</text><text x=\"620\" y=\"580\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#D6215F\">No mutation separates them \u2192 count as ONE</text></g><g data-reveal=\"0.65\"><circle cx=\"1200\" cy=\"460\" r=\"100\" fill=\"none\" stroke=\"#2A6F97\" stroke-width=\"2\"/><text x=\"1200\" y=\"450\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#2A6F97\">TRAIT C</text><circle cx=\"1550\" cy=\"460\" r=\"100\" fill=\"none\" stroke=\"#2A6F97\" stroke-width=\"2\"/><text x=\"1550\" y=\"450\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#2A6F97\">TRAIT D</text><line x1=\"1300\" y1=\"460\" x2=\"1450\" y2=\"460\" stroke=\"#6B7280\" stroke-width=\"1.5\" stroke-dasharray=\"8,6\"/><text x=\"1375\" y=\"440\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"18\" fill=\"#6B7280\">INDEPENDENT</text><text x=\"1375\" y=\"600\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#1A1D23\">Some mutations affect one, not the other \u2192 TWO traits</text></g><g data-reveal=\"0.85\"><text x=\"960\" y=\"800\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"26\" fill=\"#1A1D23\">Phenotypic complexity = number of genetically uncorrelated traits under selection</text></g>\n</svg>"}, {"id": "s3", "narration": "Fisher's geometric model gives this a mathematical home. Imagine fitness as a landscape in many dimensions \u2014 phenotypic axes \u2014 with a single peak at the origin. Any individual sits somewhere in this space, and its distance from the peak determines its fitness. More dimensions means more ways to drift away from the optimum.", "kind": "figure", "eyebrow": "", "prebaked": {"matters": "Fisher's geometric model provides mathematical structure to translate phenotypic complexity into measurable quantities. It connects an abstract biological notion (independent traits) to a concrete landscape model where drift and selection can be analyzed quantitatively.", "simpler": "Imagine a map with many directions (traits). The best spot is at the center. Organisms sit at different spots, and how far they are from the center determines how well they survive. More directions means more ways to get lost.", "deeper": "In n-dimensional phenotypic space, fitness is a function f(d) of Euclidean distance d from the optimum. The density of states (individuals) at each fitness level depends on the volume of the n-dimensional hypersurface at distance d, giving rise to the equilibrium distribution when drift and selection balance."}, "src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCAHwAfIDAREAAhEBAxEB/8QAHAAAAwEBAQEBAQAAAAAAAAAAAAIDAQQGBQcI/8QAWBAAAgEDAgMBBwwLDAkFAQAAAAECAwQFBhESITFRBxNBYXGRlBQWIiYyUlaBk7PR0hUkJ0JVcoOhsbLwFyMlM0VGVGKCksHxNDZDRFNXhMLhN2N1oqN0/8QAFAEBAAAAAAAAAAAAAAAAAAAAAP/EABQRAQAAAAAAAAAAAAAAAAAAAAD/2gAMAwEAAhEDEQA/AP38AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPH5K3yGb1lc4z7NX2LtrSzpV6EbNxjKtKUpqUpOUXuo8MVw+MD519mM5jszgMJlKk5VqmSh3u+t04U7yioT3jNLlGafDvHo+TXYg/QQPI53XNrhdcYTT1Rx+31Lvs2/4tvlT88k15gPXAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHLkchZ4myq31/XhQt6SXHUn4N3sl2ttvZJdQOGyz+GzFna3dKqpUqty6FB1qUoPv0eLklJJp+xl2Ad2TyNriMZc5C9qqnbW9N1Kkn4Ev8QP5B1HqG61FqW7zVWUoVa1XjppPnTivcpPxJID+n+5/qynq/SltfOUfVlNd6u4LwVEub27H1Xl28AHqQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADcDNwDcD4+pLGrfYuM6FahSuLStC6pSuP4rig99p9ia35+Dr4APE6W9XZ3IQt6tzh42lrkquSqxs79XFSpOUpOMdklwxTlzb67dEB67U+lbfVlCjZ5C6uI4+Eu+VLai+Hv0l04pddl2Lbnz8CA8VmNH6dx2vtH4y2w9pGzrRvFWpyp8XfNqS24m93Lbwb9APVYXQWL01mp5HB1K9lCtHhuLTj46NReB7Pmmn0e/atuY  equation is elegant. Equilibrium fitness equals one minus one over two times the effective population size, raised to the power of phenotypic complexity divided by a shape parameter. Population size and complexity enter together. That means if you measure one and know the other, you can solve for the third.", "kind": "svg", "eyebrow": "THE MODEL", "prebaked": {"matters": "This equation is the core quantitative tool: it makes phenotypic complexity measurable from population genetic data. Given any two of {equilibrium fitness, population size, complexity}, one can solve for the third, making the theory predictive and testable.", "simpler": "The equation connects three things: how healthy the population is, how big the population is, and how many independent traits it has. If you measure two of these, the equation tells you the third.", "deeper": "The formula Feq = (1 \u2212 (2Ne)^\u22121) \u00d7 (ne/Q) emerges from integrating over the fitness distribution in n-dimensional space under exponential fitness functions f(d) = exp(\u2212d^Q). The prefactor captures drift-selection balance; the ne/Q term captures dimensional complexity scaled by the shape parameter Q."}, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\"><text x=\"960\" y=\"230\" text-anchor=\"middle\" class=\"p2v-head\" font-size=\"40\" fill=\"#1A1D23\">Drift load equation</text></g><g data-reveal=\"0.2\"><rect x=\"300\" y=\"320\" width=\"1360\" height=\"180\" fill=\"#EDE9E0\" stroke=\"#DCDAD4\" stroke-width=\"1.5\"/><text x=\"960\" y=\"430\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"46\" fill=\"#1A1D23\">F  =  ( 1 \u2212 1/(2\u00b7Ne) )^(ne/Q)</text></g><g data-reveal=\"0.45\"><text x=\"480\" y=\"570\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#2A6F97\">F</text><text x=\"480\" y=\"605\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#6B7280\">equilibrium fitness</text></g><g data-reveal=\"0.6\"><text x=\"960\" y=\"570\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#2A6F97\">Ne</text><text x=\"960\" y=\"605\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#6B7280\">effective population size</text></g><g data-reveal=\"0.75\"><text x=\"1450\" y=\"570\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#D6215F\">ne</text><text x=\"1450\" y=\"605\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#D6215F\">phenotypic complexity</text><text x=\"960\" y=\"740\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#6B7280\">Measure fitness at known population sizes \u2192 solve for ne</text></g>\n</svg>"}, {"id": "s6", "narration": "To test this, researchers used evolution experiments on two viruses. One is bacteriophage phi-X-174 \u2014 a tiny phage with one of the smallest known genomes. The other is vesicular stomatitis virus, which infects mammals and is considerably larger. Both were evolved at multiple, carefully controlled population sizes.", "kind": "svg", "eyebrow": "THE EXPERIMENT", "prebaked": {"matters": "Using controlled evolution experiments on viruses provides clean test cases: viruses have small, known genomes, simple lifecycles, and can be replicated at precise population sizes. The two virus species span a range of expected biological complexity.", "simpler": "Scientists used real evolution experiments on two very different viruses. One is tiny with almost no genes; the other is bigger and more complicated. They grew populations at different sizes and watched how fitness changed.", "deeper": "Bacteriophage \u03a6X174 (genome ~5.4 kb, haploid, ~11 genes) and vesicular stomatitis virus (genome ~11 kb, diploid-like replication, ~5 genes but larger structural complexity) provide empirical drift-load data via mutation accumulation assays at Ne = 3, 10, 60. Bottlenecking creates the population size variation."}, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\"><text x=\"960\" y=\"220\" text-anchor=\"middle\" class=\"p2v-head\" font-size=\"44\" fill=\"#1A1D23\">Two viruses, one question</text></g><g data-reveal=\"0.2\"><rect x=\"200\" y=\"310\" width=\"620\" height=\"380\" fill=\"#EDE9E0\" stroke=\"#DCDAD4\" stroke-width=\"1.5\"/><text x=\"510\" y=\"370\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#6B7280\">PHI-X-174</text><text x=\"510\" y=\"430\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#1A1D23\">Bacteriophage</text><text x=\"510\" y=\"470\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#6B7280\">~5,400 nucleotides</text><text x=\"510\" y=\"510\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#6B7280\">Infects bacteria</text><text x=\"510\" y=\"570\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"19\" fill=\"#2A6F97\">Population sizes: 3, 6, 12, 24</text></g><g data-reveal=\"0.45\"><rect x=\"1100\" y=\"310\" width=\"620\" height=\"380\" fill=\"#EDE9E0\" stroke=\"#DCDAD4\" stroke-width=\"1.5\"/><text x=\"1410\" y=\"370\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#D6215F\">VESICULAR STOMATITIS VIRUS</text><text x=\"1410\" y=\"430\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#1A1D23\">RNA virus</text><text x=\"1410\" y=\"470\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#6B7280\">~11,000 nucleotides</text><text x=\"1410\" y=\"510\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#6B7280\">Infects mammals</text><text x=\"1410\" y=\"570\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"19\" fill=\"#2A6F97\">Population sizes: 4, 10, 60</text></g><g data-reveal=\"0.7\"><text x=\"960\" y=\"780\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"26\" fill=\"#1A1D23\">Fitness measured after mutation and serial transfer at each bottleneck size</text></g>\n</svg>"}, {"id": "s7", "narration": "Here is the data. Each point is a population's mean fitness at a given population size. Vesicular stomatitis virus, in dark grey, loses fitness faster as population size drops. Phi-X-174, in white, holds on better. The curves diverge \u2014 and that divergence is the signal of different phenotypic complexities.", "kind": "figure", "eyebrow": "", "prebaked": {"matters": "The data show a clear signal: the two viruses have different fitness-loss trajectories as population size shrinks. Vesicular stomatitis virus declines more steeply, suggesting higher complexity. The pattern directly tests the model's prediction that complexity amplifies drift load.", "simpler": "The graph shows points for each virus at different population sizes. The bigger virus (dark grey) loses fitness much faster when the population shrinks. The tiny virus (white) resists better. This difference tells us they have different complexity.", "deeper": "The slope of fitness versus log(Ne) reveals phenotypic complexity: steeper slope indicates larger ne. VSV's steeper decline reflects its higher dimensionality in phenotypic space, so drift pushes it further from the optimum in small populations relative to the single-peaked landscape."}, "src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCAF0AfIDAREAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAQFBgcBAwL/xABGEAABAwMCAwIKCAUCBgEFAAABAAIDBAURBhITITEUQQcVFiJRYXSUstEXMjU2VFZx0iNVgZGTQqEkJVJTYnPBMzRlcoL/xAAVAQEBAAAAAAAAAAAAAAAAAAAAAf/EABYRAQEBAAAAAAAAAAAAAA icular stomatitis virus and \u03a6X174.Each point indicates the mean fitness of a population. The VSV populations are shown in dark grey and the \u03a6X174 are shown in white. Some points have been displaced on the x-axis for clarity. The VSV populations were transferred at effective population sizes of four, ten, and 60; the \u03a6X174 populations were transferred at effective population sizes of 15, 50, 150, 500, and 1250. The dotted lines specify the maximum likelihood estimate of the fref value (the maximum attainable fitness); the dark dotted line indicates the value for VSV and the lighter dashed line indicates the value for \u03a6X174.", "ref": "F3", "annotations": [{"label": "VSV: STEEPER DECLINE", "x": 0.15, "y": 0.35, "reveal": 0.3}, {"label": "PHI-X-174: SHALLOWER", "x": 0.75, "y": 0.15, "reveal": 0.55}]}, {"id": "s8", "narration": "Fitting the model to those fitness curves yields phenotypic complexity estimates. Vesicular stomatitis virus comes out more phenotypically complex than phi-X-174. This matches biological intuition \u2014 vesicular stomatitis virus is larger, infects more hosts, replicates in more contexts. But now that intuition has an actual number behind it.", "kind": "svg", "eyebrow": "THE RESULT", "prebaked": {"matters": "The results validate the theory and produce quantitative complexity estimates. Vesicular stomatitis virus's higher measured complexity matches its larger genome and broader host range, showing that the mathematical abstraction captures real biological differences.", "simpler": "When researchers fit the equation to the data, they got a number for how complex each virus is. The bigger, more complicated virus got a higher number. This is the first time anyone has put an actual number on complexity from evolution experiments.", "deeper": "Fitting Feq(Ne, ne) = (1 \u2212 (2Ne)^\u22121) \u00d7 (ne/Q) to the empirical drift-load curves via maximum likelihood or least-squares regression yields point estimates and confidence intervals for ne. The larger ne for VSV reflects its broader adaptive surface (more traits under selection across contexts like host range and replication rate)."}, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\"><text x=\"960\" y=\"220\" text-anchor=\"middle\" class=\"p2v-head\" font-size=\"44\" fill=\"#1A1D23\">Fitting drift load gives phenotypic complexity</text></g><g data-reveal=\"0.2\"><rect x=\"200\" y=\"330\" width=\"580\" height=\"200\" fill=\"#EDE9E0\" stroke=\"#DCDAD4\" stroke-width=\"1.5\"/><text x=\"490\" y=\"400\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#6B7280\">PHI-X-174</text><text x=\"490\" y=\"470\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"60\" fill=\"#2A6F97\">ne = lower</text></g><g data-reveal=\"0.45\"><rect x=\"1140\" y=\"330\" width=\"580\" height=\"200\" fill=\"#EDE9E0\" stroke=\"#DCDAD4\" stroke-width=\"1.5\"/><text x=\"1430\" y=\"400\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#D6215F\">VESICULAR STOMATITIS VIRUS</text><text x=\"1430\" y=\"470\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"60\" fill=\"#D6215F\">ne = higher</text></g><g data-reveal=\"0.65\"><line x1=\"780\" y1=\"430\" x2=\"1140\" y2=\"430\" stroke=\"#1A1D23\" stroke-width=\"2\"/><polygon points=\"1140,420 1160,430 1140,440\" fill=\"#1A1D23\"/><text x=\"960\" y=\"415\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#1A1D23\">MORE COMPLEX</text></g><g data-reveal=\"0.8\"><text x=\"960\" y=\"640\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"24\" fill=\"#6B7280\">Larger genome, broader host range, more phenotypic dimensions</text><text x=\"960\" y=\"690\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"24\" fill=\"#1A1D23\">\u2014 biology and math agree</text></g>\n</svg>"}, {"id": "s9", "narration": "One elegant property of this framework: modularity doesn't break it. If an organism's traits are grouped into independent modules \u2014 where mutations in one module can't affect another \u2014 the total drift load is identical to a single module with the same total dimensions. The formula is robust across very different biological architectures.", "kind": "svg", "eyebrow": "ROBUSTNESS", "prebaked": {"matters": "This robustness property shows the formula is not fragile: it holds even when traits are organized into independent modules (like protein domains or organelles). It validates the generality of the approach and shows it captures something fundamental about drift in multi-trait systems.", "simpler": "If traits are grouped into modules that don't talk to each other, the total fitness loss is the same as if all traits were mixed together in one big module. The formula stays true no matter how you arrange things.", "deeper": "When mutations are confined to modules (zero pleiotropy between modules), the drift-load integral factorizes: the density in n-dimensional space equals the product of densities in each module. The total drift load is additive in log-fitness across modules, recovering the same prefactor and ne/Q scaling."}, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\"><text x=\"960\" y=\"220\" text-anchor=\"middle\" class=\"p2v-head\" font-size=\"40\" fill=\"#1A1D23\">Modularity doesn't change the answer</text></g><g data-reveal=\"0.2\"><rect x=\"200\" y=\"320\" width=\"500\" height=\"320\" fill=\"#EDE9E0\" stroke=\"#DCDAD4\" stroke-width=\"1.5\"/><text x=\"450\" y=\"375\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#6B7280\">ONE MODULE</text><text x=\"450\" y=\"440\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"56\" fill=\"#2A6F97\">ne = 6</text><text x=\"450\" y=\"510\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#6B7280\">all traits interact</text></g><g data-reveal=\"0.4\"><text x=\"800\" y=\"490\" text-anchor=\"middle\" font-size=\"60\" fill=\"#1A1D23\">=</text></g><g data-reveal=\"0.55\"><rect x=\"960\" y=\"320\" width=\"220\" height=\"140\" fill=\"#EDE9E0\" stroke=\"#DCDAD4\" stroke-width=\"1.5\"/><text x=\"1070\" y=\"380\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"18\" fill=\"#6B7280\">MODULE 1</text><text x=\"1070\" y=\"430\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"34\" fill=\"#2A6F97\">ne = 2</text><rect x=\"960\" y=\"500\" width=\"220\" height=\"140\" fill=\"#EDE9E0\" stroke=\"#DCDAD4\" stroke-width=\"1.5\"/><text x=\"1070\" y=\"560\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"18\" fill=\"#6B7280\">MODULE 2</text><text x=\"1070\" y=\"610\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"34\" fill=\"#2A6F97\">ne = 4</text></g><g data-reveal=\"0.75\"><text x=\"1350\" y=\"490\" text-anchor=\"middle\" font-size=\"60\" fill=\"#1A1D23\">=</text><rect x=\"1450\" y=\"320\" width=\"300\" height=\"320\" fill=\"#EDE9E0\" stroke=\"#D6215F\" stroke-width=\"2\"/><text x=\"1600\" y=\"440\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#D6215F\">SAME DRIFT LOAD</text><text x=\"1600\" y=\"510\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"34\" fill=\"#D6215F\">ne = 6</text></g><g data-reveal=\"0.9\"><text x=\"960\" y=\"780\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#6B7280\">Sum of module sizes is what matters \u2014 architecture is irrelevant</text></g>\n</svg>"}, {"id": "s10", "narration": "For the first time, you can take evolution experiments \u2014 just fitness measurements at different population sizes \u2014 and read out a number for biological complexity. No genome sequencing required. No argument about which genes count. This opens the door to ranking organisms by how many independent dimensions natural selection actually sees.", "kind": "title", "eyebrow": "WHAT'S NOW POSSIBLE", "prebaked": {"matters": "This is the practical payoff: complexity becomes an empirical quantity measurable from simple evolution experiments. No need to sequence genomes or argue about gene definitions. Any organism can be ranked by how many independent fitness-affecting traits natural selection can see.", "simpler": "This method is simple: run an evolution experiment, measure fitness at a few population sizes, plug the numbers into the equation, and out comes a complexity score. No need to count genes or study the genome at all.", "deeper": "The framework converts drift-load measurements (obtainable via mutation-accumulation experiments, selection response, or fitness assays across bottleneck sizes) into ne estimates, making phenotypic complexity a parameter of population genetic models rather than a qualitative property. This enables comparative complexity studies across any taxa with feasible experimental populations."}, "headline": "Fitness curves reveal a complexity number", "deck": "Evolution experiments can now measure how many independent traits selection actually sees \u2014 in any organism."}];
window.__CONTEXT__ = {"digest": "TITLE: Quantifying Organismal Complexity using a Population Genetic Approach\nARXIV: PMC1790863\nABSTRACT: Various definitions of biological complexity have been proposed: the number of genes, cell types, or metabolic processes within an organism. As knowledge of biological systems has increased, it has become apparent that these metrics are often incongruent. Here we propose an alternative complexity metric based on the number of genetically uncorrelated phenotypic traits contributing to an organism's fitness. This metric, phenotypic complexity, is more objective than previous suggestions, as complexity is measured from a fundamental biological perspective, that of natural selection. We utilize a model linking the equilibrium fitness (drift load) of a population to phenotypic complexity. We then use results from viral evolution experiments to compare the phenotypic complexities of two viruses, the bacteriophage X174 and vesicular stomatitis virus, and to illustrate the consistency of our approach and its applicability. Because Darwinian evolution through natural selection is the fundamental element unifying all biological organisms, we propose that our metric of complexity is potentially a more relevant metric than others, based on the count of artificially defined set of objects.\n\nFIGURES (refer to these by ref):\n  [F1] Fisher's geometric model in two-dimensional phenotypic space.Fitness varies along two phenotypic axes, with the maximum fitness located, for convenience, at the origin of these axes. Any individual in a population (black point) can thus be described by its phenotypic values, which determine the fitness of that organism. At any specific fitness, there are a number of other phenotypic combinations t\n  [F2] Predicted equilibrium fitness as a function of phenotypic complexity (ne).Results are shown for populations of size 100 (black), ten (grey), and three (white). An exponential fitness decline in which Q = 1 was used (yielding a fitness function of f(d) = exp(\u2212d)). Circles indicate the average fitness reached in the simulation model; curves indicate the analytical results.\n  [F3] Equilibrium drift load as a function of population size for vesicular stomatitis virus and \u03a6X174.Each point indicates the mean fitness of a population. The VSV populations are shown in dark grey and the \u03a6X174 are shown in white. Some points have been displaced on the x-axis for clarity. The VSV populations were transferred at effective population sizes of four, ten, and 60; the \u03a6X174 populations w\n\nSECTIONS:\n## Background\nVarious definitions of biological complexity have been proposed: the number of genes, cell types, or metabolic processes within an organism. As knowledge of biological systems has increased, it has become apparent that these metrics are often incongruent.\n## Methodology\nHere we propose an alternative complexity metric based on the number of genetically uncorrelated phenotypic traits contributing to an organism's fitness. This metric, phenotypic complexity, is more objective than previous suggestions, as complexity is measured from a fundamental biological perspective, that of natural selection. We utilize a model linking the equilibrium fitness (drift load) of a population to phenotypic complexity. We then use results from viral evolution experiments to compare the phenotypic complexities of two viruses, the bacteriophage X174 and vesicular stomatitis virus, and to illustrate the consistency of our approach and its applicability.\n## Conclusions/Significance\nBecause Darwinian evolution through natural selection is the fundamental element unifying all biological organisms, we propose that our metric of complexity is potentially a more relevant metric than others, based on the count of artificially defined set of objects.\n## Introduction\nA persistent question in biology is how organismal complexity changes through the course of evolution [1]\u2013[5]. Although significant progress has been made in the understanding and quantifying organismal characteristics at many level of organization (DNA, proteins, metabolic networks, cellular organization, organ functions, individual behavior) much confusion remains about how to accurately quantify organismal complexity. Several intuitive proposals have been made that take into account simple metrics such as the number of genes or cell types. However, these simple measures quickly lead to conflicting conclusions [2], [3]. Here we propose a fundamentally different approach to measuring organismal complexity; as opposed to relying on bottom-up measures such as the number of genes an organism has, we utilize an objective biological approach: natural selection. Instead of asking how complex an organism is from our own perspective, we ask: how complex is an organism from the perspective of natural selection? Essentially, this is a top-down metric of organismal complexity that we term phenotypic complexity. Phenotypic complexity quantifies the number of genetically uncorrelated phenotypic traits contributing to an organism's fitness. A phenotypic trait contributes to an organism's fitness only to the extent that natural selection acts upon that trait. Thus an organismal phenotype that is no longer under selection (for example during an evolutionary transition from a generalist to specialist lifestyle), although expressed by the organism, contributes nothing to organismal complexity. Secondly, if two phenotypes contribute to complexity, they must be genetically separable: some mutations must exist that affect one phenotype but not the other. If no such mutations exist, then although we may perceive two phenotypes under selection, these phenotypes contribute only a single trait toward determining phenotypic complexity. As an example consider the affinity of an enzyme for a substrate, and the rate at which that substrate is converted to product. If there are no mutations that affect one of these traits but not the other, then these two phenotypes are considered one, until the organism gains the genetic complexity to generate variation in one phenotype without affecting the second, for example by evolving functionally separate domains in the enzyme. Phenotypic complexity is thus a combined description of how natural selection perceives organismal phenotypes and how phenotypic variation is generated by the organism. This concept was first articulated by Orr, and followed later by others [6]\u2013[8]. Notably, it is similar to physical complexity, which is a measure of the amount of information that an organism encodes about its environment [4], [5]. An important aspect of measuring complexity in this manner is that both the organism and the environment affect the metric. An organism with many phenotypes, but living in simple environment could thus be just as complex as a simpler organism in the same environment. For example, if one organism is capable of metabolizing both lactose and glucose, while second can metabolize only glucose, the first organism will only be designated as more complex when there is a possibility that lactose will be present in the environment. Recent population genetic theory [9], [10\n## Model and Results\nThe link between drift load and phenotypic complexity under FGM was first investigated by Hartl and Taubes [9] (although Wagner and Gabriel [15] had worked previously on a similar question), and was later refined by Poon and Otto [10]. Recent theoretical techniques from statistical physics now allow an exact solution of FGM for several fitness functions. Sella and Hirsh [16] found that mean equilibrium fitness \u2329f\u232a can be written as In which \u03bd = 2\u22c5Ne\u22121 in the diploid case and 2\u22c5Ne\u22122 in the haploid, and \u03c1(f), the density function, i.e. the size of fitness f isocline, is dependent on the number of dimensions and of the fitness function used. If fitness is assumed to be a linearly decreasing function of the phenotypic distance to the optimum, then we find that the average fitness is given by (Methods, Appendix A):in the diploid case, in which Feq is the equilibrium fitness (drift load) expressed as a fraction of the maximum attainable fitness of the organism, ne is the effective number of dimensions of the phenotypic space (phenotypic complexity; see the below for a more detailed discussion of why we term this the effective number of dimensions), and Ne is the effective population size. This confirms the results obtained by Poon and Otto who approximated Feq(ne, Ne) as 2Ne/(2Ne+ne) [10]. Although earlier studies on FGM model have used such linear fitness functions (for the sake of mathematical simplicity), recent experimental studies do not seem to support the use of such a function [17]\u2013[19]. Linear fitness functions give rise to dramatic synergistic epistasis. For example, a mutation that increases the distance to the optimal phenotype by 0.1 units may decrease fitness by 10% in the optimal genotype (which by definition has a fitness of 1); an analogous mutation will decrease fitness by 50% in an organism with a fitness of 0.2; this mutation will become lethal in any genotype with a fitness less than 0.1. Recent experimental work suggests that epistasis between deleterious mutations is either antagonistic [17]\u2013[19] or null [20]. We therefore decided to use a family of exponential fitness functions with a parameter that allows control over the level and shape of epistasis. In an effort to explore fitness functions more compatible with experimental data, we studied the following family of functions. f(d) = exp(\u2212(dQ)), in which fitness is an exponentially decaying function of the distance to the optimum to the power of Q. Q is a parameter that modifies the concavity of the fitness decline. As organisms move away from the optimum the effect of the mutation tend to have bigger effect if Q>1 and smaller effect if Q<1. In such a case the eviously to simplify the mathematical analyses is no longer necessary. Such a function makes strong assumptions about the form of the fitness landscape; specifically, mutational effects become very large as fitness is reduced. Thus at low fitness most mutations are either lethal or of very large effect, a scenario which is incompatible with what we have previously observed [14]. We have therefore studied a more general family of fitness functions of the form f(d) = exp(\u2212(dQ)), and found that Feq(Ne, ne) = (1\u2212(2\u22c5Ne\u22121)\u22121)(ne/Q). It appears that this equation remains valid over a much wider range of conditions than those used in the canonical FGM, in which mutations are required to be isotropic and fitness isoclines are symmetric about the origin. An interesting feature of this formula is that it does not require a model in which mutations can affect all phenotypic traits simultaneously. In the initial formulation of FGM, all phenotypic axes intersect at the origin of each axis. This original FGM can be modified slightly such that some phenotypes are grouped into separate phenotypic modules, and within a module, all phenotypes again intersect at each other's origin. Any mutation that occurs within a module can affect only other phenotypes within that module, and none that lie outside of it (i.e. there is no pleiotropy between modules, an idea similar to previous conceptions of modularity [23]). Using the more general description of the equilibrium drift load that we have derived above, a phenotypic landscape a composed of a single module with ne dimensions has the same drift load function as a landscape composed of m independent modules of size ne,i with \u2211i ne,i = ne because we have Hence the drift load formula that we have obtained seems to be robust to many of the assumptions underlying FGM. Recently, another theoretical study developed a framework to estimate phenotypic complexity [21]. The model developed used predictions on the distribution of mutational effects to estimate complexity. This analysis, which is completely\n## Methods\nThe details of experimental evolution of \u03a6X174 have been described previously [14]. Briefly, phage were mutagenized in 250 mM hydroxylamine, 1mM EDTA at 37\u00b0C for 140 minutes. Mutagenic treatment was stopped by 100 to 1000-fold dilution into fresh media, after which they were plated on LC agar plates containing a bacterial lawn and grown overnight at 32\u00b0C. From these plates, a number of plaques equal to the bottleneck size were randomly selected and diluted into culture tubes containing 3 ml of 1mM EDTA. These tubes were vortexed and centrifuged, after which 0.5 ml was removed to a fresh eppendorf tube. Chloroform was added, the tubes were vortexed and centrifuged, and 0.3 ml was removed. This stock was then used for further mutagenesis. Sella and Hirsh [16] showed that mean equilibrium fitness could be writtenin which \u03bd = 2Ne\u22121 in the diploid case and 2Ne\u22122 in the haploid, and \u03c1(f) is the density function of fitness value f. In an n-dimensional space, the density \u03c1(f) df is derived from the hyper-sphere surface of radius x, with f = f(x), f(x) being the fitness function describing the dependency of fitness on the distance to the optimum, x. The surface of the hyper-sphere of radius x is \u03a9(n)x (n\u22121), where \u03a9(n) is the unit radius hyper-sphere surface, \u03a9(n) = 2\u22c5\u03c0(n/2)/\u0393(n/2). We have therefore \u03c1(f)df = \u03a9(n) x (n\u22121) dx If fitness is defined as f(x) = 1\u2212x, then \u03a9(n) x (n\u22121) dx = \u2212\u03a9(n) (1\u2212f)n \u22121 df and If fitness is defined as: f(x) = exp(\u2212x Q) we have and This expression is independent of mutational properties. Note that if f(x) = exp(\u2212\u03b1 x Q)and \u2329f\u232ais not affected. Let us assume that f = exp(\u2212R Q) where R is defined by in which x = (x 1,x 2,\u2026,x n) is the position in the n-dimensional space and \u03b1i are positive <script>
const S = window.__SCENES__, CTX = window.__CONTEXT__;
const $ = (s, r) => (r || document).querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t);
  if (c) n.className = c; if (x != null) n.textContent = x; return n; };

function key() { return localStorage.getItem('p2v_key') || ''; }

// A page built by `paper2vid --serve` is opened from that same server, which
// already has a key in its environment -- asking the reader for one again is
// just friction. The same file opened from disk has no server behind it, so
// it falls back to BYOK. One artefact, both situations, decided at runtime.
let RELAY = false;
(async () => {
  try {
    const r = await fetch('/api/health', { cache: 'no-store' });
    RELAY = r.ok && (await r.json()).ok === true;
  } catch (e) { RELAY = false; }
  if (!RELAY) document.getElementById('kb').hidden = false;
})();

// Anthropic caps images around 1568px on the long edge; bigger just costs
// tokens for no gain. Plots are line art, so we keep PNG unless the payload
// is large enough that JPEG is worth the artefacts.
async function prepImage(dataUri) {
  const [head, b64] = dataUri.split(',');
  const media = head.slice(5, head.indexOf(';'));
  if (b64.length < 3_000_000) {
    const img = await new Promise((res, rej) => {
      const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUri;
    }).catch(() => null);
    if (img && Math.max(img.width, img.height) <= 1568)
      return { type: 'base64', media_type: media, data: b64 };
  }
  const img = await new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUri;
  });
  const k = Math.min(1, 1568 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const out = c.toDataURL('image/jpeg', 0.92);
  return { type: 'base64', media_type: 'image/jpeg', data: out.split(',')[1] };
}

async function ask(question, sc, into) {
  const k = key();
  if (!RELAY && !k) { into.className = 'answer err';
    into.textContent = 'Add your API key at the top of the page first. It stays in this browser.';
    return; }
  into.className = 'answer thinking'; into.textContent = 'Reading the figure...';

  const hasFig = sc.kind === 'figure' && sc.src;
  const sys = 'You are explaining a specific research paper to a curious reader '
    + 'who is not in this subfield.\n'
    + (hasFig
       ? 'The figure the reader is looking at is attached. Read it directly: '
         + 'legends, axis labels, line colours and styles, which curve is which. '
         + 'Questions about what a colour or marker represents are answered from '
         + 'the image, and you should answer them concretely.\n'
       : '')
    + 'Everything else must come from the paper context. If neither the image '
    + 'nor the context answers the question, say so plainly -- never invent '
    + 'numbers, results or comparisons. Two or three sentences. Plain words.';

  const text = 'PAPER CONTEXT:\n' + CTX.digest
    + '\n\nThe reader is looking at this part:\n' + sc.narration
    + (sc.caption ? '\nFigure caption: ' + sc.caption : '')
    + '\n\nTheir question: ' + question;

  try {
    const content = [];
    if (hasFig) {
      try { content.push({ type: 'image', source: await prepImage(sc.src) }); }
      catch (e) { /* fall back to text-only rather than failing the question */ }
    }
    content.push({ type: 'text', text });

    if (RELAY) {
      const r = await fetch('/api/ask', { method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ content, system: sys }) });
      const d = await r.json();
      // Running out of free questions is not an error -- it is the product
      // working. Say so, and offer the way forward, rather than showing a
      // raw failure string.
      if (r.status === 402 || d.reason) {
        into.className = 'answer'; into.textContent = '';
        showWaitlist(d.message || 'That was your free question.');
        return;
      }
      if (d.error) throw new Error(d.error);
      into.className = 'answer'; into.textContent = d.text;
      return;
    }
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': k,
                 'anthropic-version': '2023-06-01',
                 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 700,
                             system: sys,
                             messages: [{ role: 'user', content }] })
    });
    if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 200));
    const d = await r.json();
    into.className = 'answer';
    into.textContent = d.content.filter(b => b.type === 'text')
                                .map(b => b.text).join('');
  } catch (e) {
    into.className = 'answer err';
    into.textContent = 'Request failed: ' + e.message;
  }
}

function renderScene(sc) {
  const s = el('section', 'scene');
  if (sc.eyebrow) s.appendChild(el('p', 'eyebrow', sc.eyebrow));

  if (sc.kind === 'title') {
    const h = el('div', 'headcard');
    h.appendChild(el('h2', null, sc.headline));
    if (sc.deck) h.appendChild(el('p', null, sc.deck));
    s.appendChild(h);
  } else if (sc.kind === 'svg') {
    const d = el('div'); d.innerHTML = sc.svg;
    // The video bakes these reveals to a clock. Here they belong to the
    // reader's scroll: the same staged build, paced by them, not at them.
    d.querySelectorAll('[data-reveal]').forEach(n => n.removeAttribute('opacity'));
    s.appendChild(d);
  } else {
    const plate = el('div', 'plate');
    const img = new Image(); img.src = sc.src; img.alt = 'Figure ' + (sc.ref || '') + ' from the paper';
    plate.appendChild(img);
    (sc.annotations || []).forEach(a => {
      const h = el('div', 'hit');
      h.style.left = (a.x * 100) + '%'; h.style.top = (a.y * 100) + '%';
      h.appendChild(el('span', null, a.label));
      h.onclick = () => askAbout(s, sc, 'What is happening at the point labelled "'
        + a.label + '" on this figure?');
      plate.appendChild(h);
    });
    s.appendChild(plate);
    if (sc.caption) s.appendChild(el('p', 'caption', sc.caption));
    s.appendChild(el('p', 'hint', 'Click a marked point to ask about it'));
  }

  s.appendChild(el('p', 'narration', sc.narration));

  const bar = el('div', 'ask');
  // These three were answered when the page was built. Serving the stored
  // answer costs nothing and appears instantly; only free-text questions
  // still need the model.
  const canned = [
   ['Why does this matter?', 'Why does this part matter?', 'matters'],
   ['Explain simpler', 'Explain this part again, simpler, no jargon.', 'simpler'],
   ['Go deeper', 'Explain the technical detail behind this part.', 'deeper']];
  if (sc.kind === 'figure')
    canned.splice(1, 0, ['Read this figure',
      'Walk me through this figure: what is on each axis, what each colour, '
      + 'line style and marker represents, and what the reader should notice.',
      'figure']);
  canned
    .forEach(([label, q, key]) => {
      const b = el('button', null, label);
      b.onclick = () => {
        const ready = sc.prebaked && sc.prebaked[key];
        if (ready) {
          let a = s.querySelector('.answer');
          if (!a) { a = el('div', 'answer'); s.appendChild(a); }
          a.className = 'answer'; a.textContent = ready;
          a.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          return;
        }
        askAbout(s, sc, q);
      };
      bar.appendChild(b);
    });
  const inp = el('input'); inp.placeholder = 'Ask anything about this part...';
  inp.onkeydown = e => { if (e.key === 'Enter' && inp.value.trim()) {
    askAbout(s, sc, inp.value.trim()); inp.value = ''; } };
  bar.appendChild(inp);
  s.appendChild(bar);
  return s;
}

function askAbout(section, sc, question) {
  let a = $('.answer', section);
  if (!a) { a = el('div', 'answer'); section.appendChild(a); }
  a.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  ask(question, sc, a);
}

// The limit is the one moment a reader actually wants more, so it takes over
// the screen rather than sitting in the answer box.
function showWaitlist(msg) {
  let v = document.getElementById('p2v-veil');
  if (!v) {
    v = el('div'); v.id = 'p2v-veil'; v.className = 'veil';
    v.innerHTML =
      '<div class="cardwrap"><button class="x">Close</button>'
      + '<div class="card"><h3>That was your free question.</h3>'
      + '<p class="msg"></p>'
      + '<form><input type="email" placeholder="you@university.edu" required>'
      + '<button type="submit">Join waitlist</button></form>'
      + '<p class="alt">Or run it yourself \u2014 open source, works on '
      + 'your own key</p></div></div>';
    document.body.appendChild(v);
    v.querySelector('.x').onclick = () => { v.className = 'veil'; };
    v.onclick = (e) => { if (e.target === v) v.className = 'veil'; };
    v.querySelector('form').onsubmit = async (e) => {
      e.preventDefault();
      const inp = v.querySelector('input');
      if (!inp.value.trim()) return;
      const f = v.querySelector('form');
      try {
        const w = await fetch('/api/waitlist', { method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email: inp.value.trim() }) });
        const wd = await w.json();
        f.innerHTML = wd.ok
          ? '<span class="ok">You are on the list. Thank you.</span>'
          : '<span class="ok">That address did not look right.</span>';
      } catch (err) {
        f.innerHTML = '<span class="ok">Could not reach the server.</span>';
      }
    };
  }
  v.querySelector('.msg').textContent = msg;
  v.className = 'veil on';
  setTimeout(() => { try { v.querySelector('input').focus(); } catch (e) {} }, 60);
}

const wrap = $('.wrap');
S.forEach(sc => wrap.appendChild(renderScene(sc)));

// Reveal groups carry a 0-1 fraction from the storyboard. Map it onto a
// stagger so a scene assembles in the order its narration explains it.
const REVEAL_MS = 950;
const obs = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const s = e.target;
    s.classList.add('in');
    s.querySelectorAll('[data-reveal]').forEach(n => {
      const f = parseFloat(n.getAttribute('data-reveal')) || 0;
      setTimeout(() => n.classList.add('lit'), 260 + f * REVEAL_MS);
    });
    s.querySelectorAll('.hit').forEach((n, i) => {
      setTimeout(() => n.classList.add('lit'), 520 + i * 220);
    });
    obs.unobserve(s);
  });
}, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
document.querySelectorAll('.scene').forEach(s => obs.observe(s));

const ki = $('#k');
ki.value = key();
ki.oninput = () => localStorage.setItem('p2v_key', ki.value.trim());
</script>
</body></html>
