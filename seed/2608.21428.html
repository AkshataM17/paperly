<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Searching Quantum States Faster with Petri Nets</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F7F6F3;color:#1A1D23;font-family:Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif;
     -webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:0 28px 160px}
header{padding:64px 0 32px;border-bottom:1px solid #DCDAD4;margin-bottom:8px}
h1{font-size:clamp(28px,3.6vw,40px);font-weight:650;letter-spacing:-.022em;
   margin:0 0 16px;line-height:1.1}
.eyebrow{font-family:JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace;font-size:12px;letter-spacing:.16em;
         text-transform:uppercase;color:#6B7280;margin:0 0 14px}
.src{font-family:JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace;font-size:13px;color:#6B7280}
.src a{color:#D6215F;text-decoration:none;border-bottom:1px solid #DCDAD4}
.scene{padding:46px 0;border-bottom:1px solid #DCDAD4}
.narration{font-size:17px;line-height:1.68;margin:0 0 24px;max-width:72ch}
.plate{position:relative;background:#fff;border:1px solid #DCDAD4;
       padding:16px;line-height:0}
.plate img{width:100%;height:auto}
.caption{font-size:14px;color:#6B7280;margin-top:12px;line-height:1.5}
.scene>*{opacity:0;transform:translateY(14px);
          transition:opacity .62s cubic-bezier(.2,.7,.3,1),
                     transform .62s cubic-bezier(.2,.7,.3,1)}
.scene.in>*{opacity:1;transform:none}
.plate img{transition:opacity .8s ease}
[data-reveal]{opacity:0;transition:opacity .55s ease}
.in [data-reveal].lit{opacity:1}
.hit{opacity:0;transform:scale(.4);
     transition:opacity .4s ease,transform .4s cubic-bezier(.3,1.5,.5,1)}
.hit.lit{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .scene>*,.scene.in>*{opacity:1;transform:none;transition:none}
  [data-reveal],[data-reveal].lit{opacity:1;transition:none}
  .hit,.hit.lit{opacity:1;transform:none;transition:none}
}
.hit{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;
     border-radius:50%;border:2px solid #D6215F;background:rgba(214,33,95,.14);
     cursor:pointer;transition:transform .14s}
.hit.lit:hover{transform:scale(1.28)}
.hit span{position:absolute;left:32px;top:2px;white-space:nowrap;
          font-family:JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace;font-size:11px;letter-spacing:.1em;
          background:#F7F6F3;padding:3px 7px;border:1px solid #DCDAD4;
          opacity:0;transition:opacity .14s;pointer-events:none}
.hit:hover span{opacity:1}
.hint{font-family:JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace;font-size:11px;letter-spacing:.12em;
      text-transform:uppercase;color:#6B7280;margin-top:12px}
.headcard{border-left:3px solid #D6215F;padding-left:26px}
.headcard h2{font-size:26px;font-weight:650;letter-spacing:-.018em;margin:0 0 10px}
.headcard p{font-size:16px;color:#6B7280;margin:0;line-height:1.55}
.ask{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
button{font-family:JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace;font-size:11px;letter-spacing:.11em;
       text-transform:uppercase;background:none;color:#1A1D23;
       border:1px solid #1A1D23;padding:9px 15px;cursor:pointer}
button:hover{background:#1A1D23;color:#F7F6F3}
button:disabled{opacity:.4;cursor:wait}
input{font-family:Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif;font-size:15px;padding:10px 13px;
      border:1px solid #DCDAD4;background:#fff;color:#1A1D23;flex:1;min-width:230px}
input:focus{outline:none;border-color:#D6215F}
.answer{margin-top:18px;padding:19px 21px;background:#EDE9E0;
        border-left:2px solid #D6215F;font-size:16px;line-height:1.62;
        white-space:pre-wrap}
.answer.err{border-color:#6B7280;color:#6B7280}
.answer.thinking{color:#6B7280;font-style:italic}
.answer.thinking::after{content:'';display:inline-block;width:6px;height:6px;
  margin-left:7px;border-radius:50%;background:#D6215F;
  animation:p2vpulse 1.1s ease-in-out infinite}
@keyframes p2vpulse{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.keybar[hidden]{display:none}
.keybar{position:sticky;top:0;background:#F7F6F3;border-bottom:1px solid #DCDAD4;
        padding:11px 0;z-index:10;display:flex;gap:8px;align-items:center;
        flex-wrap:wrap}
.keybar .note{font-family:JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace;font-size:11px;color:#6B7280;
              letter-spacing:.06em}
svg{width:100%;height:auto}
</style></head><body>

    <h1>Searching Quantum States Faster with Petri Nets</h1>

<script>
window.__SCENES__ = [{"id": "s1", "narration": "Imagine a system that can be in millions of possible states. You need to know: can it ever reach a specific target state? This is the reachability problem. For complex concurrent systems, classical computers must search exhaustively \u2014 and that search can explode exponentially as the number of tokens grows.", "kind": "svg", "eyebrow": "THE PROBLEM", "prebaked": {"matters": "Reachability is fundamental to system verification: you need to know whether a desired state is even possible to reach. For large systems with many tokens, classical exhaustive search becomes prohibitively slow, making this problem a practical bottleneck in modeling concurrent systems.", "simpler": "When a system can be in millions of states, checking if you can reach one specific state is hard. Classical computers have to try nearly everything, and the work grows exponentially as you add more tokens.", "deeper": "The reachability problem asks: does there exist a firing sequence \u03c3 such that \u03bc\u2080\u2192\u03c3\u2192\u03bc\u2091? Classically, even with depth-first or breadth-first search, the state space is bounded by C(n+m-1, m-1) for n tokens across m places, and in the worst case requires O(N\u00b7k\u00b7m) steps where N grows combinatorially with n."}, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\"><text x=\"960\" y=\"220\" text-anchor=\"middle\" class=\"p2v-head\" font-size=\"48\" fill=\"#1A1D23\">Can the system reach this state?</text></g><g data-reveal=\"0.2\"><circle cx=\"400\" cy=\"480\" r=\"60\" fill=\"#F7F6F3\" stroke=\"#1A1D23\" stroke-width=\"2\"/><text x=\"400\" y=\"488\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#6B7280\">START</text><circle cx=\"960\" cy=\"480\" r=\"60\" fill=\"#F7F6F3\" stroke=\"#6B7280\" stroke-width=\"1\" stroke-dasharray=\"6,4\"/><text x=\"960\" y=\"488\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#6B7280\">STATE 2</text><circle cx=\"760\" cy=\"650\" r=\"60\" fill=\"#F7F6F3\" stroke=\"#6B7280\" stroke-width=\"1\" stroke-dasharray=\"6,4\"/><text x=\"760\" y=\"658\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#6B7280\">STATE 3</text><circle cx=\"1200\" cy=\"650\" r=\"60\" fill=\"#F7F6F3\" stroke=\"#6B7280\" stroke-width=\"1\" stroke-dasharray=\"6,4\"/><text x=\"1200\" y=\"658\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#6B7280\">STATE 4</text><circle cx=\"1500\" cy=\"480\" r=\"60\" fill=\"#F7F6F3\" stroke=\"#D6215F\" stroke-width=\"2\"/><text x=\"1500\" y=\"488\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#D6215F\">TARGET</text></g><g data-reveal=\"0.5\"><line x1=\"460\" y1=\"480\" x2=\"640\" y2=\"480\" stroke=\"#6B7280\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/><line x1=\"1020\" y1=\"480\" x2=\"1180\" y2=\"480\" stroke=\"#6B7280\" stroke-width=\"1.5\"/><line x1=\"460\" y1=\"510\" x2=\"700\" y2=\"620\" stroke=\"#6B7280\" stroke-width=\"1.5\"/><line x1=\"820\" y1=\"650\" x2=\"1140\" y2=\"650\" stroke=\"#6B7280\" stroke-width=\"1.5\"/><line x1=\"1260\" y1=\"620\" x2=\"1440\" y2=\"510\" stroke=\"#6B7280\" stroke-width=\"1.5\"/><defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#6B7280\"/></marker></defs></g><g data-reveal=\"0.75\"><text x=\"960\" y=\"830\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"28\" fill=\"#6B7280\">Classical search: visit every reachable state one by one</text></g>\n</svg>"}, {"id": "s2", "narration": "Petri nets are a classic tool for modeling exactly these kinds of systems \u2014 concurrent processes with tokens flowing through places via transitions. They're used in communication networks, manufacturing, and workflow systems. But classical Petri nets can't model quantum systems, where tokens can exist in superposition.", "kind": "figure", "eyebrow": "", "prebaked": {"matters": "Petri nets are proven tools for modeling real-world concurrent systems with well-established theory. However, they inherently model only classical, deterministic or stochastic behavior, leaving quantum systems out of reach\u2014a gap that limits their applicability to emerging quantum technologies.", "simpler": "Petri nets work great for modeling things like assembly lines and networks where tokens flow between places through transitions. But they can only represent regular tokens, not quantum ones that can be in multiple states at once.", "deeper": "Classical Petri nets use a marking function \u03bc:P\u2192\u2115 mapping places to token counts, where tokens are distinguishable classical entities. They cannot represent superposition (a token being in multiple places at once) or entanglement (correlations between toke "y": 0.4, "reveal": 0.55}]}, {"id": "s3", "narration": "Quantum Petri Nets extend the classical model by replacing ordinary tokens with quantum tokens \u2014 q-tokens \u2014 that carry qubit states. Places store qubits. Transitions apply quantum gates. The whole system can now represent superposition, entanglement, and quantum evolution through time.", "kind": "svg", "eyebrow": "QUANTUM EXTENSION", "prebaked": {"matters": "Quantum Petri Nets bridge a gap by enabling the modeling of hybrid systems where quantum behavior matters. This opens analysis of quantum protocols and concurrent quantum processes using a well-understood formal framework adapted for quantum mechanics.", "simpler": "Instead of regular tokens, you use quantum tokens\u2014q-tokens\u2014that hold qubits. Places store these qubits, transitions apply quantum gates to them. Now the system can show superposition and entanglement just like real quantum systems do.", "deeper": "In QPN, a marking \u03bc is a mapping from P to subsets of q-tokens, with each q-token assigned qubits via a function v\u209c. Places use quantum S-R flip-flops (storing qubits not bits) rather than classical counters. Transitions implement unitary operators U\u209c that conditionally move q-tokens and modify their quantum states based on transition enabling conditions e\u209c(\u03bc,v\u209c)."}, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\"><text x=\"480\" y=\"210\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"24\" fill=\"#6B7280\">CLASSICAL PETRI NET</text><text x=\"1440\" y=\"210\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"24\" fill=\"#6B7280\">QUANTUM PETRI NET</text></g><g data-reveal=\"0.2\"><circle cx=\"360\" cy=\"420\" r=\"55\" fill=\"#F7F6F3\" stroke=\"#1A1D23\" stroke-width=\"2\"/><circle cx=\"360\" cy=\"430\" r=\"12\" fill=\"#1A1D23\"/><text x=\"360\" y=\"510\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#6B7280\">bit token</text><rect x=\"520\" y=\"390\" width=\"80\" height=\"60\" fill=\"#F7F6F3\" stroke=\"#1A1D23\" stroke-width=\"2\"/><text x=\"560\" y=\"425\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"18\" fill=\"#1A1D23\">T</text><circle cx=\"720\" cy=\"420\" r=\"55\" fill=\"#F7F6F3\" stroke=\"#1A1D23\" stroke-width=\"2\"/><text x=\"720\" y=\"510\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#6B7280\">place</text><line x1=\"415\" y1=\"420\" x2=\"518\" y2=\"420\" stroke=\"#1A1D23\" stroke-width=\"2\"/><line x1=\"600\" y1=\"420\" x2=\"663\" y2=\"420\" stroke=\"#1A1D23\" stroke-width=\"2\"/></g><g data-reveal=\"0.45\"><text x=\"960\" y=\"430\" text-anchor=\"middle\" font-size=\"48\" fill=\"#6B7280\">\u2192</text></g><g data-reveal=\"0.6\"><circle cx=\"1260\" cy=\"420\" r=\"55\" fill=\"#F7F6F3\" stroke=\"#D6215F\" stroke-width=\"2\"/><circle cx=\"1260\" cy=\"430\" r=\"12\" fill=\"#D6215F\"/><text x=\"1260\" y=\"510\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#D6215F\">q-token (qubit)</text><rect x=\"1420\" y=\"390\" width=\"80\" height=\"60\" fill=\"#F7F6F3\" stroke=\"#1A1D23\" stroke-width=\"2\"/><text x=\"1460\" y=\"425\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"18\" fill=\"#1A1D23\">U</text><circle cx=\"1620\" cy=\"420\" r=\"55\" fill=\"#F7F6F3\" stroke=\"#1A1D23\" stroke-width=\"2\"/><line x1=\"1315\" y1=\"420\" x2=\"1418\" y2=\"420\" stroke=\"#1A1D23\" stroke-width=\"2\"/><line x1=\"1500\" y1=\"420\" x2=\"1563\" y2=\"420\" stroke=\"#1A1D23\" stroke-width=\"2\"/></g><g data-reveal=\"0.8\"><text x=\"960\" y=\"700\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"26\" fill=\"#1A1D23\">Tokens conserved \u00b7 Transitions are unitary gates \u00b7 Markings become quantum states</text></g>\n</svg>"}, {"id": "s4", "narration": "Here's the key example used throughout. Five places, three transitions, three q-tokens. The initial marking puts tokens in specific places. The reachability question: which target markings can this system ever produce? The algorithm needs to explore all possible firing sequences.", "kind": "figure", "eyebrow": "", "prebaked": {"matters": "This concrete example makes the algorithm tangible: five places, three transitions, three q-tokens is simple enough to trace by hand but complex enough to show real quantum behavior. It demonstrates both reachable and unreachable target markings, validating the algorithm's correctness.", "simpler": "The example has five storage locations (places), three operations (transitions), and three quantum tokens. You start with tokens in certain places and ask: can this system ever get to a specific other arrangement of tokens?", "deeper": "The example in Figure 2 uses m=5 places requiring 2 qubits per place (since n=3 tokens means cardinality 0-3, requiring \u2308log\u2082(4)\u2309=2 bits), k=3 transitions requiring 2-qubit transition registers per iteration (since \u2308log\u2082(3+1)\u2309=2), and p=3 iterations creating 3 transition registers and 3 firing qubits, for total marking register size of 10 qubits in Phase I."}, "src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAC7QAAAXRCAYAAAAU7TA4AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAMsAAADLAAShkWtsAAP+lSURBVHhe7P0P9D1nXSd4PjD00O4OHm0NK3R7AtKEAAfcEJmVBTEiiLMDyz9FwgEaggyCgwKhQzxkJezStqEnZNa0HBqTI8jQWWzZphm6iWxkY2OiDUj3hHUHHNo4wYCZSYbu6OHfLP3d80ly5ZvPfapu1b11760/r9c579Pt7/u9VXWfp2494db7V79SAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAYMzOL6VcOoM8Jb8xAAAAAAAAAAAAAADG69GllJOZ5Iv5zQEAAAAAAAAAAAAAMF6vqxTDp5zz8hsEAAAAAAAAAAAAAGCc3lYphU85z89vEAAAAAAAAAAAAACAcfrVSil8yrkgv0EAAAAAAAAAAAAAAMbplyul8CnHE9oBAAAAAAAAAAAAACbi5yql8Cnnh/IbBAAAAAAAAAAAAABgnB5WSvlqpRg+xfyb/OYAAAAAAAAAAAAAABi3s0spF2yRV5RSXllKeVUp5WdLKa8ppfx8KeWdlbJ5LReVUl7fMa+7Z9uxj9hX7DP2/V+UUn76nuP53+U3BgAAAAAAAAAAAADAsjytUl6v5f75hQAAAAAAAAAAAAAAsAuFdgAAAAAAAAAAAA tes on transition register \u03b1\u1d62 create equal superposition |\u03c8\u27e9 = (1/\u221a4)(|00\u27e9+|01\u27e9+|10\u27e9+|11\u27e9), then the reversible operator U\u209c acts conditionally: U\u209c|M\u1d62\u27e9|\u03b1\u209c\u27e9|0\u27e9\u2095 \u2192|M'\u1d62\u27e9|\u03b1\u209c\u27e9|0\u27e9\u2095 if transition is enabled (moving tokens according to arc labels), otherwise leaves it unchanged. After p iterations, the marking register holds superposition over all reachable markings."}, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\"><text x=\"300\" y=\"260\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#6B7280\">ITERATION 1</text><text x=\"960\" y=\"260\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#6B7280\">ITERATION 2</text><text x=\"1560\" y=\"260\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#6B7280\">ITERATION p</text></g><g data-reveal=\"0.2\"><rect x=\"160\" y=\"300\" width=\"280\" height=\"70\" fill=\"#EDE9E0\" stroke=\"#1A1D23\" stroke-width=\"1.5\"/><text x=\"300\" y=\"343\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#1A1D23\">Hadamard \u2192 superposition</text><text x=\"300\" y=\"410\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"18\" fill=\"#6B7280\">all transitions at once</text></g><g data-reveal=\"0.4\"><rect x=\"820\" y=\"300\" width=\"280\" height=\"70\" fill=\"#EDE9E0\" stroke=\"#1A1D23\" stroke-width=\"1.5\"/><text x=\"960\" y=\"343\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#1A1D23\">Hadamard \u2192 superposition</text><text x=\"960\" y=\"410\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"18\" fill=\"#6B7280\">branches multiply</text><line x1=\"440\" y1=\"335\" x2=\"818\" y2=\"335\" stroke=\"#6B7280\" stroke-width=\"1.5\" stroke-dasharray=\"6,3\"/></g><g data-reveal=\"0.6\"><rect x=\"1420\" y=\"300\" width=\"280\" height=\"70\" fill=\"#D6215F\" stroke=\"#D6215F\" stroke-width=\"1.5\"/><text x=\"1560\" y=\"343\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#F7F6F3\">Superposition of ALL</text><text x=\"1560\" y=\"410\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"18\" fill=\"#D6215F\">reachable markings</text><line x1=\"1100\" y1=\"335\" x2=\"1418\" y2=\"335\" stroke=\"#6B7280\" stroke-width=\"1.5\" stroke-dasharray=\"6,3\"/><text x=\"1240\" y=\"320\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"18\" fill=\"#6B7280\">\u00b7\u00b7\u00b7</text></g><g data-reveal=\"0.8\"><rect x=\"400\" y=\"560\" width=\"1120\" height=\"160\" fill=\"#F7F6F3\" stroke=\"#DCDAD4\" stroke-width=\"1\"/><text x=\"960\" y=\"618\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"24\" fill=\"#1A1D23\">Marking register M  \u00b7  Transition registers \u03b1\u2081\u2026\u03b1\u209a  \u00b7  Firing registers h\u2081\u2026h\u209a</text><text x=\"960\" y=\"668\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#6B7280\">Ancillary registers track history \u2014 and are excluded from the search space</text></g>\n</svg>"}, {"id": "s6", "narration": "Phase two applies Grover's amplitude amplification. A phase oracle marks the target marking. The diffusion operator then boosts its amplitude. Crucially, the ancillary registers used for transition control are excluded from the search, shrinking the space the algorithm has to search and making the speedup even more practical.", "kind": "svg", "eyebrow": "PHASE II: GROVER AMPLITUDE AMPLIFICATION", "prebaked": {"matters": "The key insight here is that ancillary registers used only for control\u2014transition registers and firing registers\u2014are excluded from Grover's search space. This reduces the effective search size, making the quantum speedup even more dramatic than standard Grover search on the full state space.", "simpler": "After exploring all reachable markings, you use Grover's algorithm to find the target. But you only search the marking itself, not the transition control registers. This shrinks the search space, making the speedup better than it would otherwise be.", "deeper": "The oracle O\u03bc\u2090 flips phase only on basis states where the marking register matches \u03bc\u2090, regardless of transition and firing register values. This means if M reachable markings exist out of N total basis states, the effective search space is M, not N. The diffusion operator then amplifies these marked states. The overall time complexity becomes O(\u221aN(pkm log n)) where \u221aN comes from Grover iterations and the inner term from operator cost."}, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\"><text x=\"960\" y=\"220\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"26\" fill=\"#6B7280\">AMPLITUDE BEFORE AND AFTER AMPLIFICATION</text></g><g data-reveal=\"0.2\"><rect x=\"160\" y=\"290\" width=\"640\" height=\"420\" fill=\"#F7F6F3\" stroke=\"#DCDAD4\" stroke-width=\"1\"/><text x=\"480\" y=\"340\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#6B7280\">BEFORE</text><rect x=\"220\" y=\"640\" width=\"40\" height=\"40\" fill=\"#2A6F97\"/><rect x=\"280\" y=\"620\" width=\"40\" height=\"60\" fill=\"#2A6F97\"/><rect x=\"340\" y=\"630\" width=\"40\" height=\"50\" fill=\"#2A6F97\"/><rect x=\"400\" y=\"635\" width=\"40\" height=\"45\" fill=\"#2A6F97\"/><rect x=\"460\" y=\"625\" width=\"40\" height=\"55\" fill=\"#2A6F97\"/><rect x=\"520\" y=\"640\" width=\"40\" height=\"40\" fill=\"#2A6F97\"/><rect x=\"580\" y=\"632\" width=\"40\" height=\"48\" fill=\"#2A6F97\"/><rect x=\"640\" y=\"638\" width=\"40\" height=\"42\" fill=\"#2A6F97\"/><line x1=\"200\" y1=\"680\" x2=\"700\" y2=\"680\" stroke=\"#1A1D23\" stroke-width=\"1.5\"/><text x=\"480\" y=\"730\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"18\" fill=\"#6B7280\">all markings equal amplitude</text></g><g data-reveal=\"0.5\"><text x=\"800\" y=\"530\" text-anchor=\"middle\" font-size=\"52\" fill=\"#6B7280\">\u2192</text></g><g data-reveal=\"0.65\"><rect x=\"1120\" y=\"290\" width=\"640\" height=\"420\" fill=\"#F7F6F3\" stroke=\"#DCDAD4\" stroke-width=\"1\"/><text x=\"1440\" y=\"340\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#6B7280\">AFTER</text><rect x=\"1180\" y=\"658\" width=\"40\" height=\"22\" fill=\"#2A6F97\"/><rect x=\"1240\" y=\"654\" width=\"40\" height=\"26\" fill=\"#2A6F97\"/><rect x=\"1300\" y=\"660\" width=\"40\" height=\"20\" fill=\"#2A6F97\"/><rect x=\"1360\" y=\"390\" width=\"40\" height=\"290\" fill=\"#D6215F\"/><rect x=\"1420\" y=\"656\" width=\"40\" height=\"24\" fill=\"#2A6F97\"/><rect x=\"1480\" y=\"652\" width=\"40\" height=\"28\" fill=\"#2A6F97\"/><rect x=\"1540\" y=\"658\" width=\"40\" height=\"22\" fill=\"#2A6F97\"/><rect x=\"1600\" y=\"655\" width=\"40\" height=\"25\" fill=\"#2A6F97\"/><line x1=\"1160\" y1=\"680\" x2=\"1660\" y2=\"680\" stroke=\"#1A1D23\" stroke-width=\"1.5\"/><text x=\"1380\" y=\"870\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"18\" fill=\"#D6215F\">TARGET</text><text x=\"1440\" y=\"730\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"18\" fill=\"#6B7280\">target marking amplified</text></g>\n</svg>"}, {"id": "s7", "narration": "Look at the experimental results for reachable targets. When the target marking is one the system can actually reach, the measurement histogram shows a dominant peak at that exact state. The probability spikes clearly above all others. The algorithm finds the answer with high confidence.", "kind": "figure", "eyebrow": "", "prebaked": {"matters": "Experimental validation is crucial: it shows the algorithm doesn't just work in theory but actually produces correct results on real quantum hardware or simulators. The clear dominant peak proves the algorithm successfully identified a reachable target with high probability.", "simpler": "When you run the algorithm looking for a target marking that the system can reach, you get a measurement showing a huge spike at exactly that marking. The answer is obvious and confident.", "deeper": "Figures F3-F9 show measurement histograms for six reachable target markings, all displaying a dominant probability peak at the target state (typically exceeding 80-90% probability after Grover amplitude amplification). This demonstrates successful phase marking and diffusion operator amplification: the target basis states have their amplitudes boosted while others are suppressed, making measurement return the target with high probability."}, "src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA+gAAAImCAYAAADANqCUAAAAOXRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjUuMiwgaHR0cHM6Ly9tYXRwbG90bGliLm9yZy8qNh9FAAAACXBIWXMAAA9hAAAPYQGoP6dpAACFm0lEQVR4nOzdd3hU1fr//c+EkEI6LSFAQheQJkWkSA3NfDEIgliOlKN0ETiCgEgTpCiIIGI5Coh0aQKCIFWlClhAQEoo0ksKBBJCsp4/eDI/hiSkmGQmOe/XdeXSvfbae9/3XjPD3LObxRhjBAAAAAAA7MrJ3gEAAAAAAAAKdAAAAAAAHAIFOgAAAAAADoACHQAAAAAAB0CBDgAAAACAA6BABwAAAADAAVCgAwAAAADgACjQAQAAAABwABToAAAAAAA4AAp0AAAAAAAcAAU6AAAAAAAOgAIdAAAAAAAHQIEOAAAAAIADoEAHAAAAAMABUKADAAAAAOAAKNABAAAAAHAAFOgAAAAAADgACnQAAAAAABwABToAAAAAAA6AAh0AAAAAAAdAgQ4AAAAAgAOgQAcAAAAAwAFQoAMAAAAA4AAo0AEAAAAAcAAU6AAAAAAAOAAKdAAAAAAAHAAFOgAAAAAADoACHQAAAAAAB0CBDgAAAACAA6BABwAAAADAAVCgAwAAAADgACjQAQAAAABwABToAAAAAAA4AAp0AACyWJMmTWSxWOwdhl2dOnVKFotFXbt2tXcoadqwYYMaNGggPz8/WSwWtWvXzt4hIZ26du0qi8WiU6dO2TsUAMgSFOgAkM1+/fVX9erVS5UrV5a3t7dcXFwUEBCgFi1aaMqUKbpy5Yq9Q7SbM2fOqE+fPipfvrzc3Nzk6emp0qVLKzQ0VJMmTVJMTIy9Q7SrpCL3/r/8+fOrePHi6tSpk3755Rd7h5hhjvbjxalTpxQWFqaTJ0+qW7duGjVqlDp37qytW7fKYrFo9OjR9g4xmUmTJllfD7t27Ur3cqNHj5bFYtGiRYts2i0Wi5o0aZLFUWaNOXPmyGKxaM6cOfYOBQByhLO9AwCAvCoxMVFDhgzRlClTlC9fPjVq1EgtW7aUh4eH ame factor Grover's algorithm achieves for any unstructured search, now applied to reachability.", "simpler": "Classical checking takes time proportional to N (the number of possible states), which grows exponentially. Quantum takes time proportional to \u221aN, which is much slower growth. That's a quadratic speedup\u2014the quantum computer searches roughly as well as the square root of the classical time.", "deeper": "Phase I costs O(p\u00b7C_U\u209c) where C_U\u209c = O(km log n) (checking k transitions, each touching up to m places with \u2308log n\u2309 bits per place). Phase II runs Grover for r\u2248\u221aN iterations, each iteration costs O(C_O + 2C_A + C_S\u03bc\u2080)\u2248O(pkm log n). Total is O(\u221aN(pkm log n)). Classically, exhaustive DFS/BFS needs O(N\u00b7km) where N=C(n+m-1,m-1)\u2248(n+m)\u207f/n!, giving exponential-in-n overhead versus polynomial factors in quantum."}, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\"><text x=\"480\" y=\"240\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"26\" fill=\"#6B7280\">CLASSICAL</text><text x=\"1440\" y=\"240\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"26\" fill=\"#6B7280\">QUANTUM</text></g><g data-reveal=\"0.2\"><rect x=\"200\" y=\"290\" width=\"560\" height=\"120\" fill=\"#EDE9E0\" stroke=\"#DCDAD4\" stroke-width=\"1.5\"/><text x=\"480\" y=\"345\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"30\" fill=\"#1A1D23\">O( N \u00b7 k \u00b7 m )</text><text x=\"480\" y=\"395\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#6B7280\">N grows exponentially with tokens</text></g><g data-reveal=\"0.4\"><rect x=\"1160\" y=\"290\" width=\"560\" height=\"120\" fill=\"#EDE9E0\" stroke=\"#D6215F\" stroke-width=\"2\"/><text x=\"1440\" y=\"345\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"30\" fill=\"#D6215F\">O( \u221aN \u00b7 p \u00b7 k \u00b7 m \u00b7 log n )</text><text x=\"1440\" y=\"395\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#6B7280\">quadratic speedup over classical</text></g><g data-reveal=\"0.65\"><line x1=\"200\" y1=\"530\" x2=\"1720\" y2=\"530\" stroke=\"#DCDAD4\" stroke-width=\"1\"/><text x=\"960\" y=\"490\" text-anchor=\"middle\" font-size=\"40\" fill=\"#6B7280\">vs</text><text x=\"200\" y=\"640\" class=\"p2v-lab\" font-size=\"20\" fill=\"#6B7280\">SPACE</text><text x=\"480\" y=\"700\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#1A1D23\">O( m log n + pk log k )</text><text x=\"480\" y=\"745\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"18\" fill=\"#6B7280\">total qubit cost of the algorithm</text><text x=\"960\" y=\"700\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"26\" fill=\"#6B7280\">\u00b7</text><text x=\"1440\" y=\"700\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#1A1D23\">Ancillary registers excluded from search</text><text x=\"1440\" y=\"745\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"18\" fill=\"#6B7280\">search space strictly smaller than N</text></g>\n</svg>"}, {"id": "s10", "narration": "What's now possible: you can ask reachability questions about quantum systems \u2014 not classical approximations of them \u2014 and get answers faster than any classical approach. As quantum hardware matures, this framework opens the door to verifying quantum protocols, checking quantum workflows, and analyzing quantum concurrent systems at scale.", "kind": "title", "eyebrow": "WHAT'S NOW POSSIBLE", "prebaked": {"matters": "This opens a new frontier: formal verification of actual quantum systems using a sound mathematical framework. Rather than classically simulating quantum behavior (which becomes exponentially hard), you can ask reachability questions directly on quantum hardware, enabling certification of quantum protocols and workflows at scale as the technology matures.", "simpler": "You can now verify that quantum systems can or cannot reach certain states, faster than any classical method. As quantum computers get better, you'll be able to check whether quantum protocols work correctly by asking reachability questions directly.", "deeper": "The framework enables analysis of quantum concurrent systems modeled as QPNs: verifying quantum communication protocols reach desired entangled states, confirming quantum workflows enable required quantum operations, and checking that undesired quantum states are unreachable. As quantum hardware scales beyond NISQ era, the quadratic speedup becomes practically significant for systems with hundreds or thousands of q-tokens, where classical verification becomes intractable (N grows as C(n+m-1,m-1) \u2248 exponential in n)."}, "headline": "Reachability in quantum systems, solved quantumly", "deck": "Quadratic speedup \u00b7 Verified experimentally \u00b7 Extensible to quantum protocol analysis"}];
window.__CONTEXT__ = {"digest": "TITLE: On Reachability Problem in Bounded Quantum Petri Nets\nARXIV: 2608.21428\nABSTRACT: In this paper, we propose a novel quantum solution to address the problem of reachability in bounded quantum Petri nets (QPNs)\u2014an advanced modeling framework that combines the classical Petri net model with quantum mechanical principles. The proposed approach exploits quantum parallelism to construct a superposition over all reachable markings from the initial marking. Grover\u2019s amplitude amplification algorithm is then applied to efficiently identify a desired target marking, while ancillary q-tokens used solely for transition control are excluded from the search space, significantly reducing its size. Theoretical analysis shows that our approach achieves a quadratic speed-up over classical exhaustive algorithms. Experimental results also confirm the correctness and feasibility of the proposed quantum algorithm for solving the bounded reachability problem in Quantum Petri Nets.\n\nFIGURES (refer to these by ref):\n  [F1] Fig. 1: A simple QPN example with m=4 places, k=2 transitions and n=4 q -tokens.\n  [F2] Fig. 2: Illustrative example of the proposed reachability algorithm, with m=5 places, k=3 transitions, and n=3 q -tokens.\n  [F3] (a) Measurement outcomes for the reachable target marking (P\u2081,P\u2082,P\u2083,P\u2084,P\u2085)=(01,00,10,00,00) .\n  [F4] (a) Measurement outcomes for the reachable target marking (P\u2081,P\u2082,P\u2083,P\u2084,P\u2085)=(01,00,10,00,00) .\n  [F5] (b) Measurement outcomes for the reachable target marking (P\u2081,P\u2082,P\u2083,P\u2084,P\u2085)=(01,00,01,01,00) .\n  [F6] (c) Measurement outcomes for the reachable target marking (P\u2081,P\u2082,P\u2083,P\u2084,P\u2085)=(01,00,01,00,01) .\n  [F7] (d) Measurement outcomes for the reachable target marking (P\u2081,P\u2082,P\u2083,P\u2084,P\u2085)=(01,00,00,10,00) .\n  [F8] (e) Measurement outcomes for the reachable target marking (P\u2081,P\u2082,P\u2083,P\u2084,P\u2085)=(01,00,00,01,01) .\n  [F9] (f) Measurement outcomes for the reachable target marking (P\u2081,P\u2082,P\u2083,P\u2084,P\u2085)=(01,00,00,00,10) .\n  [F10] (a) Measurement outcomes for the non-reachable target marking (P\u2081,P\u2082,P\u2083,P\u2084,P\u2085)=(01,01,01,00,00) .\n  [F11] (a) Measurement outcomes for the non-reachable target marking (P\u2081,P\u2082,P\u2083,P\u2084,P\u2085)=(01,01,01,00,00) .\n  [F12] (b) Measurement outcomes for the non-reachable target marking (P\u2081,P\u2082,P\u2083,P\u2084,P\u2085)=(00,01,10,00,00) .\n  [F13] (c) Measurement outcomes for the non-reachable target marking (P\u2081,P\u2082,P\u2083,P\u2084,P\u2085)=(00,01,00,10,00) .\n  [F14] (d) Measurement outcomes for the non-reachable target marking (P\u2081,P\u2082,P\u2083,P\u2084,P\u2085)=(00,00,11,00,00) .\n  [F15] (e) Measurement outcomes for the non-reachable target marking (P\u2081,P\u2082,P\u2083,P\u2084,P\u2085)=(00,00,00,11,00) .\n  [F16] (f) Measurement outcomes for the non-reachable target marking (P\u2081,P\u2082,P\u2083,P\u2084,P\u2085)=(00,00,00,00,11) .\n\nEQUATIONS (LaTeX):\n  \\mathcal{QPN}=(D,P,T,E,\\mu_{t},v_{t}),\n  \\mu_{0}\\xrightarrow{\\;\\sigma\\;}\\mu_{d}.\n  U_{T}:|M_{i}\\rangle|\\alpha_{t}\\rangle|0\\rangle_{h}\\xrightarrow{\\,T_{i}\\,}|M^{\\prime}_{i}\\rangle|\\alpha_{t}\\rangle|0\\rangle_{h}.\n  U_{T}:|M_{i}\\rangle|\\alpha_{t}\\rangle|0\\rangle_{h}\\xrightarrow{\\,T_{i}\\,}|M_{i}\\rangle|\\alpha_{t}\\rangle|\\mathrm{0}\\rangle_{h}.\n  O\\!\\left(\\sqrt{N}\\left(C_{O}+2C_{A}+C_{S_{0}}\\right)\\right),\n  O\\left(\\sqrt{N}\\left(pkm\\log n\\right)\\right).\n  O\\left(pkm\\log n+\\sqrt{N}\\left(pkm\\log n\\right)\\right)=O(\\sqrt{N}pkm\\log n).\n\nSECTIONS:\n## I Introduction\nOver the past forty years, quantum computing has developed into an advanced and rapidly evolving discipline that integrates concepts from computer science, physics, and mathematics [1, 2, 3, 4, 5]. Quantum computing is appealing because quantum mechanics can provide an almost unlimited level of parallelism at small physical scales, a capability that classical computers cannot achieve without replicating hardware resources. Not all complex computational tasks may benefit from quantum parallelism but it has been established that for a sizable subset of problems such as factoring large integers, carrying out constrained and unconstrained search, and completing optimization, quantum computing provides an efficient method of solution to circumvent the exponential resource growth required by classical methods [6, 7, 8]. Several areas within quantum computing are currently the focus of active research [9, 12, 13, 10, 11]. The main goal of our study in this paper is to address the problem of reachability within the context of quantum Petri nets. A Quantum Petri Net (QPN) model is built on the foundation of classical Petri net model, which is a well-known framework to model concurrent, distributed, and event-driven systems [15, 17]. Classical Petri nets have been widely used in domains such as communication networks, workflow systems, and manufacturing processes, because they effectively model synchronization, concurrency, and resource sharing problems [14, 16, 18]. However, such Petri nets are inherently limited to modeling deterministic or stochastic classical processes and thus cannot naturally capture the distinctive behaviors of quantum systems. By integrating principles of quantum mechanics into the classical Petri net token model, QPN permits modeling quantum states, such as superposition and entanglement, together with their stochastic evolution in time. This extended framework enables the representation of complex quantum behaviors that cannot be effectively captured by classical Petri nets. To this end, we consider a central analytical problem in classical Petri nets, namely the reachability in such nets, i.e., to determine whether a desired marking (state) can be obtained from an initial marking through a finite sequence of transitions [22, 20, 21]. The extreme complexity of the unbounded token case is well-known and we refer the reader to [23, 24, 25, 19] for the study and mitigation of the state-space explosion problem in unbounded Petri nets. In this paper, we focus on conservative Petri nets in which the number of tokens is fixed. We introduce a quantum-inspired computational approach that leverages quantum parallelism to explore reachable markings efficiently in such Petri nets using the QPN model. For a Petri net with n tokens and m places, a simple computation shows that the number of Petri nets is bounded by and for a Petri net with k transitions, it may take steps to determine if a target marking is reachable from a source marking even with the use of DFS and BFS algorithms. Our theoretical analysis establishes that quantum parallelism provides a quadratic speed-up over such algorithms, demonstrating the utility and benefit of the quantum Petri net model. The remainder of the paper is organized as follows. The next section describes the QPN model. Section III formalizes the quantum reachability problem and provides our quantum reachability search algorithm. Section IV provides a case study to demonstrate the use of our algorithm and the paper is concluded in Section V.\n## II Quantum Petri Net Model\nThe Quantum Petri Net (QPN) model extends the classical Petri net model by integrating quantum mechanical principles including quantum state representation, quantum dynamics, and intrinsic probabilistic behavior into the classical Petri net model. The QPN model used here was derived from our earlier work[27]. Definition 1: A Quantum Petri net (QPN) is a 6-tuple (D,P,T,E,\u03bct,vt) where: D is a finite set of quantum tokens henceforth to be referred to as q -tokens, P is a finite set of places , T is a finite set of transitions , E is a finite set of directed and labeled arcs, that connect places in P with transitions in T together with the number of q -tokens needed for a transition to fire or to consume, \u03bct, called a marking, is a mapping from P to the power set of D , where \u03bct(Pi) denotes the set of q -tokens residing in place Pi at time . vt(Pi) is an assignment of qubits to q -tokens in place Pi in marking \u03bct(Pi) at time t=0,1,2,.... Quantum tokens or q -tokens represent the qubits or multi-qubits in the QPN system. It\u2019s assumed that tokens are conserved as the QPN evolves over time. These q -tokens are visualized as small black filled circles stored within the larger empty circles called places. Places can store a certain number of q -tokens using a primitive building block called a quantum S-R (Q-S-R) flip-flop presented in our earlier work [27]. The Q-S-R flip-flop stores a qubit rather than a bit as in a classical S-R flip-flop. Transitions are visualized as a large rectangle, perform quantum operations to modify the state of q -tokens and position of q -tokens using quantum gates. Directed arcs that connect places to transitions are referred to as incoming arcs, and those that connect transitions to places are referred to as outgoing arcs. These arcs facilitate the flow of q -tokens between places, and the labels on them are placeholders for q -tokens that are fed into a transition or a place with indicated quantities. The distribution of q -tokens across the places and the order in which transitions are fired represent the various states of the QPN system, referred to as marking. The function v(Pi,\u03bc(t)) represents the assignment of qubits to q -tokens under the marking \u03bc at time t in place Pi . With each transition execution, the QPN system evolves; this evolution is represented by a firing sequence, i.e., a set of valid transitions of the QPN. Figure. 1 depicts the simple QPN model with n=4 q -tokens d\u2081,d\u2082,d\u2083,d\u2084 , m=4 places P\u2081,P\u2082,P\u2083,P\u2084 , k=2 transitions T\u2081,T\u2082 , and 5 directed arcs x\u2081,x\u2082,x\u2083,x\u2084,x\u2085, with their capacities s expectedly given by where N and M represent the total number of basis states generated during Phase I and th\n## IV Example\nIn this section, we illustrate the proposed algorithm through a detailed example. Consider the QPN in Figure 2, which consists of n=3 q -tokens d\u2081,d\u2082,d\u2083 , m=5 places P\u2081,P\u2082,P\u2083,P\u2084,P\u2085 , k=3 transitions T\u2081,T\u2082,T\u2083 , and z=7 directed arcs , with their firing capacities indicated next to each arc. As QPN contains only 3 q -tokens, each place may contain between 0 and 3 q -tokens, which can be represented by the two-bit encodings , , , and , respectively. Therefore, the marking register consists of ten qubits, with two qubits allocated to each place. Since the QPN contains three transitions, each transition register \u03b1i ( ) consists of two qubits. The encodings , , and represent the selection of no transition, T\u2081 , T\u2082 , and T\u2083 , respectively. For illustrative purposes, the algorithm is run for p=3 iterations. Consequently, three transition registers \u03b1\u2081,\u03b1\u2082,\u03b1\u2083 and three corresponding firing registers h\u2081,h\u2082,h\u2083 are used. Table I shows the initial configuration of the quantum registers, including the marking and ancillary registers. The markings are represented by their cardinality vectors. For example, the vector indicates that two q -token is located in place P\u2081 , one q -tokens are located in place P\u2082 , and no q -tokens are present in the remaining places. In the first iteration, Hadamard gates are applied to the qubits of the transition register \u03b1\u2081 , creating an equal superposition over the four possible selections, i.e., for the no transition, for T\u2081 , for T\u2082 , and for T\u2083 . The reversible transition operator UT is then applied to fire the selected transition, if it is enabled under the current marking. Given that the initial marking register is and T\u2081 is connected to P\u2081 and P\u2082, only tr <script>
const S = window.__SCENES__, CTX = window.__CONTEXT__;
const $ = (s, r) => (r || document).querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t);
  if (c) n.className = c; if (x != null) n.textContent = x; return n; };

function key() { return localStorage.getItem('p2v_key') || ''; }

// A page built by `paper2vid --serve` is opened from that same server, which
// already has a key in its environment -- asking the reader for one again is
// just friction. The same file opened from disk has no server behind it, so
// it falls back to BYOK. One artefact, both situations, decided at runtime.
let RELAY = false;
(async () => {
  try {
    const r = await fetch('/api/health', { cache: 'no-store' });
    RELAY = r.ok && (await r.json()).ok === true;
  } catch (e) { RELAY = false; }
  if (!RELAY) document.getElementById('kb').hidden = false;
})();

// Anthropic caps images around 1568px on the long edge; bigger just costs
// tokens for no gain. Plots are line art, so we keep PNG unless the payload
// is large enough that JPEG is worth the artefacts.
async function prepImage(dataUri) {
  const [head, b64] = dataUri.split(',');
  const media = head.slice(5, head.indexOf(';'));
  if (b64.length < 3_000_000) {
    const img = await new Promise((res, rej) => {
      const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUri;
    }).catch(() => null);
    if (img && Math.max(img.width, img.height) <= 1568)
      return { type: 'base64', media_type: media, data: b64 };
  }
  const img = await new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUri;
  });
  const k = Math.min(1, 1568 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const out = c.toDataURL('image/jpeg', 0.92);
  return { type: 'base64', media_type: 'image/jpeg', data: out.split(',')[1] };
}

async function ask(question, sc, into) {
  const k = key();
  if (!RELAY && !k) { into.className = 'answer err';
    into.textContent = 'Add your API key at the top of the page first. It stays in this browser.';
    return; }
  into.className = 'answer thinking'; into.textContent = 'Reading the figure...';

  const hasFig = sc.kind === 'figure' && sc.src;
  const sys = 'You are explaining a specific research paper to a curious reader '
    + 'who is not in this subfield.\n'
    + (hasFig
       ? 'The figure the reader is looking at is attached. Read it directly: '
         + 'legends, axis labels, line colours and styles, which curve is which. '
         + 'Questions about what a colour or marker represents are answered from '
         + 'the image, and you should answer them concretely.\n'
       : '')
    + 'Everything else must come from the paper context. If neither the image '
    + 'nor the context answers the question, say so plainly -- never invent '
    + 'numbers, results or comparisons. Two or three sentences. Plain words.';

  const text = 'PAPER CONTEXT:\n' + CTX.digest
    + '\n\nThe reader is looking at this part:\n' + sc.narration
    + (sc.caption ? '\nFigure caption: ' + sc.caption : '')
    + '\n\nTheir question: ' + question;

  try {
    const content = [];
    if (hasFig) {
      try { content.push({ type: 'image', source: await prepImage(sc.src) }); }
      catch (e) { /* fall back to text-only rather than failing the question */ }
    }
    content.push({ type: 'text', text });

    if (RELAY) {
      const r = await fetch('/api/ask', { method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ content, system: sys }) });
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      into.className = 'answer'; into.textContent = d.text;
      return;
    }
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': k,
                 'anthropic-version': '2023-06-01',
                 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 700,
                             system: sys,
                             messages: [{ role: 'user', content }] })
    });
    if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 200));
    const d = await r.json();
    into.className = 'answer';
    into.textContent = d.content.filter(b => b.type === 'text')
                                .map(b => b.text).join('');
  } catch (e) {
    into.className = 'answer err';
    into.textContent = 'Request failed: ' + e.message;
  }
}

function renderScene(sc) {
  const s = el('section', 'scene');
  if (sc.eyebrow) s.appendChild(el('p', 'eyebrow', sc.eyebrow));

  if (sc.kind === 'title') {
    const h = el('div', 'headcard');
    h.appendChild(el('h2', null, sc.headline));
    if (sc.deck) h.appendChild(el('p', null, sc.deck));
    s.appendChild(h);
  } else if (sc.kind === 'svg') {
    const d = el('div'); d.innerHTML = sc.svg;
    // The video bakes these reveals to a clock. Here they belong to the
    // reader's scroll: the same staged build, paced by them, not at them.
    d.querySelectorAll('[data-reveal]').forEach(n => n.removeAttribute('opacity'));
    s.appendChild(d);
  } else {
    const plate = el('div', 'plate');
    const img = new Image(); img.src = sc.src; img.alt = 'Figure ' + (sc.ref || '') + ' from the paper';
    plate.appendChild(img);
    (sc.annotations || []).forEach(a => {
      const h = el('div', 'hit');
      h.style.left = (a.x * 100) + '%'; h.style.top = (a.y * 100) + '%';
      h.appendChild(el('span', null, a.label));
      h.onclick = () => askAbout(s, sc, 'What is happening at the point labelled "'
        + a.label + '" on this figure?');
      plate.appendChild(h);
    });
    s.appendChild(plate);
    if (sc.caption) s.appendChild(el('p', 'caption', sc.caption));
    s.appendChild(el('p', 'hint', 'Click a marked point to ask about it'));
  }

  s.appendChild(el('p', 'narration', sc.narration));

  const bar = el('div', 'ask');
  // These three were answered when the page was built. Serving the stored
  // answer costs nothing and appears instantly; only free-text questions
  // still need the model.
  const canned = [
   ['Why does this matter?', 'Why does this part matter?', 'matters'],
   ['Explain simpler', 'Explain this part again, simpler, no jargon.', 'simpler'],
   ['Go deeper', 'Explain the technical detail behind this part.', 'deeper']];
  if (sc.kind === 'figure')
    canned.splice(1, 0, ['Read this figure',
      'Walk me through this figure: what is on each axis, what each colour, '
      + 'line style and marker represents, and what the reader should notice.',
      'figure']);
  canned
    .forEach(([label, q, key]) => {
      const b = el('button', null, label);
      b.onclick = () => {
        const ready = sc.prebaked && sc.prebaked[key];
        if (ready) {
          let a = s.querySelector('.answer');
          if (!a) { a = el('div', 'answer'); s.appendChild(a); }
          a.className = 'answer'; a.textContent = ready;
          a.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          return;
        }
        askAbout(s, sc, q);
      };
      bar.appendChild(b);
    });
  const inp = el('input'); inp.placeholder = 'Ask anything about this part...';
  inp.onkeydown = e => { if (e.key === 'Enter' && inp.value.trim()) {
    askAbout(s, sc, inp.value.trim()); inp.value = ''; } };
  bar.appendChild(inp);
  s.appendChild(bar);
  return s;
}

function askAbout(section, sc, question) {
  let a = $('.answer', section);
  if (!a) { a = el('div', 'answer'); section.appendChild(a); }
  a.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  ask(question, sc, a);
}

const wrap = $('.wrap');
S.forEach(sc => wrap.appendChild(renderScene(sc)));

// Reveal groups carry a 0-1 fraction from the storyboard. Map it onto a
// stagger so a scene assembles in the order its narration explains it.
const REVEAL_MS = 950;
const obs = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const s = e.target;
    s.classList.add('in');
    s.querySelectorAll('[data-reveal]').forEach(n => {
      const f = parseFloat(n.getAttribute('data-reveal')) || 0;
      setTimeout(() => n.classList.add('lit'), 260 + f * REVEAL_MS);
    });
    s.querySelectorAll('.hit').forEach((n, i) => {
      setTimeout(() => n.classList.add('lit'), 520 + i * 220);
    });
    obs.unobserve(s);
  });
}, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
document.querySelectorAll('.scene').forEach(s => obs.observe(s));

const ki = $('#k');
ki.value = key();
ki.oninput = () => localStorage.setItem('p2v_key', ki.value.trim());
</script>
</body></html>
