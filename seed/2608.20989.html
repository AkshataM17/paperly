<script>
window.__SCENES__ = [{"id": "s1", "narration": "Neutron stars are the densest objects we can actually observe. Pack enough matter together and something strange should happen: ordinary protons and neutrons transform into heavier particles called hyperons. But here's the problem. Every model that adds hyperons makes the star too soft to reach the two-solar-mass limit we've already measured.", "kind": "svg", "eyebrow": "THE HYPERON PUZZLE", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\"><rect x=\"120\" y=\"120\" width=\"1680\" height=\"840\" fill=\"#F7F6F3\"/><text x=\"960\" y=\"210\" text-anchor=\"middle\" class=\"p2v-head\" font-size=\"54\" fill=\"#1A1D23\">The Hyperon Puzzle</text></g><g data-reveal=\"0.2\"><ellipse cx=\"600\" cy=\"560\" rx=\"220\" ry=\"220\" fill=\"none\" stroke=\"#2A6F97\" stroke-width=\"2\"/><text x=\"600\" y=\"420\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#2A6F97\">NEUTRON STAR CORE</text><text x=\"600\" y=\"555\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"28\" fill=\"#1A1D23\">n, p</text><text x=\"600\" y=\"600\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#6B7280\">ordinary nucleons</text></g><g data-reveal=\"0.5\"><text x=\"960\" y=\"560\" text-anchor=\"middle\" font-size=\"48\" fill=\"#6B7280\">\u2192</text><ellipse cx=\"1320\" cy=\"560\" rx=\"220\" ry=\"220\" fill=\"none\" stroke=\"#D6215F\" stroke-width=\"2\"/><text x=\"1320\" y=\"490\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#D6215F\">HIGH DENSITY</text><text x=\"1320\" y=\"555\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"28\" fill=\"#1A1D23\">n, p, \u039b, \u03a3, \u039e</text><text x=\"1320\" y=\"600\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#6B7280\">nucleons + hyperons</text></g><g data-reveal=\"0.75\"><rect x=\"960\" y=\"720\" width=\"560\" height=\"80\" fill=\"none\" stroke=\"#D6215F\" stroke-width=\"2\"/><text x=\"1240\" y=\"768\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"24\" fill=\"#D6215F\">EOS SOFTENS \u2192 MAX MASS TOO LOW</text></g>\n</svg>"}, {"id": "s2", "narration": "The tension is real. Pulsars like PSR J0740 and PSR J0952 have been measured above two solar masses. Any equation of state \u2014 the recipe that links pressure to density \u2014 must support that. Hyperons make matter more compressible, dropping the ceiling. Something has to give, and we don't know what.", "kind": "svg", "eyebrow": "OBSERVATIONAL LOWER BOUND", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\"><rect x=\"120\" y=\"120\" width=\"1680\" height=\"840\" fill=\"#F7F6F3\"/><line x1=\"300\" y1=\"860\" x2=\"300\" y2=\"200\" stroke=\"#1A1D23\" stroke-width=\"2\"/><line x1=\"300\" y1=\"860\" x2=\"1800\" y2=\"860\" stroke=\"#1A1D23\" stroke-width=\"2\"/><text x=\"200\" y=\"540\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#6B7280\" transform=\"rotate(-90,200,540)\">NEUTRON STAR MASS (SOLAR MASSES)</text><text x=\"1050\" y=\"940\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#6B7280\">CENTRAL DENSITY</text></g><g data-reveal=\"0.2\"><polyline points=\"350,750 600,600 900,420 1200,350 1500,320 1750,315\" fill=\"none\" stroke=\"#2A6F97\" stroke-width=\"3\"/><text x=\"1760\" y=\"310\" class=\"p2v-lab\" font-size=\"18\" fill=\"#2A6F97\">NUCLEONIC</text></g><g data-reveal=\"0.45\"><polyline points=\"350,750 600,650 900,550 1200,530 1400,528 1500,527\" fill=\"none\" stroke=\"#D6215F\" stroke-width=\"3\"/><text x=\"1510\" y=\"522\" class=\"p2v-lab\" font-size=\"18\" fill=\"#D6215F\">WITH HYPERONS (SU6)</text></g><g data-reveal=\"0.7\"><line x1=\"300\" y1=\"430\" x2=\"1800\" y2=\"430\" stroke=\"#1A1D23\" stroke-width=\"2\" stroke-dasharray=\"10,6\"/><text x=\"310\" y=\"415\" class=\"p2v-lab\" font-size=\"20\" fill=\"#1A1D23\">2 SOLAR MASSES OBSERVED</text><text x=\"950\" y=\"600\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#D6215F\">SU(6) hyperons cannot reach this</text></g>\n</svg>"}, {"id": "s3", "narration": "The fix might lie in the symmetry rules we use to set how hyperons interact with force-carrying mesons. SU(6) spin-flavor symmetry is strict \u2014 it pins one key coupling ratio to exactly one. SU(3) flavor symmetry relaxes that. It lets the vector repulsion in the strange sector vary freely, potentially stiffening the star back up.", "kind": "svg", "eyebrow": "TWO SYMMETRY FRAMEWORKS", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\"><rect x=\"120\" y=\"120\" width=\"1680\" height=\"840\" fill=\"#F7F6F3\"/><text x=\"960\" y=\"200\" text-anchor=\"middle\" class=\"p2v-head\" font-size=\"44\" fill=\"#1A1D23\">Symmetry Controls Repulsion</text></g><g data-reveal=\"0.2\"><rect x=\"160\" y=\"260\" width=\"700\" height=\"560\" fill=\"none\" stroke=\"#2A6F97\" stroke-width=\"2\"/><text x=\"510\" y=\"320\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"26\" fill=\"#2A6F97\">SU(6) FRAMEWORK</text><text x=\"510\" y=\"400\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#1A1D23\">Quark model + isospin rules</text><text x=\"510\" y=\"460\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#1A1D23\">Vector coupling ratio \u03b1v</text><text x=\"510\" y=\"530\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"36\" fill=\"#2A6F97\">\u03b1v = 1  (fixed)</text><text x=\"510\" y=\"620\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#6B7280\">No freedom in strange</text><text x=\"510\" y=\"660\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#6B7280\">vector sector</text></g><g data-reveal=\"0.5\"><rect x=\"1060\" y=\"260\" width=\"700\" height=\"560\" fill=\"none\" stroke=\"#D6215F\" stroke-width=\"2\"/><text x=\"1410\" y=\"320\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"26\" fill=\"#D6215F\">SU(3) FRAMEWORK</text><text x=\"1410\" y=\"400\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#1A1D23\">Flavor symmetry, 3 quarks</text><text x=\"1410\" y=\"460\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#1A1D23\">Vector coupling ratio \u03b1v</text><text x=\"1410\" y=\"530\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"36\" fill=\"#D6215F\">\u03b1v free to vary</text><text x=\"1410\" y=\"620\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#6B7280\">More repulsion allowed</text><text x=\"1410\" y=\"660\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#6B7280\">in strange sector</text></g><g data-reveal=\"0.75\"><text x=\"960\" y=\"870\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#1A1D23\">Which framework better fits real neutron star observations?</text></g>\n</svg>"}, {"id": "s4", "narration": "To answer that, the team ran a Bayesian inference \u2014 feeding all available constraints into the model and letting the data vote. Inputs included nuclear saturation properties, chiral effective field theory, heavy-ion data, gravitational-wave measurements from the neutron star merger GW170817, and NICER X-ray timing observations of mass and radius.", "kind": "svg", "eyebrow": "BAYESIAN INFERENCE PIPELINE", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\ nsity regions, respectively; solid and dashed curves indicate their boundaries. The star denotes the SU(6) reference point, , in the adopted parametrization.", "ref": "F1", "annotations": []}, {"id": "s6", "narration": "Those coupling differences cascade into the equation of state. SU(6) softens the pressure significantly at high density because hyperons appear early and in large numbers. SU(3) can delay their onset and limit their abundance, keeping the pressure closer to the nucleonic baseline. The stiffness of the star depends heavily on which symmetry you assume.", "kind": "svg", "eyebrow": "EQUATION OF STATE STIFFNESS", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\"><rect x=\"120\" y=\"120\" width=\"1680\" height=\"840\" fill=\"#F7F6F3\"/><line x1=\"280\" y1=\"880\" x2=\"280\" y2=\"200\" stroke=\"#1A1D23\" stroke-width=\"2\"/><line x1=\"280\" y1=\"880\" x2=\"1780\" y2=\"880\" stroke=\"#1A1D23\" stroke-width=\"2\"/><text x=\"180\" y=\"545\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#6B7280\" transform=\"rotate(-90,180,545)\">PRESSURE</text><text x=\"1030\" y=\"950\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#6B7280\">DENSITY</text></g><g data-reveal=\"0.25\"><polyline points=\"320,820 500,700 750,520 1000,390 1300,290 1600,240\" fill=\"none\" stroke=\"#1A1D23\" stroke-width=\"3\"/><text x=\"1610\" y=\"235\" class=\"p2v-lab\" font-size=\"18\" fill=\"#1A1D23\">NUCLEONIC</text></g><g data-reveal=\"0.5\"><polyline points=\"320,820 500,710 750,570 1000,470 1300,400 1600,375\" fill=\"none\" stroke=\"#2A6F97\" stroke-width=\"3\"/><text x=\"1610\" y=\"370\" class=\"p2v-lab\" font-size=\"18\" fill=\"#2A6F97\">SU(3)</text></g><g data-reveal=\"0.75\"><polyline points=\"320,820 500,750 750,660 1000,620 1200,615 1300,614\" fill=\"none\" stroke=\"#D6215F\" stroke-width=\"3\"/><text x=\"1310\" y=\"609\" class=\"p2v-lab\" font-size=\"18\" fill=\"#D6215F\">SU(6) \u2014 SOFTENS EARLY</text><text x=\"780\" y=\"780\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#D6215F\">Hyperons appear earlier, pressure drops</text></g>\n</svg>"}, {"id": "s7", "narration": "That stiffness difference shows up in what we can actually measure: the mass-radius relation and tidal deformability. SU(3) stars overlap substantially with purely nucleonic predictions. SU(6) stars are noticeably smaller and lighter. Crucially, SU(6) struggles to reach two solar masses. SU(3) clears that bar comfortably.", "kind": "svg", "eyebrow": "MASS\u2013RADIUS PREDICTIONS", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Int 950,410 680,650 450,860 Z\" fill=\"#1A1D23\" fill-opacity=\"0.08\" stroke=\"#1A1D23\" stroke-width=\"2\"/><text x=\"1410\" y=\"310\" class=\"p2v-lab\" font-size=\"18\" fill=\"#1A1D23\">NUCLEONIC</text></g><g data-reveal=\"0.45\"><path d=\"M 380,820 C 580,620 860,380 1350,310 L 1350,380 C 870,450 620,680 420,860 Z\" fill=\"#2A6F97\" fill-opacity=\"0.10\" stroke=\"#2A6F97\" stroke-width=\"2\"/><text x=\"1355\" y=\"345\" class=\"p2v-lab\" font-size=\"18\" fill=\"#2A6F97\">SU(3)</text></g><g data-reveal=\"0.65\"><path d=\"M 360,820 C 520,680 740,520 1080,490 L 1080,560 C 760,600 550,750 390,860 Z\" fill=\"#D6215F\" fill-opacity=\"0.12\" stroke=\"#D6215F\" stroke-width=\"2\"/><text x=\"1085\" y=\"520\" class=\"p2v-lab\" font-size=\"18\" fill=\"#D6215F\">SU(6) \u2014 SOFTER, SMALLER</text><line x1=\"300\" y1=\"430\" x2=\"1780\" y2=\"430\" stroke=\"#1A1D23\" stroke-width=\"2\" stroke-dasharray=\"12,6\"/><text x=\"315\" y=\"415\" class=\"p2v-lab\" font-size=\"18\" fill=\"#1A1D23\">2 M\u2609 THRESHOLD</text></g>\n</svg>"}, {"id": "s8", "narration": "So are there observable signatures that definitively reveal hyperons? Not really. Features like enhanced curvature in the mass-radius curve or a modified oscillation spectrum do appear in SU(6), where hyperons dramatically soften the star. But in SU(3), these signatures largely wash out. The hyperon fingerprint depends entirely on which interaction prescription you use.", "kind": "svg", "eyebrow": "HYPERON SIGNATURES: MODEL DEPENDENT", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\"><rect x=\"120\" y=\"120\" width=\"1680\" height=\"840\" fill=\"#F7F6F3\"/><text x=\"960\" y=\"195\" text-anchor=\"middle\" class=\"p2v-head\" font-size=\"40\" fill=\"#1A1D23\">Same Observable, Different Meaning</text></g><g data-reveal=\"0.2\"><rect x=\"160\" y=\"240\" width=\"700\" height=\"580\" fill=\"none\" stroke=\"#2A6F97\" stroke-width=\"2\"/><text x=\"510\" y=\"300\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"24\" fill=\"#2A6F97\">SU(6)</text><text x=\"510\" y=\"390\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#1A1D23\">Early hyperon onset</text><text x=\"510\" y=\"450\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#1A1D23\">Strong EOS softening</text><text x=\"510\" y=\"530\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#1A1D23\">Visible curvature kink</text><text x=\"510\" y=\"590\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#1A1D23\">Modified oscillations</text><text x=\"510\" y=\"680\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#2A6F97\">SIGNATURES VISIBLE</text></g><g data-reveal=\"0.5\"><rect x=\"1060\" y=\"240\" width=\"700\" height=\"580\" fill=\"none\" stroke=\"#D6215F\" stroke-width=\"2\"/><text x=\"1410\" y=\"300\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"24\" fill=\"#D6215F\">SU(3)</text><text x=\"1410\" y=\"390\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#1A1D23\">Delayed hyperon onset</text><text x=\"1410\" y=\"450\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#1A1D23\">Mild EOS softening</text><text x=\"1410\" y=\"530\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#1A1D23\">Curvature kink weak</text><text x=\"1410\" y=\"590\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#1A1D23\">Oscillations near nucleonic</text><text x=\"1410\" y=\"680\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#D6215F\">SIGNATURES WASHED OUT</text></g><g data-reveal=\"0.8\"><text x=\"960\" y=\"890\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#1A1D23\">A reduced maximum mass is not a universal signature of hyperons</text></g>\n</svg>"}, {"id": "s9", "narration": "Bayesian model comparison delivers the verdict. Current data provide positive but not decisive evidence against SU(6). Meanwhile, the SU(3) hyperonic scenario and the purely nucleonic scenario are statistically indistinguishable. Today's observations simply cannot tell us whether neutron star cores contain hyperons \u2014 if those hyperons interact under SU(3) rules.", "kind": "svg", "eyebrow": "BAYESIAN MODEL COMPARISON", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\"><rect x=\"120\" y=\"120\" width=\"1680\" height=\"840\" fill=\"#F7F6F3\"/><text x=\"960\" y=\"195\" text-anchor=\"middle\" class=\"p2v-head\" font-size=\"42\" fill=\"#1A1D23\">What the Data Actually Decide</text></g><g data-reveal=\"0.2\"><rect x=\"200\" y=\"260\" width=\"460\" height=\"500\" fill=\"none\" stroke=\"#1A1D23\" stroke-width=\"2\"/><text x=\"430\" y=\"330\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#1A1D23\">NUCLEONIC</text><text x=\"430\" y=\"500\" text-anchor=\"middle\" font-size=\"64\" fill=\"#1A1D23\">\u2248</text><text x=\"430\" y=\"650\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#1A1D23\">NOT DISTINGUISHED</text></g><g data-reveal=\"0.4\"><rect x=\"730\" y=\"260\" width=\"460\" height=\"500\" fill=\"none\" stroke=\"#2A6F97\" stroke-width=\"2\"/><text x=\"960\" y=\"330\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#2A6F97\">SU(3) HYPERONIC</text><text x=\"960\" y=\"500\" text-anchor=\"middle\" font-size=\"64\" fill=\"#2A6F97\">\u2248</text><text x=\"960\" y=\"650\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#2A6F97\">NOT DISTINGUISHED</text><line x1=\"660\" y1=\"510\" x2=\"730\" y2=\"510\" stroke=\"#6B7280\" stroke-width=\"2\" stroke-dasharray=\"8,4\"/></g><g data-reveal=\"0.6\"><rect x=\"1260\" y=\"260\" width=\"460\" height=\"500\" fill=\"none\" stroke=\"#D6215F\" stroke-width=\"2\"/><text x=\"1490\" y=\"330\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"22\" fill=\"#D6215F\">SU(6) HYPERONIC</text><text x=\"1490\" y=\"500\" text-anchor=\"middle\" font-size=\"64\" fill=\"#D6215F\">\u2717</text><text x=\"1490\" y=\"640\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#D6215F\">POSITIVE EVIDENCE</text><text x=\"1490\" y=\"680\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#D6215F\">AGAINST</text></g><g data-reveal=\"0.8\"><text x=\"960\" y=\"860\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#6B7280\">Current constraints limit interaction assumptions more than composition</text></g>\n</svg>"}, {"id": "s10", "narration": "What this opens up: we can now place quantitative pressure on the interaction physics, not just ask whether hyperons exist. Future hypernuclear experiments, tighter pulsar mass measurements, and next-generation X-ray telescopes can close in on \u03b1v \u2014 the coupling ratio that sits at the heart of the puzzle. The composition question and the interaction question are finally separable.", "kind": "title", "eyebrow": "WHAT COMES NEXT", "headline": "Interactions, Not Composition, Are Constrained First", "deck": "Better hypernuclear data and pulsar measurements can pin down the coupling ratio \u03b1v \u2014 and finally answer the hyperon question."}];
window.__CONTEXT__ = {"digest": "TITLE: Neutron star matter with hyperons: Bayesian comparison of nucleonic and SU(6)/SU(3) hyperonic models\nARXIV: 2608.20989\nABSTRACT: We investigate neutron star matter with hyperons within a density-dependent relativistic mean-field framework using Bayesian inference, considering three composition scenarios: purely nucleonic matter, hyperonic matter under SU(6) flavor symmetry, and hyperonic matter under SU(3) symmetry with free vector-sector parameters. The analysis incorporates constraints from empirical nuclear matter properties, theoretical inputs at low densities, and multimessenger observations of neutron stars. We find that the SU(6) scheme, grounded in the quark model and isospin counting rule, leads to a significantly softer equation of state. In contrast, the additional flexibility of the SU(3) framework enhances vector repulsion and yields a comparatively stiffer equation of state consistent with observational bounds across the explored parameter space; in particular, the posterior distributions favor values of the vector coupling ratio \u03b1v lower than the SU(6) limit \u03b1v=1 . These differences are reflected in neutron star observables, including mass\u2013radius relations, tidal deformabilities, direct Urca thresholds, and oscillation properties, all of which remain compatible with current constraints within the SU(3) scenario. We further examine structural signatures through the curvature of the mass\u2013radius relation and find that, although hyperon-rich configurations can induce noticeable variations, such features depend sensitively on the stiffness of the equation of state and are therefore not universally robust indicators. Bayesian model comparison further shows that present constraints do not meaningfully discriminate between the purely nucleonic and SU(3) hyperonic scenarios, while providing positive, but not decisive, evidence against the more restrictive SU(6) framework.\n\nFIGURES (refer to these by ref):\n  [F1] Sensitivity of the SU(3) vector-sector inference to the lower bound imposed on the maximum neutron-star mass. Upper panels show the relative profile likelihood in the (\u03b1v,zv) plane for the three adopted mass thresholds. Each upper panel is normalized independently to its own maximum likelihood. Lower panels show the corresponding marginalized posterior distributions after integrating over all rema\n\nEQUATIONS (LaTeX):\n  U(\\sigma)=\\frac{1}{3}g_{2}\\sigma^{3}+\\frac{1}{4}g_{3}\\sigma^{4}.\n  m_{B}^{*}=m_{B}-g_{\\sigma B}\\,\\sigma,\n  \\mu_{B}=\\sqrt{k_{F_{B}}^{2}+m_{B}^{*2}}+g_{\\omega B}\\,\\omega_{0}+g_{\\phi B}\\,\\phi_{0}+I_{3B}\\,g_{\\rho B}\\,\\rho_{03}.\n  Q=\\sum_{B}q_{B}n_{B}-n_{e}-n_{\\mu}=0,\n  \\mu_{i}=b_{i}\\mu_{n}-q_{i}\\mu_{e},\n  \\mathcal{L}_{\\text{YUK}}=-\\,g\\,(\\bar{\\psi}_{B}\\psi_{B})\\,M\\,,\n  \\mathcal{L}_{\\text{YUK}}=-(g_{s}C_{1}+g_{a}C_{2})\\,(\\bar{\\psi}_{B}\\psi_{B})M\n  \\mathcal{L}_{\\text{YUK}}=-g_{1}M,\n  g_{8}=\\sqrt{\\frac{30}{40}}\\,g_{s}+\\sqrt{\\frac{6}{24}}\\,g_{a},\\qquad\\alpha_{v}={\\sqrt{\\frac{6}{24}}\\,\\frac{g_{a}}{g_{8}}}.\n  g_{\\omega N}\\omega_{0}\\rightarrow\\tilde{g}_{\\omega N}\\omega_{0}+g_{\\phi N}\\phi_{0}.\n\nSECTIONS:\n## I Introduction\nA major uncertainty in the physics of neutron star (NS) interiors concerns the role of hyperons in dense baryonic matter. Their appearance is energetically favored at high densities, but the resulting changes in the equation of state (EOS) depend sensitively on the poorly constrained strong interactions in the strange baryon sector. More broadly, despite extensive studies, the exact composition of NS interiors remains uncertain. Various possibilities have been proposed, including the presence of heavy baryons 119; 111; 66, hyperons 129; 139; 135; 27; 69; 108, meson condensates 95; 9, and deconfined quark matter 92; 41; 42; 73; 64; 65; 54. Once exotic degrees of freedom appear, baryonic matter fragments into multiple Fermi components, altering the EOS and its response to compression, with direct implications for transport properties and oscillation modes 139; 23; 39. In particular, while hyperon formation is energetically favored at high densities, their presence generally softens the EOS, making it difficult to sustain the large masses observed in NSs, a tension known as the hyperon puzzle 13; 128; 99; 70; 122; 7; 68. Importantly, this is not simply a numerical mismatch but reflects a deeper uncertainty in how particles interact in dense matter. The degree to which the EOS softens depends strongly on the interplay between attractive scalar interactions and repulsive vector interactions in the strange sector. Additional effects, such as repulsive channels, many-body contributions 55; 138, momentum-dependent interactions 116; 131; 132; 33; 21, and hyperonic three-body interactions of the type NNY , NYY , and YYY , can partially counterbalance the softening 70; 68. In particular, repulsive YY channels mediated by hidden-strangeness vector mesons, density-dependent couplings, higher-order mesonic terms in relativistic mean-field models, and chiral NN\u039b three-body forces have all been shown to delay hyperon onset and stiffen the EOS 68; 138. Recent ab initio calculations have further emphasized this point by including N\u039b , \u039b\u039b , NN\u039b , and N\u039b\u039b interactions and showing that hyperonic matter can remain compatible with present mass, radius, and tidal-deformability constraints 70; 123. In this sense, the hyperon puzzle should be viewed not as a contradiction but as a useful constraint on the nature of dense matter interactions, bridging nuclear physics experiments with astrophysical inference 48; 56; 89; 75. The nuclear physics input to the strange sector is informed by \u039b hypernuclear spectroscopy, where high-resolution experiments, particularly at JLab, probe the \u039b N interaction and constrain hyperonic interactions relevant for dense matter 47; 40. Astrophysical inference complements this by constraining dense matter through observations of NS masses, radii, and tidal deformabilities from gravitational waves, along with cooling and timing measurements, thereby placing empirical bounds on the EOS and the possible presence of strangeness. Representative high-precision mass measurements further reinforce these constraints, including PSR J1614 - 2230 ( ) 91, PSR J0740+6620 ( with 95% credibility) 82, PSR J0348+0432 ( ) 8; 52, PSR J1810+1744 ( ) 103, and PSR J0952 - 0607 ( ) 104, which impose stringent lower bounds on the maximum mass, thereby disfavoring excessively soft EOSs and constraining the role of exotic degrees of freedom such as hyperons. In hyperonic dense matter, symmetry principles play a central role in constraining the otherwise poorly known interactions in the strange sector. In particular, the choice between SU(6) spin\u2013flavor symmetry and the more general SU(3) flavor symmetry leads to qualitatively different prescriptions for hyperon\u2013meson couplings, thereby affecting the composition and stiffness of the EOS, with direct consequences for NS and observables. While SU(6) symmetry provides a commonly adopted and more restrictive framework, SU(3) symmetry allows greater flexibility in the vector interaction sector, enabling a broader exploration of dense-matter properties 133; 71; 51. Given the limited experimental constraints on hyperonic interactions, it becomes essential to systematically test how these symmetry assumptions translate into observable consequences in dense matter. Motivated by this interplay, the inclusion of hyperons in NS matter, first proposed by Ambartsumyan and Saakyan 3, has been extensively studied using microscopic 70; 138; 59; 110 and phenomenological approaches 127; 25; 44; 78; 90, including relativistic mean-field models with density-dependent and SU(3)/SU(6)-motivated coupling\n## II Formalism\nThe dense matter considered in this work consists of baryon octet (n, p, \u039b, \u03a3^+, \u03a3^0, \u03a3^-, \u039e^0, \u039e^-) in \u03b2 equilibrium with leptons (e^-,\u03bc^-) . The system is described within the relativistic mean-field (RMF) framework 130; 94, where the strong interactions among hadrons are mediated by the isoscalar\u2013scalar \u03c3 , isoscalar\u2013vector \u03c9^\u03bc and \u03c6^\u03bc , and isovector\u2013vector \u03c1^\u03bc meson fields. Accordingly, the Lagrangian density is written as 108; 107 The baryonic degrees of freedom are described by the Dirac spinor \u03c8B , with the vacuum mass mB and the isospin operator . The quantities \u03c9_\u03bc\u03bd , \u03c6_\u03bc\u03bd , and \u03c1_\u03bc\u03bd correspond to the field strength tensors of the \u03c9 , \u03c6 , and \u03c1 mesons, respectively. The scalar self-interaction term 12 is expressed as The calculation is carried out within the mean-field approximation 113. The symbols \u03c3 , \u03c9\u2080 , \u03c1\u2080\u2083 , and \u03c6\u2080 represent the mean values of the respective meson fields. Consequently, the meson operators are replaced by their expectation values, leading to the meson-field equations in the form presented below. The baryon scalar and vector number densities are given as where JB , k_FB and I\u2083B are the spin, Fermi momentum and the third component of the isospin projection. The effective mass of a baryon B is given by and the corresponding chemical potential is Since the hadronic phase is required to satisfy charge neutrality, the total charge density is given by with qB being the electric charge of baryon B , and ne , n_\u03bc the number densities of electrons and muons, respectively. The chemical equilibrium condition for each species is We denote the chemical potentials of the i th baryon, neutron, and electron by \u03bci , \u03bcn , and \u03bce , respectively. The corresponding conserved charges, baryon number and electric charge, are given by bi and qi . The total energy density is given by and the pressure is given by In the SU(6) spin\u2013flavor symmetry framework, a unified depiction of strongly interacting matter at high densities is attained by incorporating hyperons into the baryonic sector alongside nucleons. The study determines the baryon\u2013meson coupling constants utilizing the quark model and isospin counting (QMIC) rule 5, which are given as follows The framework of SU(3) flavor symmetry, which incorporates the up, down, and strange quarks, provides a natural and consistent basis for describing strongly interacting matter at high densities. This method extends the baryonic sector to incorporate hyperons as inherent degrees of freedom in addition to nucleons. An invariant Yukawa Lagrangian can be formulated to describe the interactions of the baryon octet with the mediator nonet mesons 28; 72, where \u03c8B denotes the Dirac field of the interacting baryons and M represents the mediator meson field. This Lagrangian belongs to the irreducible representation , corresponding to a unitary singlet. The vector mesons \u03c9\u2088 and \u03c1\u2080 belong to the vector octet , while \u03c6\u2081 is a vector singlet. To preserve unitary symmetry, the bilinear must transform as when and as when . Using the symmetric and antisymmetric couplings of , the Yukawa interaction can be written as for octet mediator mesons, and for singlet mediator mesons, where g\u2081 is the meson singlet coupling, C\u2081 and C\u2082 denote the SU(3) Clebsch\u2013Gordan coefficients associated with the symmetric and antisymmetric couplings, respectively, and gs and ga are the symmetric and antisymmetric couplings. We use the CG coefficients of Ref. 80 and, following Ref. 28, define the constants The flavor SU(3) symmetry involves three parameters: the weight factor \u03b1v [ \u03b1v=F/(F+D) , F- antisymmetric coupling and D- symmetric coupling], the coupling ratio z=g\u2088/g\u2081 where g\u2088 and g\u2081 is the octet and singlet coupling respectively; and the mixing angle \u03b8v 5; 88; 100. Hence, in terms of these parameters, we can write the baryon vector meson coupling constants as In nature, the physical isospin-singlet vector mesons \u03c9 and \u03c6 arise as mixtures of the idealized \u03c9\u2088 and \u03c6\u2081 states 29: Here \u03b8v denotes the mixing angle between the \u03c9\u2088 and \u03c6\u2081 states. The couplings of the physical \u03c9 meson are then given by The \u03c6 -meson couplings follow from the \u03c9 -meson couplings under the substitutions and 29. From the above expressions, considering an ideal mixing angle ( ), the meson-hyperon couplings can be written as follows: (i) \u03c9 -hyperon couplings (ii) \u03c6 -hyperon couplings (iii) \u03c1 -hyperon couplings When \u03c6 interaction is considered in SU(3) symmetry we must reparametrize g_\u03c9 N so that the nuclear matter properties remain unchanged 135; 72: Then we obtain the modified value of g_\u03c9 N as In Bayesian parameter estimatio\n## III Results\nThe posterior distributions of the DDRMF model parameters g_\u03c3 , g_\u03c9 , g_\u03c1 , a_\u03c3 , a_\u03c9 , and a_\u03c1 for the nucleonic, SU(6), and SU(3) symmetry schemes are presented in Fig. 1. The diagonal panels show the one-dimensional marginalized posterior distributions of the individual parameters. The off-diagonal panels illustrate the two-dimensional joint posterior distributions, highlighting the correlations among the model parameters through the elliptical confidence contours. In particular, the coupling constants g_\u03c3 and g_\u03c9 exhibit a strong correlation, reflecting the tight constraints imposed by the nuclear saturation properties, while moderate correlations are also observed between the coupling constants and their corresponding density dependence parameters a_\u03c3 and a_\u03c9 . From the plot, the marginalized one-dimensional posterior distributions of the model parameters are largely similar between the nucleonic and SU(3) cases, indicating that the inclusion of hyperons within the SU(3) framework does not substantially modify the preferred parameter space. In contrast, the SU(6) case exhibits noticeable deviations in the distributions for most parameters, reflecting a systematic shift in their inferred values. An exception to this trend is the g_\u03c1 coupling, whose distribution remains nearly unchanged across all three scenarios, signifying the dominant role of scalar \u03c3 and isoscalar vector \u03c9 couplings in the hyperonic sector within the RMF framework. Figure 2 provide a clear visualization of the posterior distributions and the correlations among the hyperon coupling parameters within the SU(3) symmetry framework. In the SU(3) scenario, the scalar coupling ratios r_\u03c3\u039b , r_\u03c3\u03a3 , and r_\u03c3\u039e display relatively broad posterior distributions as compared to the SU(6), indicating that these parameters are only weakly constrained by the imposed physical conditions. This spread reflects a significant degree of uncertainty and flexibility in the scalar sector, allowing multiple combinations of couplings to satisfy the same observational or theoretical constraints. In contrast, the vector-sector parameters, particularly \u03b1v , appear comparatively better constrained, with narrower distributions suggesting a stronger sensitivity to the underlying constraints. Notably, \u03b1v is fixed to 1 in the SU(6) limit, whereas in the SU(3) case it exhibits a substantial deviation from this value, reflecting the additional freedom permitted by the relaxed symmetry. The two-dimensional projections further reveal nontrivial correlations among the scalar couplings, as well as between scalar and vector parameters. In particular, r_\u03c3\u039b and r_\u03c3\u039e exhibit a strong positive correlation. On the other hand, the SU(6) symmetry case exhibits markedly different behavior. The posterior distributions of the hyperon coupling ratios are essentially flat, reflecting the adoption of flat priors and the fact that current observations do not provide significant constraints on these parameters, unlike in the SU(3) case. For this reason, these distributions are not shown. The corresponding median values, along with the 95% ( 2\u03c3 ) and 68% ( 1\u03c3 ) credible intervals, are reported as superscript/subscript bounds, with the latter given in parentheses, and are presented in Table 3. The values of r_\u03c3\u039b , r_\u03c3\u03a3 , and r_\u03c3\u039e are generally higher in the SU(3) case than in the SU(6) case. While SU(6) corresponds to \u03b1v=1 , the SU(3) posterior favors comparatively lower values of \u03b1v , with zv remaining allowed over a broad range of values with no correlation between them. Figure 3 presents the posterior distributions and correlations among the key nuclear matter properties, including the incompressibility modulus K\u2080 , the skewness parameter Q\u2080 , and the symmetry-energy parameters J , L , K_sym , Q_sym , together with the higher-order coefficients Z\u2080 and Z_sym . These quantities enter the expansion of the energy per particle of symmetric nuclear matter, E(n)/A , and of the symmetry energy, S(n) , around the saturation density n\u2080 as with \u03c7=(n-n\u2080)/(3n\u2080) , where S(n) denotes the symmetry energy as a function of baryon density. The expected correlations among the nuclear matter parameters are clearly visible in Fig. 3. On the isoscalar side, the posterior distributions of K\u2080 and Q\u2080 differ noticeably when going from the nucleonic case to the SU(3) and SU(6) hyperonic scenarios. The SU(3) results remain comparatively close to the nucleonic ones, indicating that this framework largely preserves nucleonic-like behavior. In contrast, the SU(6) case exhibits a more pronounced shift, reflecting its ten\n## IV Summary\nWe have carried out a Bayesian analysis of neutron-star matter within a density-dependent relativistic mean-field framework, comparing purely nucleonic matter with hyperonic matter described by the restrictive SU(6) prescription and by a generalized SU(3) vector sector with free parameters \u03b1v and zv . All three scenarios are confronted with the same set of nuclear, hypernuclear, chiral-EFT, heavy-ion, gravitational-wave, and NICER constraints, allowing their differences to be traced directly to the assumed composition and hyperon\u2013meson interaction structure. The restrictive SU(6) prescription leads to earlier hyperon onset, stronger softening of the equation of state, and reduced high-density pressure support. By contrast, the generalized SU(3) sector allows posterior-supported coupling combinations with stronger repulsion in the strange sector. These combinations delay the appearance of hyperons and reduce their abundance over the density range relevant for neutron-star interiors. As a result, the SU(3) posterior predictions for the equation of state, mass\u2013radius relation, tidal deformability, and oscillation properties can remain close to those of purely nucleonic matter, whereas the SU(6) framework shows more pronounced deviations. The Bayesian model comparison shows that the present combined constraints do not meaningfully distinguish purely nucleonic matter from hyperonic matter once the generalized SU(3) interaction freedom is admitted. In contrast, the restrictive SU(6) realization is comparatively less favored by the combined data. Thus, within the adopted DDRMF parametrization and priors, current information constrains restrictive assumptions about hyperon\u2013meson couplings more effectively than it constrains the presence or absence of hyperons in neutron-star cores. The posterior also places substantial weight at values of \u03b1v below the SU(6) limit. The sensitivity analysis performed with different lower bounds on M_ max further shows that this result is not produced solely by the precise choice of the adopted threshold but arises from the combined likelihood, prior assumptions, and high-density stiffness requirements of the model. Our results show that caution is required when interpreting proposed observational signatures of hyperons. In the restrictive SU(6) scenario, early hyperon onset and stronger equation-of-state softening can generate more visible changes in the mass\u2013radius relation, tidal deformability, curvature of the mass\u2013radius curve, and oscillation properties. However, these features become much weaker when the hyperon interaction sector is generalized through the SU(3) parametrization. In particular, the SU(3) posterior can overlap substantially with the nucleonic predictions for the principal macroscopic observables. Therefore, a reduced maximum mass, enhanced mass\u2013radius curvature, or a modified oscillation spectrum should not be regarded as an unambiguous signature of hyperon formation. Such features are more directly associated with strong hyperon-induced softening under a particular interaction prescription. The appearance of individual hyperon species remains model dependent within the posterior ensemble. In particular, the onset of \u03a3 hyperons retains substantial uncertainty and depends sensitively on the allowed scalar and vector hyperon\u2013meson couplings. The inferred direct-Urca threshold distributions identify cooling-relevant regions of the posterior parameter space. However, a quantitative comparison with neutron-star cooling observations requires dedicated thermal-evolution calculations that include neutrino emissivities, baryon pairing, and envelope physics. The generalized SU(3) framework therefore provides phenomenologically viable hyperonic equations of state compatible with the present nuclear and multimessenger constraints, without requiring neutron-star observables to differ strongly from those of nucleonic matter. This should not be interpreted as a microscopic resolution of the hyperon puzzle, since the underlying hyperonic interactions remain only partially constrained and are not derived from first-principles many-body calculations. Improved hypernuclear information, microscopic constraints on hyperonic two- and three-body forces, and more precise multimessenger neutron-star observations will be required to reduce the remaining degeneracy between dense-matter composition and interaction structure.\n## Acknowledgements\nThe authors thank the referee for the careful reading of the manuscript and for the constructive suggestions, which have helped to improve the clarity, scope, and presentation of the work. The authors acknowledge the financial support from the Science and Engineering Research Board (SERB), Department of Science and Technology, Government of India, through project No. CRG/2022/000069. MS acknowledges the partial financial support from the DRDO through project No. DGTM/ERIP/GIA/24-25/010/005.", "title": "Neutron star matter with hyperons: Bayesian comparison of nucleonic and SU(6)/SU(3) hyperonic models", "arxiv_id": "2608.20989"};

<script>
const S = window.__SCENES__, CTX = window.__CONTEXT__;
const $ = (s, r) => (r || document).querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t);
  if (c) n.className = c; if (x != null) n.textContent = x; return n; };

function key() { return localStorage.getItem('p2v_key') || ''; }

// A page built by `paper2vid --serve` is opened from that same server, which
// already has a key in its environment -- asking the reader for one again is
// just friction. The same file opened from disk has no server behind it, so
// it falls back to BYOK. One artefact, both situations, decided at runtime.
let RELAY = false;
(async () => {
  try {
    const r = await fetch('/api/health', { cache: 'no-store' });
    RELAY = r.ok && (await r.json()).ok === true;
  } catch (e) { RELAY = false; }
  if (!RELAY) document.getElementById('kb').hidden = false;
})();

// Anthropic caps images around 1568px on the long edge; bigger just costs
// tokens for no gain. Plots are line art, so we keep PNG unless the payload
// is large enough that JPEG is worth the artefacts.
async function prepImage(dataUri) {
  const [head, b64] = dataUri.split(',');
  const media = head.slice(5, head.indexOf(';'));
  if (b64.length < 3_000_000) {
    const img = await new Promise((res, rej) => {
      const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUri;
    }).catch(() => null);
    if (img && Math.max(img.width, img.height) <= 1568)
      return { type: 'base64', media_type: media, data: b64 };
  }
  const img = await new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUri;
  });
  const k = Math.min(1, 1568 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const out = c.toDataURL('image/jpeg', 0.92);
  return { type: 'base64', media_type: 'image/jpeg', data: out.split(',')[1] };
}

async function ask(question, sc, into) {
  const k = key();
  if (!RELAY && !k) { into.className = 'answer err';
    into.textContent = 'Add your API key at the top of the page first. It stays in this browser.';
    return; }
  into.className = 'answer thinking'; into.textContent = 'Reading the figure...';

  const hasFig = sc.kind === 'figure' && sc.src;
  const sys = 'You are explaining a specific research paper to a curious reader '
    + 'who is not in this subfield.\n'
    + (hasFig
       ? 'The figure the reader is looking at is attached. Read it directly: '
         + 'legends, axis labels, line colours and styles, which curve is which. '
         + 'Questions about what a colour or marker represents are answered from '
         + 'the image, and you should answer them concretely.\n'
       : '')
    + 'Everything else must come from the paper context. If neither the image '
    + 'nor the context answers the question, say so plainly -- never invent '
    + 'numbers, results or comparisons. Two or three sentences. Plain words.';

  const text = 'PAPER CONTEXT:\n' + CTX.digest
    + '\n\nThe reader is looking at this part:\n' + sc.narration
    + (sc.caption ? '\nFigure caption: ' + sc.caption : '')
    + '\n\nTheir question: ' + question;

  try {
    const content = [];
    if (hasFig) {
      try { content.push({ type: 'image', source: await prepImage(sc.src) }); }
      catch (e) { /* fall back to text-only rather than failing the question */ }
    }
    content.push({ type: 'text', text });

    if (RELAY) {
      const r = await fetch('/api/ask', { method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ content, system: sys }) });
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      into.className = 'answer'; into.textContent = d.text;
      return;
    }
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': k,
                 'anthropic-version': '2023-06-01',
                 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 700,
                             system: sys,
                             messages: [{ role: 'user', content }] })
    });
    if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 200));
    const d = await r.json();
    into.className = 'answer';
    into.textContent = d.content.filter(b => b.type === 'text')
                                .map(b => b.text).join('');
  } catch (e) {
    into.className = 'answer err';
    into.textContent = 'Request failed: ' + e.message;
  }
}

function renderScene(sc) {
  const s = el('section', 'scene');
  if (sc.eyebrow) s.appendChild(el('p', 'eyebrow', sc.eyebrow));

  if (sc.kind === 'title') {
    const h = el('div', 'headcard');
    h.appendChild(el('h2', null, sc.headline));
    if (sc.deck) h.appendChild(el('p', null, sc.deck));
    s.appendChild(h);
  } else if (sc.kind === 'svg') {
    const d = el('div'); d.innerHTML = sc.svg;
    // The video bakes these reveals to a clock. Here they belong to the
    // reader's scroll: the same staged build, paced by them, not at them.
    d.querySelectorAll('[data-reveal]').forEach(n => n.removeAttribute('opacity'));
    s.appendChild(d);
  } else {
    const plate = el('div', 'plate');
    const img = new Image(); img.src = sc.src; img.alt = 'Figure ' + (sc.ref || '') + ' from the paper';
    plate.appendChild(img);
    (sc.annotations || []).forEach(a => {
      const h = el('div', 'hit');
      h.style.left = (a.x * 100) + '%'; h.style.top = (a.y * 100) + '%';
      h.appendChild(el('span', null, a.label));
      h.onclick = () => askAbout(s, sc, 'What is happening at the point labelled "'
        + a.label + '" on this figure?');
      plate.appendChild(h);
    });
    s.appendChild(plate);
    if (sc.caption) s.appendChild(el('p', 'caption', sc.caption));
    s.appendChild(el('p', 'hint', 'Click a marked point to ask about it'));
  }

  s.appendChild(el('p', 'narration', sc.narration));

  const bar = el('div', 'ask');
  const canned = [['Why does this matter?', 'Why does this part matter?'],
   ['Explain simpler', 'Explain this part again, simpler, no jargon.'],
   ['Go deeper', 'Explain the technical detail behind this part.']];
  if (sc.kind === 'figure')
    canned.splice(1, 0, ['Read this figure',
      'Walk me through this figure: what is on each axis, what each colour, '
      + 'line style and marker represents, and what the reader should notice.']);
  canned
    .forEach(([label, q]) => {
      const b = el('button', null, label);
      b.onclick = () => askAbout(s, sc, q);
      bar.appendChild(b);
    });
  const inp = el('input'); inp.placeholder = 'Ask anything about this part...';
  inp.onkeydown = e => { if (e.key === 'Enter' && inp.value.trim()) {
    askAbout(s, sc, inp.value.trim()); inp.value = ''; } };
  bar.appendChild(inp);
  s.appendChild(bar);
  return s;
}

function askAbout(section, sc, question) {
  let a = $('.answer', section);
  if (!a) { a = el('div', 'answer'); section.appendChild(a); }
  a.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  ask(question, sc, a);
}

const wrap = $('.wrap');
S.forEach(sc => wrap.appendChild(renderScene(sc)));

// Reveal groups carry a 0-1 fraction from the storyboard. Map it onto a
// stagger so a scene assembles in the order its narration explains it.
const REVEAL_MS = 950;
const obs = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const s = e.target;
    s.classList.add('in');
    s.querySelectorAll('[data-reveal]').forEach(n => {
      const f = parseFloat(n.getAttribute('data-reveal')) || 0;
      setTimeout(() => n.classList.add('lit'), 260 + f * REVEAL_MS);
    });
    s.querySelectorAll('.hit').forEach((n, i) => {
      setTimeout(() => n.classList.add('lit'), 520 + i * 220);
    });
    obs.unobserve(s);
  });
}, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
document.querySelectorAll('.scene').forEach(s => obs.observe(s));

const ki = $('#k');
ki.value = key();
ki.oninput = () => localStorage.setItem('p2v_key', ki.value.trim());
</script>
</body></html>
