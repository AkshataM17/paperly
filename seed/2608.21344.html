    <h1>Why Bottomonium Dies the Same at RHIC and the LHC</h1>
    <p class="src">Bottomonium transport in the sQGP at RHIC and the LHC &nbsp;·&nbsp;
      <a href="https://arxiv.org/abs/2608.21344"

<script>
window.__SCENES__ = [{"id": "s1", "narration": "Here's the puzzle. Smash gold nuclei at RHIC and lead nuclei at the LHC. The LHC fireball runs hundreds of degrees hotter. You'd expect far more quarkonium melting there. But measurements show bottomonium \u2014 the bound state of a bottom quark and its antiparticle \u2014 suppressed by almost the same amount at both colliders. That shouldn't happen.", "kind": "title", "eyebrow": "THE PUZZLE", "headline": "Same suppression, very different temperatures", "deck": "RHIC runs at 0.2 TeV. The LHC runs at 5 TeV. The R_AA looks nearly identical."}, {"id": "s2", "narration": "Bottomonium is a thermometer for the quark-gluon plasma. A bound state melts when the surrounding medium gets hot enough to screen its binding energy. Different states \u2014 ground state Upsilon-1S, excited 2S, 3S \u2014 melt at different temperatures. This sequential melting was supposed to give us a clean ladder of suppression with collision energy. It doesn't.", "kind": "svg", "eyebrow": "THE PROBE", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\">\n  <text x=\"960\" y=\"230\" text-anchor=\"middle\" class=\"p2v-head\" font-size=\"32\" fill=\"#1A1D23\">THREE BOTTOMONIUM STATES</text>\n  <text x=\"960\" y=\"278\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"22\" fill=\"#6B7280\">Each melts at a different temperature \u2014 a built-in thermometer</text>\n</g>\n<g data-reveal=\"0.3\">\n  <rect x=\"300\" y=\"340\" width=\"260\" height=\"90\" fill=\"none\" stroke=\"#2A6F97\" stroke-width=\"2\"/>\n  <text x=\"430\" y=\"385\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"18\" fill=\"#2A6F97\">\u03a5(1S)</text>\n  <text x=\"430\" y=\"412\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"16\" fill=\"#6B7280\">GROUND STATE</text>\n  <rect x=\"680\" y=\"340\" width=\"260\" height=\"90\" fill=\"none\" stroke=\"#2A6F97\" stroke-width=\"2\"/>\n  <text x=\"810\" y=\"385\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"18\" fill=\"#2A6F97\">\u03a5(2S)</text>\n  <text x=\"810\" y=\"412\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"16\" fill=\"#6B7280\">FIRST EXCITED</text>\n  <rect x=\"1060\" y=\"340\" width=\"260\" height=\"90\" fill=\"none\" stroke=\"#D6215F\" stroke-width=\"2\"/>\n  <text x=\"1190\" y=\"385\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"18\" fill=\"#D6215F\">\u03a5(3S)</text>\n  <text x=\"1190\" y=\"412\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"16\" fill=\"#6B7280\">MOST FRAGILE</text>\n</g>\n<g data-reveal=\"0.65\">\n  <text x=\"960\" y=\"540\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#1A1D23\">Sequential melting predicts stronger suppression at higher energy.</text>\n  <text x=\"960\" y=\"572\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#D6215F\">Experiment disagrees.</text>\n</g>\n</svg>"}, {"id": "s3", "narration": "The framework here tracks each bottomonium state through a kinetic rate equation. The number of states at any time depends on two things: the rate at which they're destroyed by the plasma, and an equilibrium limit \u2014 how many would exist if the medium stayed at that temperature forever. Suppression is the first term. Regeneration is the second.", "kind": "title", "eyebrow": "THE EQUATION", "headline": "dN/dt = \u2212\u0393 \u00b7 N  +  \u0393 \u00b7 N_eq", "deck": "Destruction pulls N down. Regeneration pushes it back toward equilibrium."}, {"id": "s4", "narration": "The reaction rates come from a nonperturbative quantum many-body calculation \u2014 the thermodynamic T-matrix approach \u2014 constrained by lattice QCD data on Wilson line correlators. The result is unusually large rates: the quark-gluon plasma couples strongly, not weakly. Thermal partons carry widths in excess of 0.5 GeV. This is the strongly coupled quark-gluon plasma, or sQGP.", "kind": "title", "eyebrow": "THE KEY INPUT", "headline": "Rates from lattice QCD, not perturbation theory", "deck": "Thermal parton widths exceed 0.5 GeV \u2014 the hallmark of strong coupling."}, {"id": "s5", "narration": "Large rates have a dramatic consequence at the LHC. The excited states \u2014 2S and 3S \u2014 are driven toward their equilibrium limits almost instantly. Their primordial population is essentially wiped out within the first fraction of a femtometer. What you measure at the detector isn't survivors. It's regenerated states, re-formed from bottom quarks wandering through the cooling plasma.", "kind": "svg", "eyebrow": "LHC REGIME", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\">\n  <text x=\"960\" y=\"210\" text-anchor=\"middle\" class=\"p2v-head\" font-size=\"28\" fill=\"#1A1D23\">FATE OF EXCITED STATES AT THE LHC</text>\n</g>\n<g data-reveal=\"0.2\">\n  <line x1=\"200\" y1=\"820\" x2=\"1750\" y2=\"820\" stroke=\"#DCDAD4\" stroke-width=\"1\"/>\n  <text x=\"200\" y=\"855\" class=\"p2v-lab\" font-size=\"15\" fill=\"#6B7280\">EARLY TIME</text>\n  <text x=\"1680\" y=\"855\" class=\"p2v-lab\" font-size=\"15\" fill=\"#6B7280\">LATE TIME</text>\n  <line x1=\"200\" y1=\"280\" x2=\"200\" y2=\"820\" stroke=\"#DCDAD4\" stroke-width=\"1\"/>\n  <text x=\"140\" y=\"280\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"15\" fill=\"#6B7280\" transform=\"rotate(-90,140,560)\">YIELD</text>\n</g>\n<g data-reveal=\"0.4\">\n  <polyline points=\"200,300 400,680 700,750 1100,760 1750,765\" fill=\"none\" stroke=\"#6B7280\" stroke-width=\"2\" stroke-dasharray=\"6,4\"/>\n  <text x=\"1760\" y=\"755\" class=\"p2v-lab\" font-size=\"14\" fill=\"#6B7280\">PRIMORDIAL</text>\n</g>\n<g data-reveal=\"0.65\">\n  <polyline points=\"200,820 400,790 700,760 1100,755 1750,755\" fill=\"none\" stroke=\"#D6215F\" stroke-width=\"2.5\"/>\n  <text x=\"1760\" y=\"750\" class=\"p2v-lab\" font-size=\"14\" fill=\"#D6215F\">REGENERATED</text>\n  <text x=\"960\" y=\"910\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"19\" fill=\"#D6215F\">Regeneration is the dominant source \u2014 even in peripheral collisions</text>\n</g>\n</svg>"}, {"id": "s6", "narration": "The ground state, Upsilon-1S, is different. It's more tightly bound, so it melts at a higher temperature, and a meaningful fraction of the primordial population survives even in central collisions at the LHC. The final yield is a mixture: some original states that made it through, plus a regenerated component. Both matter for the 1S.", "kind": "svg", "eyebrow": "\u03a5(1S) IS DIFFERENT", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\">\n  <text x=\"960\" y=\"220\" text-anchor=\"middle\" class=\"p2v-head\" font-size=\"28\" fill=\"#1A1D23\">\u03a5(1S): TWO SURVIVING COMPONENTS</text>\n</g>\n<g data-reveal=\"0.25\">\n  <rect x=\"220\" y=\"310\" width=\"620\" height=\"480\" fill=\"#EDE9E0\" stroke=\"#DCDAD4\" stroke-width=\"1\"/>\n  <text x=\"530\" y=\"360\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"17\" fill=\"#2A6F97\">PRIMORDIAL</text>\n  <text x=\"530\" y=\"500\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"52\" fill=\"#2A6F97\">~30%</text>\n  <text x=\"530\" y=\"570\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"17\" fill=\"#6B7280\">survives in central</text>\n  <text x=\"530\" y=\"598\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"17\" fill=\"#6B7280\">Pb-Pb collisions</text>\n</g>\n<g data-reveal=\"0.55\">\n  <rect x=\"1080\" y=\"310\" width=\"620\" height=\"480\" fill=\"#EDE9E0\" stroke=\"#DCDAD4\" stroke-width=\"1\"/>\n  <text x=\"1390\" y=\"360\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"17\" fill=\"#D6215F\">REGENERATED</text>\n  <text x=\"1390\" y=\"500\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"52\" fill=\"#D6215F\">+</text>\n  <text x=\"1390\" y=\"570\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"17\" fill=\"#6B7280\">re-formed from</text>\n  <text x=\"1390\" y=\"598\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"17\" fill=\"#6B7280\">wandering b quarks</text>\n</g>\n<g data-reveal=\"0.8\">\n  <text x=\"960\" y=\"860\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"20\" fill=\"#1A1D23\">Only the ground state retains memory of its initial population at the LHC.</text>\n</g>\n</svg>"}, {"id": "s7", "narration": "Now the puzzle resolves. At RHIC, temperatures are lower, so regeneration is a smaller effect. But combined with nuclear absorption \u2014 cold nuclear matter effects \u2014 the total suppression lands at roughly the same level as at the LHC, where higher temperatures destroy more primordial states but also regenerate more. Two different mechanisms, same observed ratio. That's the explanation.", "kind": "svg", "eyebrow": "THE RESOLUTION", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\n     viewBox=\"0 0 1920 1080\" width=\"1920\" height=\"1080\">\n  <style>\n    .p2v-bg   { fill: #F7F6F3; }\n    .p2v-head { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 72px; font-weight: 650;\n                 letter-spacing: -0.02em; fill: #1A1D23; }\n    .p2v-deck { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 40px; font-weight: 450;\n                 letter-spacing: -0.01em; fill: #6B7280; }\n    .p2v-lab  { font-family: JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace; font-size: 22px; font-weight: 500;\n                 letter-spacing: 0.14em; fill: #1A1D23; }\n    .p2v-cap  { font-family: Inter Tight, Inter, Helvetica Neue, DejaVu Sans, sans-serif; font-size: 24px; font-weight: 400;\n                 fill: #6B7280; }\n    .p2v-sig  { fill: #D6215F; }\n    .p2v-lead { stroke: #D6215F; stroke-width: 1.5; fill: none; }\n    .p2v-rule { stroke: #DCDAD4; stroke-width: 1; }\n    </style>\n  <rect class=\"p2v-bg\" x=\"0\" y=\"0\" width=\"1920\" height=\"1080\"/>\n  \n  <line class=\"p2v-rule\" x1=\"120\" y1=\"106\" x2=\"1800\" y2=\"106\"/>\n  <g data-reveal=\"0.0\">\n  <text x=\"960\" y=\"215\" text-anchor=\"middle\" class=\"p2v-head\" font-size=\"26\" fill=\"#1A1D23\">SIMILAR R_AA, VERY DIFFERENT PHYSICS</text>\n</g>\n<g data-reveal=\"0.2\">\n  <rect x=\"180\" y=\"280\" width=\"700\" height=\"500\" fill=\"none\" stroke=\"#2A6F97\" stroke-width=\"2\"/>\n  <text x=\"530\" y=\"330\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#2A6F97\">RHIC  0.2 TeV</text>\n  <text x=\"530\" y=\"410\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"17\" fill=\"#1A1D23\">Lower temperature</text>\n  <text x=\"530\" y=\"445\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"17\" fill=\"#1A1D23\">Less regeneration</text>\n  <text x=\"530\" y=\"480\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"17\" fill=\"#1A1D23\">+ nuclear absorption</text>\n  <text x=\"530\" y=\"640\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"28\" fill=\"#2A6F97\">R_AA \u2248 similar</text>\n</g>\n<g data-reveal=\"0.5\">\n  <rect x=\"1040\" y=\"280\" width=\"700\" height=\"500\" fill=\"none\" stroke=\"#D6215F\" stroke-width=\"2\"/>\n  <text x=\"1390\" y=\"330\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"20\" fill=\"#D6215F\">LHC  5.02 TeV</text>\n  <text x=\"1390\" y=\"410\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"17\" fill=\"#1A1D23\">Higher temperature</text>\n  <text x=\"1390\" y=\"445\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"17\" fill=\"#1A1D23\">More suppression</text>\n  <text x=\"1390\" y=\"480\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"17\" fill=\"#1A1D23\">+ more regeneration</text>\n  <text x=\"1390\" y=\"640\" text-anchor=\"middle\" class=\"p2v-lab\" font-size=\"28\" fill=\"#D6215F\">R_AA \u2248 similar</text>\n</g>\n<g data-reveal=\"0.8\">\n  <line x1=\"880\" y1=\"280\" x2=\"1040\" y2=\"780\" stroke=\"#DCDAD4\" stroke-width=\"1\" stroke-dasharray=\"5,4\"/>\n  <text x=\"960\" y=\"870\" text-anchor=\"middle\" class=\"p2v-cap\" font-size=\"18\" fill=\"#6B7280\">Cancellation is the answer, not coincidence.</text>\n</g>\n</svg>"}, {"id": "s8", "narration": "The transverse-momentum spectra carry a further signature. Regenerated bottomonium inherits the thermal motion of bottom quarks in the plasma, so it's concentrated at low transverse momentum. Primordial states, produced hard, peak at higher momenta. Their ratio shifts the spectrum. The calculation reproduces CMS, ATLAS, and ALICE data reasona window.__CONTEXT__ = {"digest": "TITLE: Bottomonium transport in the sQGP at RHIC and the LHC\nARXIV: 2608.21344\nABSTRACT: Bottomonium transport is studied in heavy-ion collisions at RHIC and the LHC by implementing a kinetic rate equation into (3+1)D viscous hydrodynamic simulations of an expanding quark-gluon plasma (QGP). The two main transport parameters are the inelastic reaction rates and equilibrium limits for each individual bottomonium state, Y . The former are taken from the thermodynamic T -matrix formalism with recent constraints from lattice-QCD and including interference effects and in-medium binding energies, resulting in large rates characteristic of a strongly coupled QGP. The equilibrium limits are evaluated from pertinent in-medium bottomonium and bottom-quark masses. The calculation of observables includes a total of nine Y states (up to 3 S and 2 P ) with a feed-down matrix estimated from vacuum branching fractions. At the LHC, the large reaction rates rapidly suppress the initial population of excited states, rendering regeneration their main source even in rather peripheral collisions, while for the more strongly bound ground state , a significant primordial component survives in central collisions. On the other hand, at RHIC energies, regeneration is overall a smaller effect. Together with effects from nuclear absorption, this offers an explanation for the experimental observation that production at RHIC and the LHC is of comparable magnitude despite the significantly higher temperatures reached in the QGP at the LHC.\n\nEQUATIONS (LaTeX):\n  N_{Y}(\\tau)=N_{Y}(\\tau_{0})\\,\\exp\\!\\left[-\\!\\!\\int_{\\tau_{0}}^{\\tau}\\Gamma_{Y}[T(\\tau^{\\prime})]\\mathrm{d}\\tau^{\\prime}\\right]\\,,\n  p^{\\mu}_{\\rm lab}=\\bigl(p^{0},\\mathbf{p}\\bigr)=\\bigl(m_{T}\\cosh y,\\;p_{T}\\cos\\phi,\\;p_{T}\\sin\\phi,\\;m_{T}\\sinh y\\bigr)\\ ,\n  p^{\\mu}_{\\rm rest}=\\Lambda^{\\mu}{}_{\\!\\nu}\\,p^{\\nu}_{\\rm lab}\\,,\n  \\vec{x}(t)=\\vec{x}_{0}+\\vec{v}\ me at the SPS and RHIC to a relative enhancement at the LHC, bottomonia (which we generically refer to as Y states) remain strongly suppressed even at the LHC, especially for the excited states. This has been interpreted as the originally proposed sequential suppression signature referring to a hierarchy in the various Y dissociation temperatures. However, within kinetic transport models, the role of regeneration in the observed Y yields is still controversial: While quantum transport approaches essentially attribute the observed production pattern to suppression reactions, semiclassical simulations vary in their predictions for the magnitude of the regeneration component 11. Even if there is only a single pair in the QGP fireball, the fact that the bottom quark and antiquark are produced in association implies that their density is constrained to a rather small sub-volume of the fireball, which notably increases the probability to (re-)form a bound state. This possibility is expected to be exacerbated in a strongly coupled QGP (sQGP), since (a) the b and have a small spatial diffusion coefficient and thus are slowed down compared to a vacuum environment 51, and (b) large collision rates of the b quarks enhance the chemical reaction rates to (re-)form Y states. Furthermore, given the low production rate of Y states of approximately 0.1% relative to the open yield (compared with for charmonia), even a small regeneration probability can contribute very significantly to the observed R_ AA of Y states; e.g., if only one in 1000 pairs produced in nucleus-nucleus (AA) collisions regenerates a Y state, it contributes of order one to its R_ AA . To date, a broad variety of transport models have been able to reproduce Y data from the ALICE, ATLAS, and CMS collaborations in Pb-Pb collisions at the LHC 39; 4; 6; 1; 46. A somewhat surprising feature is found in Au-Au collisions at RHIC 3, where the level of observed suppression is very similar to that at the LHC, despite significantly lower initial temperatures at collision energies of 0.2 TeV compared to 5 TeV at the LHC. This has posed a challenge to theoretical models that rely solely on suppression mechanisms, and even modest regeneration components cannot resolve this tension 18. In the present work, we expand on our previous study 47, where we implemented recent calculations of nonperturbative bottomonium reaction rates into a viscous hydrodynamic evolution (aHydro). The reaction rates are adopted from thermodynamic T -matrix amplitudes whose input potential has been constrained by state-of-the-art Wilson line correlators (WLCs) computed in lattice QCD 43. The constraints also encompass the lattice-QCD (lQCD) equation of state (EoS) which was computed from thermal-parton interactions using the same underlying potential in a self-consistent numerical iteration procedure using the Luttinger-Ward-Baym formalism 33. In this way, the microscopic quarkonium reaction rates are calculated in a QGP medium whose EoS, reproducing lQCD data, governs the macroscopic dynamics of the hydrodynamic evolution. Key outcomes of the quantum many-body approach are large collisional widths of the partonic degrees of freedom (in excess of 0.5 GeV for both thermal light partons and heavy quarks) which are at the core of the strong-coupling properties of the sQGP (such as its transport parameters). The applications to basic R_ AA observa\n## 2 Bottomonium suppression in hydrodynamics\nIn Sec. 2.1 we first recall the kinetic rate equation and its transport parameters and then focus on the hot-medium suppression of Y states, thereby defining the appropriate transformation from the lab into the rest frame of the hydrodynamic medium. In Sec. 2.2 we briefly summarize the main features of the (3+1)D anisotropic hydrodynamics that we employ to sample Y trajectories and record local temperatures along them (which are subsequently used to compute Y suppression). In Sec. 2.3 we recall our schematic implementation of formation time effects in the evolution from the hard (point-like) production to the fully formed bound state. In Sec. 2.4 we summarize our treatment of cold-nuclear-matter (CNM) effects, most notably nuclear shadowing, while Sec. 2.5 describes late-time feed-down from excited states needed to assess the \u201cprompt\u201d production yields as measured in experiment. The kinetic rate equation for the number, NY(\u03c4) , of a bottomonium state, Y , at time \u03c4 reads 52 where NY^ eq(T(\u03c4)) is the equilibrium limit, and \u0393Y[T(\u03c4)] is the reaction rate at the corresponding temperature. Focusing on the suppression part for now, the solution of the rate equation (1) for each state reads which characterizes the survival probability against medium\u2010induced breakup. Here, \u03c4\u2080 denotes the aHydro initialization time at which the hydrodynamic evolution starts (typically \u03c4\u2080 =0.25 fm /c ). In the present work we focus on the transport in the QGP, which we carry out for all considered Y states down to a decoupling (or hadronization) temperature of T_ h =170 MeV. Little is currently known about Y reaction rates in the hadronic phase, and neglecting them should be a good approximation up to the 3S and 2P states whose vacuum binding energies are larger than T_ h . The reaction rates depend on the in-medium Y binding energies and radii, as well as on the masses of the bottom quarks and their coupling to the QGP medium. These quantities are obtained from a self-consistent, non-perturbative T -matrix calculation where the input potential is constrained by lQCD results for Wilson line correlators 43. Specifically, an analysis of the pertinent Y spectral functions in the complex energy plane has been carried out to quantitatively extract the masses and widths from the pole positions, as well as the melting temperatures from the disappearance of the poles 44; 49. Since in Eq. (2) the temperature-dependent quarkonium reaction rates are defined in the rest frame of the medium, one has to boost the bottomonium four-momentum from the lab frame into the thermal frame. We denote the four-momentum of the bottomonium pair in the laboratory frame by with transverse mass , rapidity y , and azimuthal angle \u03c6 . Furthermore, denoting the four-velocity of the hydro cell at the position of the pair by u^\u03bc=\u03b3 (1,v) , we can obtain the momentum in the rest frame as with a Lorentz-boost matrix, For simplicity, we set \u03b2z=0 in the hydrodynamic model. We utilize (3+1)D anisotropic hydrodynamics (aHydro) to describe the expansion of the QGP liquid in AA collisions, with parameters tuned to reproduce experimentally observed soft-hadron spectra, charged-hadron multiplicities, elliptic flow, and Hanbury-Brown-Twiss (HBT) radii at both RHIC and LHC energies 9; 10. The simulations employ an EoS consistent with lQCD computations 14, with a temperature-dependent entropy density depicted in Fig. 1, as well as second- and higher-order transport coefficients (including non-conformal effects such as bulk viscosity), which are self-consistently computed within a quasiparticle model. The latter\u2019s parameters are fixed to obtain a temperature-independent shear viscosity to entropy density ratio of \u03b7/s=0.179 , as part of the fit to soft observables. A smooth optical Glauber\n## 3 Bottomonium regeneration in a hydrodynamic background\nIn this section we describe the evaluation of bottomonium regeneration in the hydrodynamic background. In terms of the rate equation, this corresponds to its inhomogeneous solution, which can be written as In Sec. 3.1, we first introduce the equilibrium limit in a homogeneous fireball. In Sec. 3.2 we discuss how the escape of pairs from the fireball reduces the effective number of pairs available for regeneration, and in Sec. 3.3 we extend the equilibrium-limit calculation to a space-time-dependent medium as present in hydrodynamic simulations. For a homogeneous fireball of volume V_ FB at temperature T , the equilibrium number of a state Y is given by the Boltzmann distribution, where K\u2082 is the modified Bessel function of the second kind and dY=2JY+1 is the spin degeneracy. The fugacity \u03b3b is fixed by bottom-antibottom conservation 16, where n_ op and n_ hid denote the total open- and hidden-bottom densities, respectively, and I\u2080 and I\u2081 are the modified Bessel functions of the first kind. The correlation volume 27; 25 enforces local conservation after the initial point-like production, where fm is a typical strong-interaction range and is an average b quark recoil velocity estimated from B -meson pT spectra 18. The open-bottom density, , is the key quantity to convert the number of pairs into the bottom fugacity whose square enters into the computation of the Y equilibrium limits. In addition to the freely moving b and quarks in the QGP, we include ground ( J=0 ) and first excited ( J=1 ) B mesons, similar to what has been done in the charm sector in Ref. 52. This accounts for the onset of hadronic bound-state formation when the temperature drops toward the hadronization temperature, which is borne out by both lQCD 12 and T -matrix calculations 34. The ground states represent the most robust mesonic open-bottom channels. We neglect contributions from bottom baryons and higher excited open-bottom states which are expected to be approximately offset by a reduced pole strength of broadened in-medium B -meson states. Their contribution is smoothly switched off toward high temperatures using a hyperbolic-tangent parametrization centered around T=1.3 T_ h , where the B -meson contribution is reduced to half of its low-temperature value. Consequently, the open-bottom density reduces to the bottom-quark density in the high-temperature QGP. The Y states are negligible for the calculation of the fugacity. The total bottom number is determined by the production cross section in pp collisions and the number of binary collisions N_ coll in an AA collision over a rapidity interval \u0394 y=1.8 , corresponding to the effective rapidity coverage of a thermal fireball (over which all inputs are evaluated), For the total inelastic cross section, we use \u03c3^ inel_ pp=67.6(42) mb at 5.02(0.2) TeV. In Fig. 8 we display per unit rapidity at mid-rapidity versus impact parameter b for Pb-Pb (5.02 TeV) and Au-Au (200 GeV) collisions. One also has to account for incomplete thermalization of b quarks in the QGP which suppresses the phase space for Y production. We apply a thermal-relaxation time correction via a factor 24; 40 that effectively reduces the equilibrium bottomonium yield as The bottom-quark relaxation time is related to the momentum- and temperature-dependent bottom-quark drag coefficient, \u03c4b(p,T)=1/A(p,T) . Within the same nonperturbative framework used for the Y reaction rates, i.e., constrained by WLCs 43, the resulting relaxation times are shown in Fig. 9 for several b quark momenta and compared to the input previously used in Ref. 18. In the present calculation, we approximate as a representative relaxation time for b quark kinetic equilibration. Bottom-antibottom quark pairs are produced upon initial impact in a heavy-ion coll\n## 4 Time evolution and comparisons to experiment\nWe are now in a position to examine our final results for Y suppression and regeneration in the evolving medium and compare them with experimental observables. In Sec. 4.1, we study the time evolution of bottomonium yields at the R_ AA level throughout the hydrodynamic background. In Sec. 4.2 we turn to comparisons with measurements at LHC energies; this includes centrality dependencies (including a benchmark against previous results with perturbative medium coupling) in Sec. 4.2.1 and transverse-momentum spectra in Sec. 4.2.2. In Sec. 4.3, we extend our analysis to RHIC energies, where we discuss both the centrality dependence and transverse-momentum dependence and compare with available STAR data. While the suppression of the primordially produced states commences right after the aHydro initialization time at \u03c4=\u03c4\u2080 (including formation time effects), the onset of regeneration depends on the \u201cmelting\u201d temperature, T_ melt , of each individual bound state; that is, once the temperature of the ambient medium drops below T_ melt , regeneration commences (if the initial temperature in the hydro evolution is below T_ melt , the regeneration rates are also subject to the same formation time effects, as dictated by detailed balance). In previous calculations 52; 48, the melting temperature was assumed to coincide with the vanishing of the binding energy, EB=0 , of each state. However, in recent work a rigorous criterion has been introduced based on the vanishing of the bound-state pole in the complex-energy plane 44. It was found that, in a strongly coupled QGP, bottomonium states can survive at temperatures beyond the vanishing of their binding energy, i.e., as resonance states above their nominal mass threshold. This obviously leads to larger melting temperatures, as summarized in Table 3. In our present calculations, for the onset of regeneration, corresponding to the lower limit, \u03c4_ reg , of the time integral in the solution to the inhomogeneous rate equation (25), we adopt the rigorous pole criterion. However, due to the very large reaction rates in the sQGP, particularly those of the excited states, their yields are quickly driven toward equilibrium, and thus the EB=0 criterion gives very similar results, i.e., the precise choice of the onset time is immaterial. In Figs. 12 and 13, we summarize the time evolution of primordial and regenerated components for Pb-Pb collisions at the LHC at two different impact parameters, b=4.2 fm and 9.2 fm. The upper panels show the survival probability along trajectories for the 1S , 2S , and 3S states (same trajectories for each state at each collision centrality; the final suppression factor is given by the average of the trajectory endpoints). The lower panels illustrate the regeneration based on the trajectory-averaged temperature, T_ avg(\u03c4) , using the equilibrium limit constructed in Sec. 3.3. As expected, the primordial 1S state has significantly higher survival probabilities than the 2S and 3S states, but the spread from different trajectories is rather large for all states. The regeneration of the 1S state is coupled to an appreciable equilibrium population at the R_ AA level, but it saturates well before the end of the evolution due to small reaction rates in the late stages. By contrast, the 2S and 3S states have smaller equilibrium numbers and higher reaction rates, quickly reaching and remaining near their equilibrium limits until relatively late in the evolution. Section 4.2.1 contains the centrality dependence of 1S , 2S , and 3S R_ AA \u2019s and their ratios at mid- and forward rapidity, while Sec. 4.2.2 focuses on pT dependencies. In the comparisons to experimental data presented below, we include two sources of model uncertainty: CNM effects and different values for\n## 5 Conclusion\nWe have conducted a comprehensive study of bottomonium production in Pb-Pb ( 5.02 TeV ) and Au-Au ( 200 GeV ) collisions by coupling a kinetic rate equation to a (3+1)D quasiparticle anisotropic hydrodynamic model. This framework improves on previous calculations, where a more schematic fireball evolution and/or perturbative Y reaction rates have been used. By decomposing the general solution to the rate equation into a sum of the homogeneous (representing suppression of primordial Y production) and inhomogeneous solutions (which is driven by regeneration), we have evaluated the former component by sampling Y eikonal trajectories through the hydrodynamically evolving QGP, utilizing recently developed nonperturbative reaction rates which were constrained by lattice-QCD data through quantum many-body theory (thermodynamic T -matrix approach). Initial conditions have been implemented via an optical Glauber model and cold-nuclear matter effects (such as nuclear shadowing and absorption) and followed by quantum-formation time effects (estimated through a reduced rate related to an expanding wave packet), while final-state feed-down from excited states has been based on experimental branching ratios. Bottomonium regeneration has been evaluated with the same reaction rates as the suppression (as dictated by detailed balance), but the calculation of the equilibrium limit \u2013 as the second main transport coefficient \u2013 required an extension that accounts for the temperature gradients present in the hydrodynamic medium at any given proper time. To this end, we have computed the total entropy contained within the thermodynamically active medium to evaluate the thermal-equilibrium number for time-dependent trajectory-averaged temperatures. Further corrections included correlation-volume effects arising from the initial point-like pair production, thermal relaxation times associated with the diffusion of b quarks, as well as their escape from the fireball. In addition, the same melting temperatures (defining the onset of regeneration) and formation-time delays as in the suppression part have been incorporated. While significant uncertainties in our framework persist, its major components, i.e., the nonperturbative reaction rates and the hydrodynamic bulk medium evolution, do not involve tunable parameters. Moreover, these components constitute a mutually consistent implementation of the strongly coupled QGP where the microscopic reaction rates are evaluated in an interacting medium with a universal potential that, in turn, can describe the lattice-QCD equation of state used in the hydrodynamic evolution. Our results at the LHC suggest that regeneration contributes substantially to the total yields and transverse-momentum spectra of , , and , and significantly affects their double ratios. The computed nuclear modification factors as a function of transverse momentum and collision centrality are in fair agreement with measurements reported by the CMS, ATLAS, and ALICE collaborations, with a thus far unresolved tension at transverse momenta larger than the Y mass, for all states. On the other hand, the rather large regeneration caused by the large reaction rates offers a possible resolution of the puzzle at RHIC, i.e., a suppression level very similar to that at the LHC: significantly less regeneration, together with a moderate nuclear absorption cross section results in a reasonable description of the R_ AA of the observed states at RHIC. A number of further developments are in order. The schematic thermal relaxation approximation for b quark thermalization should be improved by implementing a coupled transport approach between open and hidden heavy-flavor states, along the lines of the calculation carried out in Ref. 22 in the ch\n## Acknowledgments\nWe thank S. Thapa and R. Vogt for helpful comments on the manuscript. This work is supported by the U.S. National Science Foundation under grant no. PHY-2514775 and the Topical Collaboration in Nuclear Theory on Heavy-Flavor Theory (HEFTY) for QCD Matter under award no. DE-SC0023547.", "title": "Bottomonium transport in the sQGP at RHIC and the LHC", "arxiv_id": "2608.21344"};

// Anthropic caps images around 1568px on the long edge; bigger just costs

async function prepImage(dataUri) {
  const [head, b64] = dataUri.split(',');
  const media = head.slice(5, head.indexOf(';'));
  if (b64.length < 3_000_000) {
    const img = await new Promise((res, rej) => {
      const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUri;

    if (img && Math.max(img.width, img.height) <= 1568)
      return { type: 'base64', media_type: media, data: b64 };
  }
  const img = await new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUri;
  });
  const k = Math.min(1, 1568 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');

  return { type: 'base64', media_type: 'image/jpeg', data: out.split(',')[1] };
}

  const hasFig = sc.kind === 'figure' && sc.src;
  const sys = 'You are explaining a specific research paper to a curious reader '
    + 'who is not in this subfield.\n'
    + (hasFig
       ? 'The figure the reader is looking at is attached. Read it directly: '
         + 'legends, axis labels, line colours and styles, which curve is which. '
         + 'Questions about what a colour or marker represents are answered from '
         + 'the image, and you should answer them concretely.\n'
       : '')
    + 'Everything else must come from the paper context. If neither the image '
    + 'nor the context answers the question, say so plainly -- never invent '
    + 'numbers, results or comparisons. Two or three sentences. Plain words.';

  const text = 'PAPER CONTEXT:\n' + CTX.digest
    + '\n\nThe reader is looking at this part:\n' + sc.narration
    + (sc.caption ? '\nFigure caption: ' + sc.caption : '')
    + '\n\nTheir question: ' + question;

  try {
    const content = [];
    if (hasFig) {
      try { content.push({ type: 'image', source: await prepImage(sc.src) }); }
      catch (e) { /* fall back to text-only rather than failing the question */ }
    }
    content.push({ type: 'text', text });

    if (RELAY) {
      const r = await fetch('/api/ask', { method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ content, system: sys }) });
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      into.className = 'answer'; into.textContent = d.text;
      return;
    }
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': k,
                 'anthropic-version': '2023-06-01',
                 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 700,
                             system: sys,
                             messages: [{ role: 'user', content }] })
    });
    if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 200));
    const d = await r.json();
    into.className = 'answer';
    into.textContent = d.content.filter(b => b.type === 'text')
                                .map(b => b.text).join('');
  } catch (e) {
    into.className = 'answer err';
    into.textContent = 'Request failed: ' + e.message;
  }
}

function renderScene(sc) {
  const s = el('section', 'scene');
  if (sc.eyebrow) s.appendChild(el('p', 'eyebrow', sc.eyebrow));

  if (sc.kind === 'title') {
    const h = el('div', 'headcard');
    h.appendChild(el('h2', null, sc.headline));
    if (sc.deck) h.appendChild(el('p', null, sc.deck));
    s.appendChild(h);
  } else if (sc.kind === 'svg') {
    const d = el('div'); d.innerHTML = sc.svg;
    // The video bakes these reveals to a clock. Here they belong to the
    // reader's scroll: the same staged build, paced by them, not at them.
    d.querySelectorAll('[data-reveal]').forEach(n => n.removeAttribute('opacity'));
    s.appendChild(d);
  } else {
    const plate = el('div', 'plate');
    const img = new Image(); img.src = sc.src; img.alt = 'Figure ' + (sc.ref || '') + ' from the paper';
    plate.appendChild(img);
    (sc.annotations || []).forEach(a => {
      const h = el('div', 'hit');
      h.style.left = (a.x * 100) + '%'; h.style.top = (a.y * 100) + '%';
      h.appendChild(el('span', null, a.label));
      h.onclick = () => askAbout(s, sc, 'What is happening at the point labelled "'
        + a.label + '" on this figure?');
      plate.appendChild(h);
    });
    s.appendChild(plate);
    if (sc.caption) s.appendChild(el('p', 'caption', sc.caption));
    s.appendChild(el('p', 'hint', 'Click a marked point to ask about it'));
  }

  s.appendChild(el('p', 'narration', sc.narration));

  const bar = el('div', 'ask');
  const canned = [['Why does this matter?', 'Why does this part matter?'],
   ['Explain simpler', 'Explain this part again, simpler, no jargon.'],
   ['Go deeper', 'Explain the technical detail behind this part.']];
  if (sc.kind === 'figure')
    canned.splice(1, 0, ['Read this figure',
      'Walk me through this figure: what is on each axis, what each colour, '
      + 'line style and marker represents, and what the reader should notice.']);
  canned
    .forEach(([label, q]) => {
      const b = el('button', null, label);
      b.onclick = () => askAbout(s, sc, q);
      bar.appendChild(b);
    });
  const inp = el('input'); inp.placeholder = 'Ask anything about this part...';
  inp.onkeydown = e => { if (e.key === 'Enter' && inp.value.trim()) {
    askAbout(s, sc, inp.value.trim()); inp.value = ''; } };
  bar.appendChild(inp);
  s.appendChild(bar);
  return s;
}

function askAbout(section, sc, question) {
  let a = $('.answer', section);
  if (!a) { a = el('div', 'answer'); section.appendChild(a); }
  a.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  ask(question, sc, a);
}

const wrap = $('.wrap');
S.forEach(sc => wrap.appendChild(renderScene(sc)));

// Reveal groups carry a 0-1 fraction from the storyboard. Map it onto a
// stagger so a scene assembles in the order its narration explains it.
const REVEAL_MS = 950;
const obs = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const s = e.target;
    s.classList.add('in');
    s.querySelectorAll('[data-reveal]').forEach(n => {
      const f = parseFloat(n.getAttribute('data-reveal')) || 0;
      setTimeout(() => n.classList.add('lit'), 260 + f * REVEAL_MS);
    });
    s.querySelectorAll('.hit').forEach((n, i) => {
      setTimeout(() => n.classList.add('lit'), 520 + i * 220);
    });
    obs.unobserve(s);
  });
}, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
document.querySelectorAll('.scene').forEach(s => obs.observe(s));

const ki = $('#k');
ki.value = key();
ki.oninput = () => localStorage.setItem('p2v_key', ki.value.trim());
</script>
</body></html>
